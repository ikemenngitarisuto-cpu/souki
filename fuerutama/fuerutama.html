/* ── 世界の決まり ───────────────────────────────── */
const R = 500;            // 円の半径（世界の単位）
const MAXN = 101000;      // 玉の数の上限（「10 万個」まで）
const V0 = 430;           // 玉のふだんの速さ（単位/秒）
const STIFF = .9, E_BB = .92, E_W = .86, E_M = .45;   // 玉どうしの押し返し・はね返り、壁のはね返り、仕掛けのはね返り
const MU = .5;            // 仕掛けに押されたとき、面に沿った動きをどれだけ止めるか（すべり止め）
const SQZ = .14;          // 2 つの面から逆向きに押されて、めり込みがこれ（半径に対する割合）を超えたらつぶれる
const PRESS_CRUSH = 1.2;  // 閉じていく刃に押され、まわりの玉との重なりの合計がこれ（直径に対する割合）を超えたらつぶれる
const KICK_AT = .4;       // 直径のこの割合より深く重なった玉どうしは、はじけるように離れる（円がまだ混んでいないときだけ）
const CELL_SOLO = 6;      // 1 つの升目にこれより多く詰まったら、升目の中どうしだけで押し合う（重くならないように）
const PACK = .74;         // 「円 1 杯」の詰め具合（面積の割合）。どこまで増やすかの物差し
const HIT_MIN = 60;       // 音を鳴らすぶつかりの強さ
const FOE_AT = 30;        // 減るものが出てくる玉の数
const SIZES = { l: { r: 12, n: "大" }, m: { r: 8.5, n: "中" }, s: { r: 6, n: "小" }, t: { r: 4.1, n: "極小" } };
const SHAPE_NAMES = { bar: "まっすぐ", arc: "弧", saw: "ギザギザ", chev: "くの字" };
const FOE_NAMES = { eater: "食べる玉", hole: "穴", life: "寿命", red: "消し刃" };

/* 色（色相の順。1 回ごとに 5 つ飛ばしで使うので、となりの色がはっきり違う） */
const PAL = ["#ff3b4a","#ff8a2b","#ffd43b","#c4f23a","#38e070","#22e8c0","#2fd0ff","#3d6bff","#8c5cff","#b14dff","#ff45b5","#ff6b8b"];
const GOLD = PAL.length;
const PALX = [...PAL, "#f6c445"];

/* ── 玉 ─────────────────────────────────────────── */
const X = new Float64Array(MAXN), Y = new Float64Array(MAXN), VX = new Float64Array(MAXN), VY = new Float64Array(MAXN);
const PX = new Float64Array(MAXN), PY = new Float64Array(MAXN);   // 1 歩前の場所（棒をすり抜けたかを見る）
const COL = new Uint8Array(MAXN), CR = new Uint8Array(MAXN);       // 色、つぶれた印
const RM = new Uint8Array(MAXN), ESC = new Uint8Array(MAXN);       // 消える印（1 食べられた 2 穴から出た 3 寿命）、穴から出ていく途中
const BORN = new Float64Array(MAXN), IMM = new Float64Array(MAXN), FL = new Float64Array(MAXN), DIE = new Float64Array(MAXN);
const CS = new Int32Array(MAXN), CNX = new Float32Array(MAXN), CNY = new Float32Array(MAXN), CNP = new Float32Array(MAXN);
const KF = new Uint8Array(MAXN);     // この 1 歩で触れた面（1 赤い刃 2 ふつうの刃 4 円のふち）
const PR = new Float32Array(MAXN);   // まわりの玉との重なりの合計（押しつぶされ具合）
let N = 0, rad = 8.5, T = 0, STAMP = 0, wallOn = true;

function addBall(x, y, vx, vy, c, imm){
  if (N >= MAXN) return -1;
  const i = N++;
  X[i] = PX[i] = x; Y[i] = PY[i] = y; VX[i] = vx; VY[i] = vy; COL[i] = c; CR[i] = 0; RM[i] = 0; ESC[i] = 0;
  BORN[i] = T; IMM[i] = T + (imm || 0); FL[i] = -9; DIE[i] = Infinity; CS[i] = -1; KF[i] = 0; PR[i] = 0;
  return i;
}
function delBall(i){
  const j = --N;
  if (i === j) return;
  X[i] = X[j]; Y[i] = Y[j]; PX[i] = PX[j]; PY[i] = PY[j]; VX[i] = VX[j]; VY[i] = VY[j]; COL[i] = COL[j]; CR[i] = CR[j];
  RM[i] = RM[j]; ESC[i] = ESC[j]; BORN[i] = BORN[j]; IMM[i] = IMM[j]; FL[i] = FL[j]; DIE[i] = DIE[j];
  CS[i] = CS[j]; CNX[i] = CNX[j]; CNY[i] = CNY[j]; CNP[i] = CNP[j]; KF[i] = KF[j]; PR[i] = PR[j];
}

/* ── 近くの玉を探すための升目 ───────────────────────── */
let GW = 1, GH = 1, G0 = -R, GINV = 1, GCELL = 1;
let CST = new Int32Array(2), CUR = new Int32Array(1), INSIDE = new Uint8Array(1), DEN = new Float32Array(1);
const ITEM = new Int32Array(MAXN), BC = new Int32Array(MAXN);
function setupGrid(){
  GCELL = 2 * rad; const half = R + 6 * rad;
  GINV = 1 / GCELL; G0 = -half;
  GW = GH = Math.ceil(2 * half * GINV);
  const nc = GW * GH;
  CST = new Int32Array(nc + 1); CUR = new Int32Array(nc); INSIDE = new Uint8Array(nc); DEN = new Float32Array(nc);
  const lim = (R - rad * .5) ** 2;
  for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++){
    const x = G0 + (cx + .5) * GCELL, y = G0 + (cy + .5) * GCELL;
    INSIDE[cy * GW + cx] = x * x + y * y < lim ? 1 : 0;
  }
}
function buildGrid(){
  const nc = GW * GH;
  CST.fill(0);
  for (let i = 0; i < N; i++){
    const x = X[i], y = Y[i];
    if (x < G0 || y < G0){ BC[i] = -1; continue; }
    const cx = ((x - G0) * GINV) | 0, cy = ((y - G0) * GINV) | 0;
    if (cx >= GW || cy >= GH){ BC[i] = -1; continue; }
    const c = cy * GW + cx; BC[i] = c; CST[c + 1]++;
  }
  for (let c = 0; c < nc; c++) CST[c + 1] += CST[c];
  CUR.set(CST.subarray(0, nc));
  for (let i = 0; i < N; i++){ const c = BC[i]; if (c >= 0) ITEM[CUR[c]++] = i; }
}
/* 混み具合でならす: 升目ごとの玉の数をなめらかにして、混んだほうから空いたほうへ少しずつ押す（重なってもまんべんなく） */
function relax(){
  const nc = GW * GH;
  for (let c = 0; c < nc; c++){
    if (!INSIDE[c]){ DEN[c] = 0; continue; }
    let s = (CST[c + 1] - CST[c]) * 4, w = 4;
    if (INSIDE[c - 1]){ s += CST[c] - CST[c - 1]; w++; }
    if (INSIDE[c + 1]){ s += CST[c + 2] - CST[c + 1]; w++; }
    if (INSIDE[c - GW]){ s += CST[c - GW + 1] - CST[c - GW]; w++; }
    if (INSIDE[c + GW]){ s += CST[c + GW + 1] - CST[c + GW]; w++; }
    DEN[c] = s / w;
  }
  const k = .045 * GCELL;
  for (let i = 0; i < N; i++){
    const c = BC[i];
    if (c < 0 || !INSIDE[c]) continue;
    const d0 = DEN[c];
    if (d0 < 1.25) continue;
    const dl = INSIDE[c - 1] ? DEN[c - 1] : d0, dr = INSIDE[c + 1] ? DEN[c + 1] : d0;
    const du = INSIDE[c - GW] ? DEN[c - GW] : d0, dd = INSIDE[c + GW] ? DEN[c + GW] : d0;
    const f = k * Math.min(1, d0 - 1.25);
    X[i] -= (dr - dl) * f; Y[i] -= (dd - du) * f;
  }
}

/* ── 音を鳴らすぶつかりの記録（1 こまぶん） ─────────── */
let hitN = 0, hitV = 0, hitX = 0, clinkN = 0, clinkV = 0, clinkX = 0;
function hit(v, x){ hitN++; if (v > hitV){ hitV = v; hitX = x; } }
function clink(v, x){ clinkN++; if (v > clinkV){ clinkV = v; clinkX = x; } }

/* ── 玉どうし ───────────────────────────────────── */
let PRSUM = 0, PR_TH = 1e9, kickOn = true;
function pair(i, j, D, D2){
  const dx = X[j] - X[i], dy = Y[j] - Y[i], d2 = dx * dx + dy * dy;
  if (d2 >= D2) return;
  let nx, ny, pen;
  if (d2 < 1e-9){ const a = rnd() * 6.2832; nx = Math.cos(a); ny = Math.sin(a); pen = D; }
  else { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = D - d; }
  const p = pen * .5 * STIFF;
  X[i] -= nx * p; Y[i] -= ny * p; X[j] += nx * p; Y[j] += ny * p;
  PR[i] += pen; PR[j] += pen; PRSUM += pen;
  if (kickOn && pen > KICK_AT * D){ const kv = (pen / D - KICK_AT) * V0 * 1.2; VX[i] -= nx * kv; VY[i] -= ny * kv; VX[j] += nx * kv; VY[j] += ny * kv; }
  const vn = (VX[j] - VX[i]) * nx + (VY[j] - VY[i]) * ny;
  if (vn < 0){
    const q = -(1 + E_BB) * vn * .5;
    VX[i] -= q * nx; VY[i] -= q * ny; VX[j] += q * nx; VY[j] += q * ny;
    if (-vn > HIT_MIN) hit(-vn, X[i]);
  }
}
function collideBalls(){
  const D = 2 * rad, D2 = D * D;
  PRSUM = 0;
  for (let cy = 0; cy < GH; cy++){
    for (let cx = 0; cx < GW; cx++){
      const c = cy * GW + cx, s0 = CST[c], e0 = CST[c + 1], n = e0 - s0;
      if (!n) continue;
      if (n > CELL_SOLO){
        // 詰まった升目: 升目の中どうしだけ、間引いて押し合う（となりとの押し合いは「ならす」に任せる）
        const st = Math.ceil(n / CELL_SOLO);
        for (let a = s0; a < e0; a++){ const i = ITEM[a]; for (let b = a + 1; b < e0; b += st) pair(i, ITEM[b], D, D2); }
        continue;
      }
      const right = cx + 1 < GW, down = cy + 1 < GH, left = cx > 0;
      for (let a = s0; a < e0; a++){
        const i = ITEM[a];
        for (let b = a + 1; b < e0; b++) pair(i, ITEM[b], D, D2);
        if (right){ for (let b = CST[c + 1], e = CST[c + 2]; b < e; b++) pair(i, ITEM[b], D, D2); }
        if (down){
          const m = c + GW;
          if (left){ for (let b = CST[m - 1], e = CST[m]; b < e; b++) pair(i, ITEM[b], D, D2); }
          for (let b = CST[m], e = CST[m + 1]; b < e; b++) pair(i, ITEM[b], D, D2);
          if (right){ for (let b = CST[m + 1], e = CST[m + 2]; b < e; b++) pair(i, ITEM[b], D, D2); }
        }
      }
    }
  }
  PR_TH = Math.max(PRESS_CRUSH * D, 2.6 * 2 * PRSUM / Math.max(1, N));   // 円全体が混んでいるときは、ふだんより強く押された玉だけ
}

/* 面（刃・円のふち）に触れた向きを覚え、逆向きの面にも押されたら「つぶれた」にする */
function contact(i, nx, ny, pen, kind){
  const bit = kind === 2 ? 1 : kind === 1 ? 2 : 4;
  if (CS[i] !== STAMP){ CS[i] = STAMP; CNX[i] = nx; CNY[i] = ny; CNP[i] = pen; KF[i] = bit; return; }
  KF[i] |= bit;
  if (nx * CNX[i] + ny * CNY[i] < -.45 && pen + CNP[i] > SQZ * rad) CR[i] = 1;   // 3 枚の刃が 120° で寄るときもつぶれるように
  if (pen > CNP[i]){ CNX[i] = nx; CNY[i] = ny; CNP[i] = pen; }
}

/* ── 仕掛けの棒（線分＋太さ）。1 本 10 個: 今の両端・太さ・ひとつ前の両端・種類（0 押すだけ 1 刃 2 消し刃） ── */
const SEG = new Float64Array(400 * 10);
let NSEG = 0, mechClosing = 0;
function collideMech(h){
  const inv = 1 / h;
  for (let s = 0; s < NSEG; s++){
    const o = s * 10, ax = SEG[o], ay = SEG[o + 1], bx = SEG[o + 2], by = SEG[o + 3], w = SEG[o + 4], kind = SEG[o + 9];
    const pax = SEG[o + 5], pay = SEG[o + 6], pbx = SEG[o + 7], pby = SEG[o + 8];
    const md = w + rad, md2 = md * md;
    const abx = bx - ax, aby = by - ay, L2 = abx * abx + aby * aby || 1e-9;
    const ccd = L2 > 1, L = Math.sqrt(L2), lnx = -aby / L, lny = abx / L;
    const pabx = pbx - pax, paby = pby - pay, PLn = Math.hypot(pabx, paby) || 1, plx = -paby / PLn, ply = pabx / PLn;
    const x0 = Math.min(ax, bx) - md, x1 = Math.max(ax, bx) + md, y0 = Math.min(ay, by) - md, y1 = Math.max(ay, by) + md;
    const cx0 = Math.max(0, Math.floor((x0 - G0) * GINV)), cx1 = Math.min(GW - 1, Math.floor((x1 - G0) * GINV));
    const cy0 = Math.max(0, Math.floor((y0 - G0) * GINV)), cy1 = Math.min(GH - 1, Math.floor((y1 - G0) * GINV));
    for (let cy = cy0; cy <= cy1; cy++){
      for (let cx = cx0; cx <= cx1; cx++){
        const c = cy * GW + cx;
        for (let k = CST[c], e = CST[c + 1]; k < e; k++){
          const i = ITEM[k];
          let px = X[i], py = Y[i], moved = false;
          let t = ((px - ax) * abx + (py - ay) * aby) / L2;
          if (ccd && t > 0 && t < 1){
            // 速い棒が玉を飛び越えたら、もとの側へ戻す
            const sc = (px - ax) * lnx + (py - ay) * lny, sp = (PX[i] - pax) * plx + (PY[i] - pay) * ply;
            if (sc * sp < 0 && Math.abs(sp) > w * .3){
              const want = sp > 0 ? md * 1.001 : -md * 1.001;
              px += lnx * (want - sc); py += lny * (want - sc); moved = true;
            }
          }
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = ax + abx * t, qy = ay + aby * t, dx = px - qx, dy = py - qy, d2 = dx * dx + dy * dy;
          const svx = (qx - (pax + (pbx - pax) * t)) * inv, svy = (qy - (pay + (pby - pay) * t)) * inv;
          if (d2 >= md2){
            if (moved){
              X[i] = px; Y[i] = py;
              const sg = (px - ax) * lnx + (py - ay) * lny > 0 ? 1 : -1, nx = lnx * sg, ny = lny * sg;
              const vn = (VX[i] - svx) * nx + (VY[i] - svy) * ny;
              if (vn < 0){ VX[i] -= (1 + E_M) * vn * nx; VY[i] -= (1 + E_M) * vn * ny; }
            }
            continue;
          }
          let nx, ny;
          const d = Math.sqrt(d2);
          if (d < 1e-6){
            nx = -aby; ny = abx; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
            if (nx * svx + ny * svy < 0){ nx = -nx; ny = -ny; }
          } else { nx = dx / d; ny = dy / d; }
          const pen = md - d;
          X[i] = px + nx * pen; Y[i] = py + ny * pen;
          const vn = (VX[i] - svx) * nx + (VY[i] - svy) * ny;
          if (vn < 0){
            const tx = (VX[i] - svx) - vn * nx, ty = (VY[i] - svy) - vn * ny;
            VX[i] -= (1 + E_M) * vn * nx + MU * tx; VY[i] -= (1 + E_M) * vn * ny + MU * ty;
            if (-vn > HIT_MIN) clink(-vn, px);
          }
          if (kind > 0){
            contact(i, nx, ny, pen, kind);
            // 閉じていく刃に押され、まわりの玉ともひどく重なっていたら、その場でつぶれる
            if (mechClosing > 0 && svx * nx + svy * ny > 60 && PR[i] > PR_TH) CR[i] = 1;
          }
        }
      }
    }
  }
}
/* 円のふち。穴（すき間）では押し返さず、外へ出た玉は消える */
function collideWall(){
  const lim = R - rad, lim2 = lim * lim, out2 = (R + 2.5 * rad) ** 2;
  const gaps = DRN.on ? DRN.gaps : null;
  for (let i = 0; i < N; i++){
    const x = X[i], y = Y[i], d2 = x * x + y * y;
    if (ESC[i]){ if (d2 > out2) RM[i] = 2; continue; }
    if (d2 <= lim2) continue;
    if (gaps){
      const a = Math.atan2(y, x);
      let open = false;
      for (const g of gaps){
        let df = a - (DRN.ang + g.a); df -= Math.round(df / 6.283185307179586) * 6.283185307179586;
        if (Math.abs(df) < g.w - rad / R * .5){ open = true; break; }
      }
      if (open){ if (d2 > R * R) ESC[i] = 1; continue; }
    }
    const d = Math.sqrt(d2), nx = -x / d, ny = -y / d, pen = d - lim;
    X[i] = x + nx * pen; Y[i] = y + ny * pen;
    const vn = VX[i] * nx + VY[i] * ny;
    if (vn < 0){
      VX[i] -= (1 + E_W) * vn * nx; VY[i] -= (1 + E_W) * vn * ny;
      if (-vn > HIT_MIN) clink(-vn * .6, x);
    }
    contact(i, nx, ny, pen, 3);
  }
}

/* ── 動きの段取り（行き先・時間・動き方を順に。bev は段の始め、ev は段の終わりの合図） ── */
class Seq {
  constructor(v, gen){ this.v = v; this.from = v; this.gen = gen; this.steps = null; this.k = 0; this.t = 0; this.cyc = 0; this.speed = 0; }
  update(dt, ev){
    const v0 = this.v;
    let rem = dt, guard = 0;
    while (rem > 1e-12 && guard++ < 24){
      if (!this.steps || this.k >= this.steps.length){ this.steps = this.gen(this.cyc++); this.k = 0; this.t = 0; this.from = this.v; this.enter(ev); }
      const s = this.steps[this.k], left = s.d - this.t;
      if (rem < left){
        this.t += rem; rem = 0;
        const f = s.e ? s.e(this.t / s.d) : this.t / s.d;
        this.v = this.from + (s.to - this.from) * f;
      } else {
        rem -= Math.max(0, left); this.v = s.to; this.from = s.to; this.t = 0; this.k++;
        if (s.ev && ev) ev(s.ev);
        if (this.k < this.steps.length) this.enter(ev);
      }
    }
    this.speed = dt > 0 ? Math.abs(this.v - v0) / dt : 0;
    return this.v;
  }
  enter(ev){ const s = this.steps[this.k]; if (s && s.bev && ev) ev(s.bev); }
}

/* ── 仕掛け（共通） ─────────────────────────────── */
let TX = 0, TY = 0;
class Mech {
  constructor(n){ this.n = n; this.ang = 0; this.spin = 0; this.area = 0; this.cycle = 2; this.red = new Set(); this.redOn = false; this.redK = 0; }
  rot(x, y){ const c = Math.cos(this.ang), s = Math.sin(this.ang); TX = x * c - y * s; TY = x * s + y * c; }
  seg(k, ax, ay, bx, by, w, kind){
    const o = k * 10; this.rot(ax, ay); SEG[o] = TX; SEG[o + 1] = TY;
    this.rot(bx, by); SEG[o + 2] = TX; SEG[o + 3] = TY; SEG[o + 4] = w; SEG[o + 9] = kind === undefined ? 1 : kind;
  }
  keep(){ for (let k = 0; k < this.n; k++){ const o = k * 10; SEG[o + 5] = SEG[o]; SEG[o + 6] = SEG[o + 1]; SEG[o + 7] = SEG[o + 2]; SEG[o + 8] = SEG[o + 3]; } }
  install(){ NSEG = this.n; this.geom(); this.keep(); }
  step(dt){ this.keep(); this.advance(dt); this.geom(); if (this.redOn && this.redK < 1) this.redK = Math.min(1, this.redK + dt / .6); }
  motion(){ return 0; }
  drawBack(){}
}

/* 寄せ刃: N 枚の刃がまわりから真ん中へ寄ってきて、間の玉をつぶす（2 枚＝プレス、4 枚＝十字） */
class Yose extends Mech {
  constructor(NB, shape){
    super(0);
    this.key = "yose"; this.NB = NB; this.shape = shape;
    const tb = this.tb = NB === 2 ? 11 : 10; this.rw = 7;
    let L, dOpen, dLock = 0;
    if (NB === 2){ L = 300; dOpen = 352; }
    else {
      // 開いたとき刃の端が円のふちに当たらず、閉じかけたとき角がふさがる大きさ
      const tn = Math.tan(Math.PI / NB);
      for (dOpen = 445; dOpen > 220; dOpen -= 5){ L = (.5 * dOpen + tb + 2) * tn; if (Math.hypot(dOpen, L) + tb <= R - 34) break; }
      dLock = L / tn - tb - 3;
    }
    this.L = L; this.dOpen = dOpen; this.dLock = dLock;
    // 刃の形（刃の上の点。x は刃に沿って、y は真ん中へ向かう向き）
    const lp = [];
    if (shape === "arc"){
      const rb = NB === 2 ? 900 : Math.max(150, dLock + 20);
      for (let j = 0; j <= 8; j++){ const x = -L + 2 * L * j / 8; lp.push(x, x * x / (2 * rb)); }
    } else if (shape === "chev"){
      const hh = L * (NB === 2 ? .2 : .3); lp.push(-L, hh, 0, 0, L, hh);
    } else if (shape === "saw"){
      // 2 枚のときは上下の刃がかみ合う形（奇関数）、3 枚以上は刃の真ん中に歯の先（真ん中に隠れる場所を作らない）
      const P = NB === 2 ? 64 : 46, A = P * .42, q = P / 4, K = Math.floor((L - 1) / q), ph = NB === 2 ? 0 : .25;
      this.sawA = A; this.sawP = P;
      lp.push(-L, tri(-L / P + ph) * A / 2);
      for (let j = -K; j <= K; j++) lp.push(j * q, tri(j * q / P + ph) * A / 2);
      lp.push(L, tri(L / P + ph) * A / 2);
    } else lp.push(-L, 0, L, 0);
    this.lp = lp; this.np = lp.length / 2;
    this.n = NB * this.np;   // 1 枚につき、刃のかけら (np-1) 本と押し棒 1 本
    this.wp = new Float64Array(NB * this.np * 2);
    let dC = tb + .8 * rad;
    if (shape === "saw") dC = NB === 2 ? (tb + .8 * rad) / Math.cos(Math.atan(2 * this.sawA / this.sawP)) : tb + .8 * rad + this.sawA / 2;
    this.dC = dC;
    this.ang = NB === 2 ? pick([0, Math.PI / 2]) + (rnd() < .3 ? rr(-.35, .35) : 0) : rr(0, 2 * Math.PI / NB);
    this.spin = rnd() < (NB === 2 ? .25 : .45) ? pick([1, -1]) * rr(.06, .25) : 0;
    const tp = rr(.85, 1.15);
    if (NB === 2){
      this.cycle = 1.54 * tp;
      this.seq = new Seq(dOpen, c => [
        { d: (c === 0 ? .55 : rr(.18, .42)) * tp, to: dOpen },
        { d: rr(.38, .5) * tp, to: dC, e: EZ.inQ, bev: "close", ev: "impact" },
        { d: .12 * tp, to: dC },
        { d: rr(.55, .8) * tp, to: dOpen, e: EZ.outC },
      ]);
    } else {
      this.cycle = 1.99 * tp;
      this.seq = new Seq(dOpen, c => [
        { d: (c === 0 ? .5 : rr(.15, .35)) * tp, to: dOpen },
        { d: rr(.45, .6) * tp, to: dLock, e: EZ.inOut, bev: "close", ev: "lock" },
        { d: rr(.06, .16) * tp, to: dLock },
        { d: rr(.26, .36) * tp, to: dC, e: EZ.inQ, ev: "impact" },
        { d: .12 * tp, to: dC },
        { d: rr(.55, .8) * tp, to: dOpen, e: EZ.outC },
      ]);
    }
    this.d = dOpen;
    this.area = NB * ((2 * L + 2 * tb) * 2 * tb + 2 * this.rw * (R - dOpen));
  }
  name(){ return "寄せ刃 " + this.NB + " 枚・" + SHAPE_NAMES[this.shape]; }
  start(){ return [0, 0]; }
  advance(dt){ this.d = this.seq.update(dt, mechEvent); this.ang += this.spin * dt; }
  motion(){ return this.seq.speed / 1300; }
  setRed(lv){
    const NB = this.NB, n = lv === 1 ? 1 : lv === 2 ? Math.max(1, Math.round(NB / 3)) : Math.max(1, Math.floor(NB / 2));
    this.red = new Set(); for (let j = 0; j < n; j++) this.red.add(Math.round(j * NB / n) % NB);
  }
  geom(){
    const NB = this.NB, lp = this.lp, np = this.np, d = this.d, tb = this.tb, wp = this.wp;
    let k = 0;
    for (let i = 0; i < NB; i++){
      const th = this.ang + 2 * Math.PI * i / NB, ux = Math.cos(th), uy = Math.sin(th), cx = ux * d, cy = uy * d;
      for (let j = 0; j < np; j++){   // 刃に沿う向き (-uy, ux)、真ん中へ向かう向き (-ux, -uy)
        const x = lp[j * 2], y = lp[j * 2 + 1], o = (i * np + j) * 2;
        wp[o] = cx - uy * x - ux * y; wp[o + 1] = cy + ux * x - uy * y;
      }
      const kind = this.redOn && this.red.has(i) ? 2 : 1;
      for (let j = 0; j < np - 1; j++){
        const o = (i * np + j) * 2, s = k * 10;
        SEG[s] = wp[o]; SEG[s + 1] = wp[o + 1]; SEG[s + 2] = wp[o + 2]; SEG[s + 3] = wp[o + 3]; SEG[s + 4] = tb; SEG[s + 9] = kind; k++;
      }
      const s = k * 10;   // 押し棒（刃の背中から円の外へ）
      SEG[s] = cx + ux * tb; SEG[s + 1] = cy + uy * tb; SEG[s + 2] = ux * (R + 90); SEG[s + 3] = uy * (R + 90); SEG[s + 4] = this.rw; SEG[s + 9] = 1; k++;
    }
  }
  draw(c){
    const NB = this.NB, np = this.np, wp = this.wp, tb = this.tb;
    for (let i = 0; i < NB; i++){
      c.save(); c.rotate(this.ang + 2 * Math.PI * i / NB - Math.PI / 2);   // 押し棒と台は、下向きの形で描いて回す
      rod(c, 0, R + 20, 0, this.d + tb, this.rw); mount(c, R + 6, -1);
      c.restore();
    }
    for (let i = 0; i < NB; i++){
      const red = this.red.has(i) ? this.redK : 0;
      if (this.shape === "bar"){ const o = i * np * 2; bar(c, wp[o], wp[o + 1], wp[o + 2], wp[o + 3], tb, NB === 2, red); }
      else drawPoly(c, wp, i * np, np, tb, red);
    }
  }
}

/* 8 の字: 真ん中の軸のまわりの N 個の輪（2 枚の刃）が、ハサミのように閉じて輪の中をつぶす。全体はゆっくり回る */
class Loops extends Mech {
  constructor(NL, shape){
    const P = shape === "arc" ? 10 : 2;
    super(NL * 2 * P + 1);
    this.key = "loops"; this.NL = NL; this.shape = shape; this.P = P;
    this.rho = [0, 0, 172, 150, 126, 108][NL]; this.g = 36; this.tb = 9; this.hub = 30; this.hm = 1;
    this.bo = [0, 0, -1.15, -.98, -.84, -.74][NL];
    if (shape === "arc") this.bc = Math.asin(clamp(1 - (this.tb + .75 * rad) / this.rho, 0, .995));
    else this.bc = Math.atan(this.hm) - Math.asin(clamp((this.tb + .75 * rad) / (this.rho * Math.hypot(1, this.hm)), 0, .99));   // ひし形の輪がつぶれきる角度
    this.ang = rr(0, Math.PI * 2); this.spin = pick([1, -1]) * rr(.2, .5);
    this.alt = rnd() < .5;
    const tp = rr(.9, 1.15), bo = this.bo, bc = this.bc;
    this.cycle = 1.885 * tp;
    const gen = c => [
      { d: (c === 0 ? .45 : rr(.15, .32)) * tp, to: bo },
      { d: rr(.38, .5) * tp, to: 0, e: EZ.inOut, bev: "close", ev: "lock" },
      { d: .08 * tp, to: 0 },
      { d: rr(.36, .46) * tp, to: bc, e: EZ.inQ, ev: "impact" },
      { d: .12 * tp, to: bc },
      { d: rr(.5, .7) * tp, to: bo, e: EZ.outC },
    ];
    this.seqs = []; this.b = new Float64Array(NL);
    for (let j = 0; j < NL; j++){ const s = new Seq(bo, gen); if (this.alt && j) s.update(this.cycle * j / NL, null); this.seqs.push(s); this.b[j] = s.v; }
    this.area = NL * 2 * (shape === "arc" ? Math.PI * this.rho : 2 * this.rho * Math.hypot(1, this.hm)) * 2 * this.tb + Math.PI * this.hub ** 2;
  }
  name(){ return "8 の字 " + this.NL + " つ・" + SHAPE_NAMES[this.shape]; }
  start(){ this.pt(0, this.g + this.rho, 0); return [TX, TY]; }
  pt(j, x, y){ const al = this.ang + 2 * Math.PI * j / this.NL, cs = Math.cos(al), sn = Math.sin(al); TX = x * cs - y * sn; TY = x * sn + y * cs; }
  advance(dt){ for (let j = 0; j < this.NL; j++) this.b[j] = this.seqs[j].update(dt, mechEvent); this.ang += this.spin * dt; }
  motion(){ let s = 0; for (const q of this.seqs) s += q.speed; return s / (4.5 * this.NL); }
  setRed(lv){ const NL = this.NL; this.red = new Set(); if (lv === 1) this.red.add(1); else for (let j = 0; j < NL; j += lv === 2 ? 2 : 1) this.red.add(j * 2 + 1); }
  /* 刃の上の点: j 番目の輪、up 上(+1)・下(-1)、s 0=先 1=留め具、b 閉じる角度 → TX,TY */
  bp(j, up, s, b){
    let lx, ly;
    if (this.shape === "arc"){ const th = Math.PI * s; lx = this.rho + this.rho * Math.cos(th); ly = -up * this.rho * Math.sin(th); }
    else {   // まっすぐ: 先 → 真ん中の角 → 留め具 の 2 本で、ひし形の半分
      const u = s < .5 ? s * 2 : (s - .5) * 2;
      if (s < .5){ lx = 2 * this.rho - this.rho * u; ly = -up * this.rho * this.hm * u; }
      else { lx = this.rho * (1 - u); ly = -up * this.rho * this.hm * (1 - u); }
    }
    const a = up * b, ca = Math.cos(a), sa = Math.sin(a);
    this.pt(j, this.g + lx * ca - ly * sa, lx * sa + ly * ca);
  }
  geom(){
    const P = this.P; let k = 0;
    for (let j = 0; j < this.NL; j++){
      for (let u = 0; u < 2; u++){
        const up = u ? -1 : 1, kind = this.redOn && this.red.has(j * 2 + u) ? 2 : 1;
        this.bp(j, up, 0, this.b[j]); let px = TX, py = TY;
        for (let q = 1; q <= P; q++){
          this.bp(j, up, q / P, this.b[j]);
          const o = k * 10; SEG[o] = px; SEG[o + 1] = py; SEG[o + 2] = TX; SEG[o + 3] = TY; SEG[o + 4] = this.tb; SEG[o + 9] = kind;
          px = TX; py = TY; k++;
        }
      }
    }
    const o = k * 10; SEG[o] = 0; SEG[o + 1] = 0; SEG[o + 2] = 0; SEG[o + 3] = 0; SEG[o + 4] = this.hub; SEG[o + 9] = 0;   // 真ん中の軸ではつぶさない
  }
  draw(c){
    const M = this.shape === "arc" ? 28 : 2;
    for (let j = 0; j < this.NL; j++){
      for (let u = 0; u < 2; u++){
        const up = u ? -1 : 1, red = this.red.has(j * 2 + u) ? this.redK : 0;
        c.beginPath();
        for (let q = 0; q <= M; q++){ this.bp(j, up, q / M, this.b[j]); q ? c.lineTo(TX, TY) : c.moveTo(TX, TY); }
        blade(c, this.tb, red);
      }
    }
    for (let j = 0; j < this.NL; j++){ this.pt(j, this.g, 0); bolt(c, TX, TY, this.tb * .55); }
    hubDraw(c, this.hub);
  }
}

/* はさみ箱: 左右から「[」と「]」が入ってきて箱になり、横から挟んでつぶす */
class Box extends Mech {
  constructor(){
    super(6); this.key = "box";
    this.H = 120; this.L = 250; this.tb = 9; this.so = R + 30; this.sl = this.L - 6; this.sc = this.tb + .8 * rad;
    this.ang = pick([0, Math.PI / 2]) + rr(-.5, .5);
    const tp = rr(.85, 1.15);
    this.cycle = 2.08 * tp;
    this.seq = new Seq(this.so, c => [
      { d: (c === 0 ? .35 : rr(.15, .35)) * tp, to: this.so },
      { d: rr(.5, .65) * tp, to: this.sl, e: EZ.inOut, bev: "close", ev: "lock" },
      { d: rr(.06, .14) * tp, to: this.sl },
      { d: rr(.26, .36) * tp, to: this.sc, e: EZ.inQ, ev: "impact" },
      { d: .12 * tp, to: this.sc },
      { d: rr(.6, .85) * tp, to: this.so, e: EZ.outC },
    ]);
    this.s = this.so; this.area = 2 * (2 * this.H + 2 * this.L) * 2 * this.tb;
  }
  name(){ return "はさみ箱"; }
  start(){ return [0, 0]; }
  advance(dt){ this.s = this.seq.update(dt, mechEvent); }
  motion(){ return this.seq.speed / 1100; }
  setRed(lv){ this.red = new Set(lv === 1 ? [0] : lv === 2 ? [0, 1, 2] : [0, 1, 2, 3]); }
  kd(k){ return this.redOn && this.red.has(k) ? 2 : 1; }
  geom(){
    const s = this.s, H = this.H, L = this.L, w = this.tb;
    this.seg(0, -s, -H, -s, H, w, this.kd(0)); this.seg(1, -s, -H, -s + L, -H, w, this.kd(1)); this.seg(2, -s, H, -s + L, H, w, this.kd(2));
    this.seg(3, s, -H, s, H, w, this.kd(3)); this.seg(4, s, -H, s - L, -H, w, this.kd(4)); this.seg(5, s, H, s - L, H, w, this.kd(5));
  }
  drawBack(c){
    c.save(); c.rotate(this.ang);
    rail(c, -3 * R, -this.H, 3 * R, -this.H, 4); rail(c, -3 * R, this.H, 3 * R, this.H, 4);
    c.restore();
  }
  draw(c){
    const s = this.s, H = this.H, L = this.L, w = this.tb, r = k => this.red.has(k) ? this.redK : 0;
    c.save(); c.rotate(this.ang);
    bar(c, -s, -H, -s + L, -H, w, false, r(1)); bar(c, -s, H, -s + L, H, w, false, r(2));
    bar(c, s, -H, s - L, -H, w, false, r(4)); bar(c, s, H, s - L, H, w, false, r(5));
    bar(c, -s, -H, -s, H, w, false, r(0)); bar(c, s, -H, s, H, w, false, r(3));
    bolt(c, -s, -H, w * .45); bolt(c, -s, H, w * .45); bolt(c, s, -H, w * .45); bolt(c, s, H, w * .45);
    c.restore();
  }
}
const MECHS = { yose: Yose, loops: Loops, box: Box };
const MECH_KEYS = ["yose", "loops", "box"];

/* ── 仕掛けの絵 ─────────────────────────────────── */
const METAL = ["#eef1f7", "#c3c9d4", "#8d94a1", "#5a606b"], REDM = ["#ffd9d6", "#f07a7f", "#c2343d", "#6e1a20"];
function metal(c, x0, y0, x1, y1, red){
  const g = c.createLinearGradient(x0, y0, x1, y1), st = [0, .3, .62, 1];
  for (let q = 0; q < 4; q++) g.addColorStop(st[q], red > 0 ? mix(METAL[q], REDM[q], red) : METAL[q]);
  return g;
}
function bar(c, x0, y0, x1, y1, w, groove, red){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  c.save(); c.translate(x0, y0); c.rotate(Math.atan2(dy, dx));
  c.fillStyle = metal(c, 0, -w, 0, w, red || 0);
  c.beginPath(); c.roundRect(-w, -w, L + 2 * w, 2 * w, w); c.fill();
  c.lineWidth = Math.max(.8, w * .12); c.strokeStyle = "rgba(20,24,32,.55)"; c.stroke();
  c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = w * .16;
  c.beginPath(); c.moveTo(w * .2, -w * .55); c.lineTo(L - w * .2, -w * .55); c.stroke();
  if (groove && L > 6 * w){
    c.strokeStyle = "rgba(40,46,58,.45)"; c.lineWidth = w * .14;
    c.beginPath(); c.moveTo(w * 2, w * .25); c.lineTo(L - w * 2, w * .25); c.stroke();
    for (const q of [.12, .5, .88]) bolt(c, L * q, 0, w * .32);
  }
  c.restore();
}
function drawPoly(c, wp, p0, np, w, red){
  c.beginPath();
  for (let j = 0; j < np; j++){ const o = (p0 + j) * 2; j ? c.lineTo(wp[o], wp[o + 1]) : c.moveTo(wp[o], wp[o + 1]); }
  blade(c, w, red);
}
function rod(c, x0, y0, x1, y1, w){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  c.save(); c.translate(x0, y0); c.rotate(Math.atan2(dy, dx));
  const g = c.createLinearGradient(0, -w, 0, w);
  g.addColorStop(0, "#9aa2b0"); g.addColorStop(.4, "#d9dde6"); g.addColorStop(1, "#4d535e");
  c.fillStyle = g; c.fillRect(0, -w, L, 2 * w);
  c.restore();
}
function mount(c, y, dir){
  c.save(); c.translate(0, y);
  const g = c.createLinearGradient(-34, 0, 34, 0);
  g.addColorStop(0, "#3b404b"); g.addColorStop(.5, "#9ba3b1"); g.addColorStop(1, "#30343d");
  c.fillStyle = g;
  c.beginPath(); c.roundRect(-34, -13, 68, 26, 6); c.fill();
  c.fillStyle = "#1c1f26"; c.fillRect(-12, dir > 0 ? 9 : -15, 24, 6);
  c.restore();
}
function rail(c, x0, y0, x1, y1, w){
  c.save(); c.lineCap = "round";
  c.strokeStyle = "rgba(170,180,200,.16)"; c.lineWidth = w * 2.2;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = "rgba(230,236,248,.14)"; c.lineWidth = w * .5;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.restore();
}
function blade(c, w, red){
  red = red || 0;
  c.lineCap = "round"; c.lineJoin = "round";
  c.strokeStyle = red ? mix("#555b67", "#4a1418", red) : "#555b67"; c.lineWidth = w * 2 + 1.6; c.stroke();
  c.strokeStyle = red ? mix("#a9b0bd", "#d2464d", red) : "#a9b0bd"; c.lineWidth = w * 2; c.stroke();
  c.strokeStyle = red ? `rgba(255,${Math.round(247 - 90 * red)},${Math.round(252 - 100 * red)},.75)` : "rgba(244,247,252,.75)";
  c.lineWidth = w * .55; c.stroke();
}
function bolt(c, x, y, r){
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = "#4a505b"; c.fill();
  c.beginPath(); c.arc(x - r * .2, y - r * .2, r * .55, 0, Math.PI * 2);
  c.fillStyle = "#c9ced8"; c.fill();
}
function hubDraw(c, r){
  const g = c.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
  g.addColorStop(0, "#f2f4f8"); g.addColorStop(.6, "#9aa1ae"); g.addColorStop(1, "#4f5561");
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fillStyle = g; c.fill();
  c.lineWidth = 2; c.strokeStyle = "rgba(30,34,42,.6)"; c.stroke();
  c.beginPath(); c.arc(0, 0, r * .45, 0, Math.PI * 2); c.strokeStyle = "rgba(40,44,54,.7)"; c.lineWidth = r * .12; c.stroke();
  c.beginPath(); c.arc(0, 0, r * .16, 0, Math.PI * 2); c.fillStyle = "#2b2f38"; c.fill();
}

/* ── 減るもの（増える玉とケンカする） ───────────────────── */
/* 食べる玉: 円の中をうろうろして、触れた玉を食べる。食べるほど大きく、食べないと小さくなる。
   1 秒に食べられる数には限りがあり、たくさん食べると遅くなる（混んでいるときは、口の中で順番待ち） */
const EAT = { list: [] };
function makeEaters(lv){
  EAT.list = [];
  const r0 = Math.max(30, rad * 4.2) * (lv === 3 ? 1.2 : 1);
  for (let j = 0; j < lv; j++){
    const a = rnd() * 6.2832 + j * 2.1;
    EAT.list.push({ x: Math.cos(a) * R * .62, y: Math.sin(a) * R * .62, head: a + Math.PI + rr(-.5, .5), turn: 0, turnT: 0,
                    r0, r: 1, full: 0, born: T, col: 0, gulp: -9, out: 0, rate: [0, 35, 60, 90][lv], bite: 0 });
  }
}
function eatersUpdate(dt){
  for (const e of EAT.list){
    if ((e.turnT -= dt) < 0){ e.turn = rr(-1.3, 1.3); e.turnT = rr(.7, 2); }
    e.head += e.turn * dt;
    const sp = V0 * .42;
    e.x += Math.cos(e.head) * sp * dt; e.y += Math.sin(e.head) * sp * dt;
    const d = Math.hypot(e.x, e.y), lim = R - e.r * .7;
    if (d > lim){ e.x *= lim / d; e.y *= lim / d; e.head = Math.atan2(-e.y, -e.x) + rr(-.7, .7); }
    e.full *= Math.exp(-dt / 5);
    const grow = Math.min(1, (T - e.born) / 1.2), fade = e.out ? Math.max(0, 1 - (T - e.out) / .6) : 1;
    e.r = Math.max(1, e.r0 * grow * fade * (1 + 1.1 * e.full / (e.full + 40)));
  }
  EAT.list = EAT.list.filter(e => !(e.out && T - e.out > .6));
}
function eatPass(h){
  for (const e of EAT.list){
    if (e.out) continue;
    const r = e.r, pr = r * 2.4, r2 = r * r, pr2 = pr * pr;
    e.bite = Math.min(e.rate * .4, e.bite + e.rate * h / (1 + e.full / 150));   // 食べられる数（おなかがいっぱいだと遅くなる）
    const cx0 = Math.max(0, Math.floor((e.x - pr - G0) * GINV)), cx1 = Math.min(GW - 1, Math.floor((e.x + pr - G0) * GINV));
    const cy0 = Math.max(0, Math.floor((e.y - pr - G0) * GINV)), cy1 = Math.min(GH - 1, Math.floor((e.y + pr - G0) * GINV));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++){
      const c = cy * GW + cx;
      for (let k = CST[c], end = CST[c + 1]; k < end; k++){
        const i = ITEM[k], dx = e.x - X[i], dy = e.y - Y[i], d2 = dx * dx + dy * dy;
        if (d2 < r2){ if (!RM[i] && e.bite >= 1){ RM[i] = 1; e.bite--; e.full++; e.gulp = T; e.col = COL[i]; } }
        else if (d2 < pr2){ const d = Math.sqrt(d2), a = 1100 * (1 - d / pr) * h; VX[i] += dx / d * a; VY[i] += dy / d * a; }   // 吸いこむ
      }
    }
  }
}
/* 穴: 円のふちのすき間。ゆっくり回り、混んでいるほど勢いよくこぼれる */
const DRN = { on: false, gaps: [], ang: 0, spin: 0, t0: 0, closing: 0 };
function makeHoles(lv){
  const w = [0, 70, 95, 120][lv] / 2 / R;
  DRN.gaps = []; for (let j = 0; j < lv; j++) DRN.gaps.push({ a: j * 2 * Math.PI / lv, w: 0, w0: w });
  DRN.ang = rnd() * 2 * Math.PI; DRN.spin = pick([1, -1]) * rr(.08, .18); DRN.on = true; DRN.t0 = T; DRN.closing = 0;
}
function drainUpdate(dt){
  if (!DRN.on) return;
  DRN.ang += DRN.spin * dt;
  const k = DRN.closing ? Math.max(0, 1 - (T - DRN.closing) / .5) : EZ.outC(Math.min(1, (T - DRN.t0) / 1.2));
  for (const g of DRN.gaps) g.w = g.w0 * k;
  if (DRN.closing && k <= 0) DRN.on = false;
}
/* 穴の縁の小さな柱（玉が縁に引っかからないように）。仕掛けの棒のうしろに足す */
function extraSegs(){
  let k = mech.n;
  if (DRN.on) for (const g of DRN.gaps) for (const sg of [-1, 1]){
    const a = DRN.ang + g.a + sg * g.w, x = Math.cos(a) * R, y = Math.sin(a) * R, o = k * 10;
    SEG[o] = SEG[o + 2] = SEG[o + 5] = SEG[o + 7] = x; SEG[o + 1] = SEG[o + 3] = SEG[o + 6] = SEG[o + 8] = y; SEG[o + 4] = 4; SEG[o + 9] = 0; k++;
  }
  NSEG = k;
}
/* 寿命: 時間がたった玉から、しぼんで消える */
function lifePass(){ for (let i = 0; i < N; i++) if (T > DIE[i] + .25) RM[i] = 3; }

function activateFoe(){
  RD.foeOn = true;
  const lv = RD.foeLv;
  if (RD.foe === "eater"){ makeEaters(lv); showLabel("食べる玉が来た！"); }
  else if (RD.foe === "hole"){ makeHoles(lv); showLabel("ふちに穴が開いた！"); }
  else if (RD.foe === "life"){
    RD.lifeOn = true; RD.lifeBase = [0, 16, 11, 7.5][lv] * (mech.cycle / 1.8);
    for (let i = 0; i < N; i++) DIE[i] = T + RD.lifeBase * rr(.25, 1.25);
    showLabel("玉に寿命がついた！");
  } else if (RD.foe === "red"){ mech.setRed(lv); mech.redOn = true; showLabel("消し刃が赤くなった！"); }
  AU.sfx("foe");
}
function stopFoes(){
  for (const e of EAT.list) if (!e.out) e.out = T;
  if (DRN.on && !DRN.closing) DRN.closing = T;
  RD.lifeOn = false;
  for (let i = 0; i < N; i++){
    if (DIE[i] === Infinity) continue;
    if (T < DIE[i]) DIE[i] = Infinity; else RM[i] = 3;   // しぼみかけの玉は、そのまま消す（見えないまま残らないように）
  }
}

/* ── 1 回ぶん（1 個から始まって、割れるか金色になるまで） ─── */
let mech = null, RD = null, lastMech = null;
const STAT = { crush: 0, erased: 0, eaten: 0, drained: 0, expired: 0, rounds: 0 };
function newRound(){
  let mk = SET.mech;
  if (!MECHS[mk]){ do { mk = pick(MECH_KEYS); } while (mk === lastMech); }
  lastMech = mk;
  const sz = SIZES[SET.size] ? SET.size : wpick([["l", .22], ["m", .36], ["s", .27], ["t", .15]]);
  rad = SIZES[sz].r;
  const k = [2, 3, 4].includes(+SET.split) ? +SET.split : wpick(mk === "loops" ? [[3, .55], [4, .45]] : [[2, .25], [3, .5], [4, .25]]);
  N = 0; FX.length = 0; wallOn = true; mechClosing = 0;
  EAT.list = []; DRN.on = false; DRN.gaps = [];
  setupGrid();
  if (mk === "yose"){
    const nb = SET.yoseN !== "auto" ? +SET.yoseN : wpick([[2, .2], [3, .15], [4, .2], [5, .12], [6, .15], [8, .18]]);
    const sh = SET.yoseShape !== "auto" ? SET.yoseShape : wpick([["bar", .35], ["arc", .25], ["saw", .2], ["chev", .2]]);
    mech = new Yose(nb, sh);
  } else if (mk === "loops"){
    const nl = SET.loopN !== "auto" ? +SET.loopN : wpick([[2, .35], [3, .3], [4, .2], [5, .15]]);
    const sh = SET.loopShape !== "auto" ? SET.loopShape : wpick([["arc", .7], ["bar", .3]]);
    mech = new Loops(nl, sh);
  } else mech = new Box();
  mech.install();
  // どこまで増やすか（「円 1 杯」の何倍か、または数）。キリのいい数にそろえる
  const cap = PACK * (Math.PI * (R - rad) ** 2 - mech.area) / (Math.PI * rad * rad);
  const lim = SET.limit;
  let target = lim === "auto" ? round2(cap * 3) : lim === "x2" ? round2(cap * 2) : lim === "x5" ? round2(cap * 5) : +lim || round2(cap * 3);
  target = Math.max(10, Math.min(MAXN - 500, target));
  let gold = rnd() < (sz === "t" ? .5 : .15);
  if (Q.get("gold")) gold = Q.get("gold") === "1";   // 試験用
  const foe = SET.foe === "auto" ? wpick([[null, .3], ["eater", .175], ["hole", .175], ["life", .175], ["red", .175]]) : (SET.foe === "none" ? null : SET.foe);
  const start = (rnd() * PAL.length) | 0, pal = [];
  for (let i = 0; i < PAL.length; i++) pal.push((start + i * 5) % PAL.length);
  RD = { mk, sz, k, cap: Math.round(cap), gold, target, pal, phase: "intro", t: 0, epoch: 0, lastCrush: -99, still: true,
         fade: 1, mAlpha: 0, beads: null, frags: null, foe, foeLv: +SET.foeLv, foeOn: false, lifeOn: false, lifeBase: 10,
         peak: 1, peakT: 0, growT: 0 };
  STAT.rounds++;
  cam.zoom = 1;
  buildSprites(); drawBg();
  showLabel(mech.name() + "　" + k + " つに分かれる" + (foe ? "　＋ " + FOE_NAMES[foe] : ""));
}
function mechEvent(name){
  if (!RD) return;
  if (name === "impact"){
    mechClosing = Math.max(0, mechClosing - 1);
    RD.still = false;
    cam.shake = Math.max(cam.shake, mech.key === "yose" && mech.NB === 2 ? 7 : 5);
    AU.sfx(mech.key === "yose" ? (mech.NB === 2 ? "press" : "cross") : mech.key);
  } else if (name === "lock"){
    AU.sfx("lock");
  } else if (name === "close"){
    mechClosing++;
    if (RD.phase === "grow") RD.epoch++;   // 閉じるたびに、次につぶれた玉から生まれる色を変える
  }
}

/* つぶれた玉を分け、減るもので消えた玉を片づける */
const CRL = [], RML = [], PV = [], DEL = [];
function processEvents(){
  for (let i = 0; i < N; i++){
    if (RM[i]){ RML.push(i); CR[i] = 0; continue; }
    if (CR[i]){ CR[i] = 0; if (IMM[i] <= T) CRL.push(i); }
  }
  if (!CRL.length && !RML.length) return;
  const ph = RD.phase, col = RD.pal[RD.epoch % RD.pal.length];
  DEL.length = 0; PV.length = 0;
  let eaten = 0, expired = 0;
  for (const i of RML){
    const why = RM[i]; RM[i] = 0; DEL.push(i);
    if (why === 1){ STAT.eaten++; eaten++; } else if (why === 2) STAT.drained++; else { STAT.expired++; expired++; }
  }
  if (eaten) AU.sfx("gulp");
  if (expired) AU.sfx("pip");
  if (ph === "burst" || ph === "clear"){
    // 割れたあとに仕掛けに挟まれた玉は、ぽんと消える（真ん中に閉じこめられたまま残らないように）
    for (const i of CRL){ if (FX.length < 200) fxRing(X[i], Y[i], COL[i]); DEL.push(i); }
    if (CRL.length) AU.pops(Math.min(3, CRL.length));
  } else if (ph === "grow"){
    const k = RD.k;
    let room = RD.target - (N - RML.length), sp = 0, er = 0;
    for (const i of CRL){
      const kf = CS[i] === STAMP ? KF[i] : 0;
      if ((kf & 1) && (!(kf & 2) || rnd() < .5)){   // 消し刃に挟まれた（ふつうの刃と半々なら、半分の確率で）
        DEL.push(i); room++; er++;
        if (er <= 40) fxPoof(X[i], Y[i]);
        continue;
      }
      if (room <= 0) continue;                     // 上限ちょうどに届いたら、もうつぶさない
      const kids = Math.min(k, room + 1);
      room -= kids - 1;
      PV.push(X[i], Y[i], VX[i], VY[i], kids); DEL.push(i);
      if (sp < 60) fxRing(X[i], Y[i], col);
      sp++;
    }
    STAT.crush += sp; STAT.erased += er;
    if (sp){ AU.pops(sp); RD.lastCrush = T; }
    if (er) AU.sfx("poof");
  }
  DEL.sort((a, b) => b - a);
  for (const i of DEL) delBall(i);
  for (let q = 0; q < PV.length; q += 5) spawnKids(PV[q], PV[q + 1], PV[q + 2], PV[q + 3], PV[q + 4], col);
  CRL.length = 0; RML.length = 0;
}
/* 生まれた玉: 仕掛けの外へはじき出し、次に刃が閉じる回（設定の回数）はつぶれないように守る */
function spawnKids(x, y, vx, vy, n, col){
  const ej = SET.eject, sp0 = [1.05, 1.7, 2.6][+ej] * V0;
  const guard = +SET.guard, imm = guard ? mech.cycle * guard + .1 : .25;
  const life = RD.lifeOn;
  let base, spread;
  if (ej === "0"){ base = rnd() * Math.PI * 2; spread = Math.PI * 2 * (n - 1) / n; }
  else {
    base = (Math.hypot(x, y) > rad * 3 ? Math.atan2(y, x) : rnd() * Math.PI * 2) + rr(-.5, .5);   // 真ん中から外へ向けて
    spread = n > 1 ? Math.min(1.6, .45 * n) : 0;
  }
  for (let j = 0; j < n; j++){
    const a = base + (n > 1 ? (j / (n - 1) - .5) * spread : 0), c = Math.cos(a), s = Math.sin(a), sp = sp0 * rr(.85, 1.15);
    const i = addBall(x + c * rad * .9, y + s * rad * .9, c * sp + vx * .2, s * sp + vy * .2, col, imm);
    if (i >= 0 && life) DIE[i] = T + RD.lifeBase * rr(.7, 1.3);
  }
}

/* ── 1 こまの中の細かい 1 歩 ───────────────────────── */
const HS_Q = { "0": 1 / 120, "1": 1 / 180, "2": 1 / 240 };
let HS = HS_Q[SET.quality] || 1 / 180;
function substep(h){
  STAMP++;
  const vm2 = (V0 * 4) ** 2;
  for (let i = 0; i < N; i++){
    let vx = VX[i], vy = VY[i];
    const s2 = vx * vx + vy * vy;
    if (s2 > vm2){ const f = Math.sqrt(vm2 / s2); vx *= f; vy *= f; VX[i] = vx; VY[i] = vy; }
    PX[i] = X[i]; PY[i] = Y[i]; X[i] += vx * h; Y[i] += vy * h; PR[i] = 0;
  }
  if (RD.phase === "gold") mech.keep(); else mech.step(h);
  extraSegs();
  buildGrid();
  relax();
  collideBalls();
  collideMech(h);
  if (wallOn) collideWall();
  if (EAT.list.length && RD.phase === "grow") eatPass(h);
  if (RD.lifeOn) lifePass();
  processEvents();
  T += h;
}

/* 速さをふだんの速さに寄せる（混むほど、ゆっくりに） */
function governor(dt){
  const fill = N * rad * rad / ((R - rad) * (R - rad));
  const vt = V0 * (1 - .72 * smooth(.3, .7, fill));
  const kk = 1 - Math.exp(-dt * 1.8), vmax = V0 * 3.2;
  for (let i = 0; i < N; i++){
    const vx = VX[i], vy = VY[i], s = Math.sqrt(vx * vx + vy * vy);
    if (X[i] !== X[i] || Y[i] !== Y[i] || s !== s){ delBall(i); i--; continue; }   // 万一の壊れた値は捨てる
    if (!(s > 1e-3)){
      if (RD.still && N === 1) continue;
      const a = rnd() * 6.2832; VX[i] = Math.cos(a) * vt * .5; VY[i] = Math.sin(a) * vt * .5; continue;
    }
    let ns = s + (vt - s) * kk; if (ns > vmax) ns = vmax;
    const f = ns / s; VX[i] = vx * f; VY[i] = vy * f;
  }
  return fill;
}

/* ── 進み方（段取り） ──────────────────────────── */
function roundUpdate(dt){
  RD.t += dt;
  const ph = RD.phase;
  RD.mAlpha = ph === "clear" ? Math.max(0, RD.mAlpha - dt / .6) : Math.min(1, RD.mAlpha + dt / .5);
  if (ph === "intro"){
    if (RD.t > .75){
      const p = mech.start();
      addBall(p[0], p[1], 0, 0, RD.pal[0], 0);
      RD.phase = "grow"; RD.growT = RD.t; RD.peakT = RD.t; RD.lastCrush = T;
      AU.sfx("pop");
    }
  } else if (ph === "grow"){
    if (!RD.foeOn && RD.foe && N >= FOE_AT) activateFoe();
    if (N > RD.peak * 1.1){ RD.peak = N; RD.peakT = RD.t; }
    if (N >= RD.target){
      if (RD.foeOn) showLabel("増えるほうの勝ち！");
      if (RD.gold) startGold(); else startWarn();
    }
    else if (N === 0) foeWins(RD.foeOn ? FOE_NAMES[RD.foe] + "の勝ち（全滅）" : "全滅");
    else if ((N < 6 && T - RD.lastCrush > 14) || RD.t - RD.peakT > (RD.foeOn ? 22 : 30) || RD.t - RD.growT > 240){
      // 増えも減りもしなくなった回は、終わりにする（減るものに押さえこまれていたら、減るものの勝ち）
      if (RD.foeOn && N < RD.target * .05) foeWins(FOE_NAMES[RD.foe] + "の勝ち");
      else if (RD.gold && N > 300) startGold(); else startWarn();
    }
  } else if (ph === "gone"){
    if (RD.t - RD.goneT > 1.8) startClear();
  } else if (ph === "warn"){
    const e = (RD.t - RD.warnT) / 1.8;
    cam.shake = Math.max(cam.shake, 1 + 5 * e * e);
    if (e >= 1) startBurst();
  } else if (ph === "burst"){
    const e = RD.t - RD.burstT;
    cam.zoom = 1 + .32 * EZ.outC(Math.min(1, e / 1.3));
    if (e > .7) wipeOffscreen();
    if (N === 0 || e > 4.5) startClear();
  } else if (ph === "gold"){
    const e = RD.t - RD.goldT, wr = EZ.outC(Math.min(1, e / 1.1)) * (R + 30), wr2 = wr * wr;
    for (let i = 0; i < N; i++) if (COL[i] !== GOLD && X[i] * X[i] + Y[i] * Y[i] < wr2){ COL[i] = GOLD; FL[i] = T; }
    if (e > 1 && Math.random() < .5) fxTwinkle();
    if (e > 3.2) RD.fade = Math.max(0, 1 - (e - 3.2) / 1.1);
    if (RD.fade <= 0) startClear();
  } else if (ph === "clear"){
    cam.zoom += (1 - cam.zoom) * Math.min(1, dt * 4);
    if (RD.t - RD.clearT > .75) newRound();
  }
}
function startWarn(){
  RD.phase = "warn"; RD.warnT = RD.t; stopFoes();
  RD.beads = []; for (let i = 0; i < 56; i++) RD.beads.push({ a: i / 56 * Math.PI * 2, t: RD.t + rnd() * 1.5 });
  AU.crackle(1.8);
}
function startBurst(){
  RD.phase = "burst"; RD.burstT = RD.t; wallOn = false; DRN.on = false; EAT.list = [];
  for (let i = 0; i < N; i++){
    const x = X[i], y = Y[i], d = Math.hypot(x, y);
    let nx, ny;
    if (d < 1){ const a = rnd() * 6.2832; nx = Math.cos(a); ny = Math.sin(a); } else { nx = x / d; ny = y / d; }
    const sp = 320 + 760 * (d / R) + rnd() * 160;
    VX[i] = VX[i] * .3 + nx * sp; VY[i] = VY[i] * .3 + ny * sp;
  }
  RD.frags = [];
  for (let i = 0; i < 20; i++){
    const a0 = i / 20 * Math.PI * 2, a1 = (i + 1) / 20 * Math.PI * 2, am = (a0 + a1) / 2, sp = rr(260, 520);
    RD.frags.push({ a0: a0 - am, a1: a1 - am, x: Math.cos(am) * R, y: Math.sin(am) * R, vx: Math.cos(am) * sp, vy: Math.sin(am) * sp,
                    rot: am, vr: rr(-1.5, 1.5) });
  }
  cam.shake = 12;
  AU.sfx("boom");
}
function startGold(){ RD.phase = "gold"; RD.goldT = RD.t; stopFoes(); AU.chime(); }
function startClear(){ RD.phase = "clear"; RD.clearT = RD.t; }
function foeWins(text){ RD.phase = "gone"; RD.goneT = RD.t; stopFoes(); showLabel(text); AU.sfx("gone"); }
/* 割れたあと: 外向きの風で、残った玉も外へ運ぶ */
function blowOut(dt){
  const a = 900 * dt;
  for (let i = 0; i < N; i++){
    const x = X[i], y = Y[i], d = Math.hypot(x, y) || 1;
    VX[i] += x / d * a; VY[i] += y / d * a;
  }
}
function wipeOffscreen(){
  const s = VIEW.s * (CALM ? 1 : cam.zoom), m = rad * 3;
  const l = -VIEW.cx / s - m, r = (CW - VIEW.cx) / s + m, t = -VIEW.cy / s - m, b = (CH - VIEW.cy) / s + m;
  for (let i = N - 1; i >= 0; i--){ const x = X[i], y = Y[i]; if (x < l || x > r || y < t || y > b) delBall(i); }
}

/* ── 進める（描かない） ───────────────────────────── */
let simAcc = 0, lastFill = 0;
function advance(dt){
  simAcc += dt;
  let n = 0;
  while (simAcc >= HS && n < 14){ substep(HS); simAcc -= HS; n++; }
  if (n >= 14) simAcc = 0;
  const ph = RD.phase;
  if (ph !== "burst" && ph !== "clear") lastFill = governor(dt);
  else blowOut(dt);
  kickOn = lastFill < .9;
  if (EAT.list.length) eatersUpdate(dt);
  drainUpdate(dt);
  roundUpdate(dt);
  fxUpdate(dt);
}

/* ── 演出 ──────────────────────────────────────── */
const FX = [];
const cam = { zoom: 1, shake: 0, sx: 0, sy: 0 };
const CALM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);   // 動きを控えめにする設定なら、画面を揺らさない
function fxRing(x, y, col){ FX.push({ k: 0, x, y, col, t0: T, life: .38 }); }
function fxPoof(x, y){ FX.push({ k: 2, x, y, col: 0, t0: T, life: .45 }); }
function fxTwinkle(){
  if (!N) return;
  const i = (Math.random() * N) | 0;
  FX.push({ k: 1, x: X[i], y: Y[i], col: GOLD, t0: T, life: .6 });
}
function fxUpdate(dt){
  for (let i = FX.length - 1; i >= 0; i--) if (T - FX[i].t0 > FX[i].life) FX.splice(i, 1);
  if (RD.frags) for (const f of RD.frags){ f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; }
  cam.shake *= Math.exp(-dt / .12);
}

/* ── 画面 ──────────────────────────────────────── */
const cv = $("#cv"), ctx = cv.getContext("2d");
const bg = $("#bg"), bctx = bg.getContext("2d");
const under = $("#under"), uctx = under.getContext("2d");
const glc = $("#gl");
const countEl = $("#count"), labelEl = $("#label");
let DPR = 1, CW = 0, CH = 0;
const VIEW = { s: 1, cx: 0, cy: 0 };
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  CW = Math.max(1, Math.round(w * DPR)); CH = Math.max(1, Math.round(h * DPR));
  cv.width = bg.width = under.width = glc.width = CW; cv.height = bg.height = under.height = glc.height = CH;
  const top = SET.count ? Math.max(64, h * .12) : 18;
  const avail = h - top - 18;
  const diam = Math.max(60, Math.min(w - 32, avail) * .97);
  VIEW.s = diam / 2 * DPR / R; VIEW.cx = w / 2 * DPR; VIEW.cy = (top + avail / 2) * DPR;
  const fs = clamp(top * .5, 28, 74);
  countEl.style.fontSize = fs + "px";
  countEl.style.top = Math.max(8, (top - fs) / 2 - 2) + "px";
  labelEl.style.top = Math.max(8, (top - fs) / 2 - 2) + fs + 8 + "px";
  $("#hint").style.top = Math.max(8, (top - fs) / 2 - 2) + fs + 28 + "px";
  countEl.classList.toggle("off", !SET.count);
  if (RD){ buildSprites(); drawBg(); }
}
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, t){ const a = hexRgb(h1), b = hexRgb(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`; }
function rgba(h, a){ const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function drawBg(){
  const g = bctx, w = CW, h = CH, M = Math.max(w, h);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const rg = g.createRadialGradient(VIEW.cx, VIEW.cy, 0, VIEW.cx, VIEW.cy, M * .75);
  rg.addColorStop(0, "#0d1020"); rg.addColorStop(1, "#030308");
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 8; i++){
    const x = Math.random() * w, y = Math.random() * h, r = (.1 + Math.random() * .2) * M;
    const col = PAL[(Math.random() * PAL.length) | 0];
    const gg = g.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, rgba(col, .075)); gg.addColorStop(1, rgba(col, 0));
    g.fillStyle = gg; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
}
const SPR = { img: [], white: null, size: 4, rp: 1 };
function buildSprites(){
  const rp = rad * VIEW.s, size = Math.max(4, Math.ceil(rp * 2 + 2));
  SPR.size = size; SPR.rp = rp;
  SPR.img = PALX.map(c => ballSprite(c, size, rp, false));
  SPR.white = ballSprite("#ffffff", size, rp, true);
}
function ballSprite(hex, size, rp, flat){
  const cnv = document.createElement("canvas"); cnv.width = cnv.height = size;
  const g = cnv.getContext("2d"), m = size / 2;
  if (flat || rp < 2.2){ g.fillStyle = hex; g.beginPath(); g.arc(m, m, Math.max(.8, rp), 0, Math.PI * 2); g.fill(); return cnv; }
  const grd = g.createRadialGradient(m - rp * .38, m - rp * .42, rp * .06, m, m, rp);
  grd.addColorStop(0, mix(hex, "#ffffff", .62)); grd.addColorStop(.36, hex);
  grd.addColorStop(.86, mix(hex, "#000000", .22)); grd.addColorStop(1, mix(hex, "#000000", .5));
  g.fillStyle = grd; g.beginPath(); g.arc(m, m, rp, 0, Math.PI * 2); g.fill();
  if (rp > 4){ g.fillStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.ellipse(m - rp * .34, m - rp * .4, rp * .27, rp * .16, -.6, 0, Math.PI * 2); g.fill(); }
  return cnv;
}
/* 玉ひとつの大きさ（出たて・寿命）と濃さ（穴から出ていくとき） */
function ballScale(i){
  let z = 1;
  const age = T - BORN[i];
  if (age < .2) z = Math.max(.05, EZ.outBack(age / .2));
  if (T > DIE[i]) z *= Math.max(0, 1 - (T - DIE[i]) / .25);
  return z;
}
function ballAlpha(i){
  if (!ESC[i]) return 1;
  return clamp(1 - (Math.hypot(X[i], Y[i]) - R) / (2.5 * rad), 0, 1);
}

/* 玉は WebGL でまとめて描く（使えないときは下の drawBalls で 1 個ずつ描く） */
const GLR = {
  gl: null, ok: false, maxPt: 0, data: new Float32Array(MAXN * 6), loc: {},
  init(){
    let gl = null;
    try { gl = glc.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false }); } catch (e){}
    if (!gl) return;
    const vs = `
      attribute vec2 aPos; attribute float aSize; attribute float aCol; attribute float aFlash; attribute float aAlpha;
      uniform vec2 uRes; uniform vec3 uPal[${PALX.length}];
      varying vec3 vCol; varying float vFlash; varying float vSize; varying float vAlpha;
      void main(){
        vec2 p = aPos / uRes * 2.0 - 1.0;
        gl_Position = vec4(p.x, -p.y, 0.0, 1.0);
        gl_PointSize = aSize; vSize = aSize; vFlash = aFlash; vAlpha = aAlpha;
        vCol = uPal[int(aCol + 0.5)];
      }`;
    const fs = `
      precision mediump float;
      varying vec3 vCol; varying float vFlash; varying float vSize; varying float vAlpha;
      uniform float uAlpha;
      void main(){
        vec2 p = gl_PointCoord * 2.0 - 1.0;
        float d = length(p);
        float aa = 2.0 / max(vSize, 1.0);
        float edge = 1.0 - smoothstep(1.0 - aa * 1.5, 1.0, d);
        if (edge <= 0.0) discard;
        float t = clamp(length(p - vec2(-0.38, -0.42)) / 1.42, 0.0, 1.0);
        vec3 lit = mix(vCol, vec3(1.0), 0.62), c;
        if (t < 0.26) c = mix(lit, vCol, t / 0.26);
        else if (t < 0.62) c = mix(vCol, vCol * 0.78, (t - 0.26) / 0.36);
        else c = mix(vCol * 0.78, vCol * 0.5, (t - 0.62) / 0.38);
        if (vSize > 8.0){
          vec2 q = p - vec2(-0.34, -0.40);
          vec2 e = vec2(q.x * 0.8253 - q.y * 0.5646, q.x * 0.5646 + q.y * 0.8253) / vec2(0.27, 0.16);
          c = mix(c, vec3(1.0), 0.5 * (1.0 - smoothstep(0.75, 1.0, length(e))));
        }
        c = mix(c, vec3(1.0), vFlash);
        float a = edge * uAlpha * vAlpha;
        gl_FragColor = vec4(c * a, a);
      }`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    try {
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      gl.useProgram(pr);
      for (const a of ["aPos", "aSize", "aCol", "aFlash", "aAlpha"]) this.loc[a] = gl.getAttribLocation(pr, a);
      for (const u of ["uRes", "uPal", "uAlpha"]) this.loc[u] = gl.getUniformLocation(pr, u);
      const pal = new Float32Array(PALX.length * 3);
      PALX.forEach((h, i) => { const c = hexRgb(h); pal[i * 3] = c[0] / 255; pal[i * 3 + 1] = c[1] / 255; pal[i * 3 + 2] = c[2] / 255; });
      gl.uniform3fv(this.loc.uPal, pal);
      this.buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
      const L = this.loc, st = 24;
      gl.enableVertexAttribArray(L.aPos); gl.vertexAttribPointer(L.aPos, 2, gl.FLOAT, false, st, 0);
      gl.enableVertexAttribArray(L.aSize); gl.vertexAttribPointer(L.aSize, 1, gl.FLOAT, false, st, 8);
      gl.enableVertexAttribArray(L.aCol); gl.vertexAttribPointer(L.aCol, 1, gl.FLOAT, false, st, 12);
      gl.enableVertexAttribArray(L.aFlash); gl.vertexAttribPointer(L.aFlash, 1, gl.FLOAT, false, st, 16);
      gl.enableVertexAttribArray(L.aAlpha); gl.vertexAttribPointer(L.aAlpha, 1, gl.FLOAT, false, st, 20);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      this.maxPt = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 0;
      this.gl = gl; this.ok = this.maxPt >= 16;
    } catch (e){ console.warn("WebGL を使わずに描きます:", e); this.ok = false; }
    glc.addEventListener("webglcontextlost", e => { e.preventDefault(); this.ok = false; });
  },
  clear(){ if (this.gl && !this.gl.isContextLost()){ this.gl.clearColor(0, 0, 0, 0); this.gl.clear(this.gl.COLOR_BUFFER_BIT); } },
  draw(s, ox, oy, alpha){
    const gl = this.gl, d = this.data, base = 2 * rad * s + 1.5;
    if (!this.ok || base > this.maxPt || gl.isContextLost()) return false;
    const l = -base, r = CW + base, t = -base, b = CH + base;
    let n = 0;
    for (let i = 0; i < N; i++){
      const x = ox + X[i] * s, y = oy + Y[i] * s;
      if (x < l || x > r || y < t || y > b) continue;
      const fe = T - FL[i], o = n * 6;
      d[o] = x; d[o + 1] = y; d[o + 2] = base * ballScale(i);
      d[o + 3] = COL[i]; d[o + 4] = fe < .32 ? .85 * (1 - fe / .32) : 0; d[o + 5] = ballAlpha(i);
      n++;
    }
    gl.viewport(0, 0, CW, CH); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (n){
      gl.uniform2f(this.loc.uRes, CW, CH); gl.uniform1f(this.loc.uAlpha, alpha);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.subarray(0, n * 6));
      gl.drawArrays(gl.POINTS, 0, n);
    }
    return true;
  },
};

const ORD = new Int32Array(MAXN), CCNT = new Int32Array(PALX.length + 1);
function drawBalls(s, ox, oy, alpha){
  const c = ctx, size = SPR.size * (s / VIEW.s), half = size / 2;
  const l = -size, r = CW + size, t = -size, b = CH + size;
  CCNT.fill(0);
  for (let i = 0; i < N; i++) CCNT[COL[i] + 1]++;
  for (let k = 0; k < PALX.length; k++) CCNT[k + 1] += CCNT[k];
  for (let i = 0; i < N; i++) ORD[CCNT[COL[i]]++] = i;
  c.globalAlpha = alpha;
  let q = 0;
  for (let k = 0; k < PALX.length; k++){
    const img = SPR.img[k], end = CCNT[k];
    for (; q < end; q++){
      const i = ORD[q], x = ox + X[i] * s, y = oy + Y[i] * s;
      if (x < l || x > r || y < t || y > b) continue;
      const z = ballScale(i), a = ballAlpha(i);
      if (a < 1) c.globalAlpha = alpha * a;
      if (z !== 1){ const zz = size * z; c.drawImage(img, x - zz / 2, y - zz / 2, zz, zz); }
      else c.drawImage(img, x - half, y - half, size, size);
      if (a < 1) c.globalAlpha = alpha;
    }
  }
  for (let i = 0; i < N; i++){
    const e = T - FL[i];
    if (e < .32){ c.globalAlpha = alpha * .85 * (1 - e / .32); c.drawImage(SPR.white, ox + X[i] * s - half, oy + Y[i] * s - half, size, size); }
  }
  c.globalAlpha = 1;
}
function drawContainer(c, s){
  const ph = RD.phase, lw = 2.2 * DPR / s;
  if (ph === "burst" || ph === "clear"){
    if (!RD.frags) return;
    const e = RD.t - RD.burstT, a = Math.max(0, 1 - e / 1.4);
    if (a <= 0) return;
    c.strokeStyle = `rgba(255,255,255,${.85 * a})`; c.lineWidth = lw;
    for (const f of RD.frags){
      c.save(); c.translate(f.x, f.y); c.rotate(f.rot);
      c.beginPath(); c.arc(-R, 0, R, f.a0, f.a1); c.stroke();
      c.restore();
    }
    return;
  }
  let alpha = .85 * RD.fade;
  if (ph === "warn") alpha *= .55 + .45 * Math.random();
  c.strokeStyle = `rgba(255,255,255,${alpha})`; c.lineWidth = lw;
  if (DRN.on && DRN.gaps.length){
    // 穴のところだけ線を切る
    const gs = DRN.gaps, n = gs.length;
    for (let j = 0; j < n; j++){
      const g = gs[j], h = gs[(j + 1) % n];
      const from = DRN.ang + g.a + g.w, to = DRN.ang + h.a - h.w + (j + 1 === n ? Math.PI * 2 : 0);
      if (to > from){ c.beginPath(); c.arc(0, 0, R, from, to); c.stroke(); }
    }
    c.fillStyle = `rgba(255,255,255,${alpha})`;
    for (const g of gs) for (const sg of [-1, 1]){ const a = DRN.ang + g.a + sg * g.w; c.beginPath(); c.arc(Math.cos(a) * R, Math.sin(a) * R, Math.max(4, lw * 1.6), 0, Math.PI * 2); c.fill(); }
  } else {
    const a0 = -Math.PI / 2, sweep = Math.PI * 2 * (ph === "intro" ? EZ.outC(Math.min(1, RD.t / .6)) : 1);
    c.beginPath(); c.arc(0, 0, R, a0, a0 + sweep); c.stroke();
  }
  if (ph === "warn" && RD.beads){
    for (const b of RD.beads){
      const e = RD.t - b.t; if (e < 0) continue;
      const k = Math.min(1, e / .15), rr2 = (5 + 3 * Math.sin(e * 18)) * k * DPR / s * 1.6;
      c.beginPath(); c.arc(Math.cos(b.a) * R, Math.sin(b.a) * R, Math.max(rr2, lw), 0, Math.PI * 2);
      c.fillStyle = "rgba(255,255,255,.95)"; c.fill();
    }
  }
}
function drawEaters(c){
  for (const e of EAT.list){
    const r = e.r, glow = Math.max(0, 1 - (T - e.gulp) / .4), rim = PALX[e.col];
    const g = c.createRadialGradient(e.x, e.y, r * .2, e.x, e.y, r * 1.4);
    g.addColorStop(0, "rgba(1,1,4,1)"); g.addColorStop(.7, "rgba(3,3,9,.98)");
    g.addColorStop(.84, rgba(rim, .3 + .5 * glow)); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.beginPath(); c.arc(e.x, e.y, r * 1.4, 0, Math.PI * 2); c.fill();
    c.strokeStyle = rgba(rim, .28 + .3 * glow); c.lineWidth = Math.max(1.5, r * .06); c.lineCap = "round";
    for (let k = 0; k < 3; k++){ const a0 = T * 2.4 + k * 2.094; c.beginPath(); c.arc(e.x, e.y, r * (.5 + .14 * k), a0, a0 + 1.3); c.stroke(); }
  }
}
function drawFx(c){
  for (const f of FX){
    const e = (T - f.t0) / f.life;
    if (f.k === 0){
      c.strokeStyle = rgba(PALX[f.col], .9 * (1 - e)); c.lineWidth = rad * .45 * (1 - e) + .5;
      c.beginPath(); c.arc(f.x, f.y, rad * (1.2 + 3.2 * EZ.outC(e)), 0, Math.PI * 2); c.stroke();
    } else if (f.k === 2){
      c.strokeStyle = `rgba(150,150,165,${.8 * (1 - e)})`; c.lineWidth = rad * .3 * (1 - e) + .5;
      c.beginPath(); c.arc(f.x, f.y, rad * (.6 + 1.8 * EZ.outC(e)), 0, Math.PI * 2); c.stroke();
      c.fillStyle = `rgba(10,10,16,${.6 * (1 - e)})`; c.beginPath(); c.arc(f.x, f.y, rad * (1 - e), 0, Math.PI * 2); c.fill();
    } else {
      const r = rad * 2.6 * Math.sin(Math.PI * e);
      c.strokeStyle = `rgba(255,240,200,${.9 * (1 - e)})`; c.lineWidth = rad * .25;
      c.beginPath(); c.moveTo(f.x - r, f.y); c.lineTo(f.x + r, f.y); c.moveTo(f.x, f.y - r); c.lineTo(f.x, f.y + r); c.stroke();
    }
  }
}
let shownN = -1, bumpAt = 0;
const NF = new Intl.NumberFormat("en-US");
function render(){
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, CW, CH);
  uctx.setTransform(1, 0, 0, 1, 0, 0); uctx.clearRect(0, 0, CW, CH);
  if (!RD) return;
  const shake = CALM ? 0 : cam.shake, zoom = CALM ? 1 : cam.zoom;
  cam.sx = (Math.random() - .5) * 2 * shake * DPR; cam.sy = (Math.random() - .5) * 2 * shake * DPR;
  const s = VIEW.s * zoom, ox = VIEW.cx + cam.sx, oy = VIEW.cy + cam.sy;
  const fade = RD.phase === "clear" ? Math.min(RD.fade, RD.mAlpha) : RD.fade;
  uctx.setTransform(s, 0, 0, s, ox, oy);
  uctx.globalAlpha = RD.mAlpha * fade; mech.drawBack(uctx); uctx.globalAlpha = 1;
  if (!GLR.draw(s, ox, oy, fade)){ GLR.clear(); drawBalls(s, ox, oy, fade); }
  c.setTransform(s, 0, 0, s, ox, oy);
  drawContainer(c, s);
  c.globalAlpha = fade; drawEaters(c);
  c.globalAlpha = RD.mAlpha * fade; mech.draw(c); c.globalAlpha = fade;
  drawFx(c);
  c.globalAlpha = 1;
  // 玉の数
  if (N !== shownN && RD.phase !== "clear"){   // 消えていく間は数字を止めておく
    if (N > shownN && shownN > 0) bumpAt = performance.now();
    shownN = N; countEl.textContent = NF.format(N);
  }
  const b = Math.exp(-(performance.now() - bumpAt) / 110);
  countEl.style.transform = b > .01 ? `scale(${1 + .1 * b})` : "";
  countEl.classList.toggle("gold", RD.phase === "gold" || (RD.phase === "clear" && RD.gold && RD.fade < 1));
  countEl.style.opacity = RD.phase === "clear" || RD.phase === "intro" ? ".35" : "1";
}

/* ── 音（その場で作る。ファイルは使わない） ─────────── */
const AU = {
  ctx: null, master: null, B: {}, voices: 0, hum: null, ready: false, last: {},
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e){ return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .2;
    this.master = c.createGain(); this.master.connect(comp); comp.connect(c.destination);
    try { this.synth(); } catch (e){ console.error(e); return; }
    const src = c.createBufferSource(); src.buffer = this.B.hum; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
    this.hum = c.createGain(); this.hum.gain.value = 0;
    src.connect(lp); lp.connect(this.hum); this.hum.connect(this.master); src.start();
    this.ready = true; this.setVol();
    c.onstatechange = () => showHint();
  },
  running(){ return this.ready && this.ctx.state === "running" && !SET.mute && SET.vol > 0; },
  resume(){ this.init(); if (this.ctx && this.ctx.state !== "running") this.ctx.resume().then(showHint, () => {}); },
  setVol(){ if (this.master){ const v = SET.mute ? 0 : (SET.vol / 100) ** 2; this.master.gain.setTargetAtTime(v, this.ctx.currentTime, .03); } },
  rl(key, gap){ const now = this.ctx.currentTime; if ((this.last[key] || -9) + gap > now) return false; this.last[key] = now; return true; },
  play(buf, gain, rate, pan, when){
    if (this.voices > 44 || !buf) return;
    const c = this.ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; src.playbackRate.value = rate || 1; g.gain.value = gain;
    src.connect(g);
    if (pan && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(this.master); }
    else g.connect(this.master);
    this.voices++; src.onended = () => { this.voices--; };
    src.start(when || 0);
  },
  any(a){ return a[(Math.random() * a.length) | 0]; },
  sfx(name){
    if (!this.running()) return;
    const B = this.B, now = this.ctx.currentTime, j = () => .94 + Math.random() * .12;
    if (name === "press"){ this.play(B.clank, .95, .92 * j()); }
    else if (name === "cross"){ this.play(B.clank, .72, 1.18 * j()); this.play(B.clack, .4, 1); }
    else if (name === "box"){ this.play(B.clank, .66, 1.32 * j()); this.play(B.clack, .45, .9); }
    else if (name === "loops"){ this.play(B.snip, .8, j()); }
    else if (name === "lock"){ this.play(B.clack, .3, 1.05 * j(), 0, now); }
    else if (name === "pop"){ this.play(this.any(B.pop), .5, j()); }
    else if (name === "boom"){ this.play(B.boom, 1, 1); }
    else if (name === "gulp"){ if (this.rl("gulp", .09)) this.play(this.any(B.pop), .3, .45 * j()); }
    else if (name === "poof"){ if (this.rl("poof", .07)) this.play(B.poof, .5, j()); }
    else if (name === "pip"){ if (this.rl("pip", .12)) this.play(this.any(B.tick), .07, 2.2 * j()); }
    else if (name === "foe"){ this.play(B.bell, .26, .36, -.3, now); this.play(B.bell, .22, .27, .3, now + .12); }
    else if (name === "gone"){ this.play(B.bell, .3, .3, 0, now); this.play(B.bell, .22, .225, 0, now + .25); }
  },
  pops(m){
    if (!this.running()) return;
    const n = Math.min(6, m), now = this.ctx.currentTime;
    for (let q = 0; q < n; q++) this.play(this.any(this.B.pop), .42 / (1 + q * .35), .9 + Math.random() * .35, (Math.random() - .5) * .8, now + q * (.012 + Math.random() * .025));
  },
  crackle(sec){
    if (!this.running()) return;
    const now = this.ctx.currentTime;
    for (let q = 0; q < 34; q++){ const t = sec * Math.sqrt(q / 34); this.play(this.any(this.B.tick), .12 + .25 * (t / sec), 1.6 + Math.random() * .8, (Math.random() - .5) * 1.4, now + t); }
  },
  chime(){
    if (!this.running()) return;
    const now = this.ctx.currentTime;
    [1, 1.25, 1.5, 2, 2.5].forEach((r, q) => this.play(this.B.bell, .32, r * .5, (q - 2) * .25, now + q * .09));
  },
  frame(fill, motion){
    if (!this.ready) return;
    const on = this.running();
    this.hum.gain.setTargetAtTime(on ? Math.min(.16, motion * .16) : 0, this.ctx.currentTime, .05);
    if (!on) return;
    const quiet = 1 - .65 * smooth(.25, .7, fill);
    if (hitN && Math.random() < Math.min(.85, .15 + hitN / 40)){
      this.play(this.any(this.B.tick), .26 * quiet * Math.min(1, hitV / (V0 * 1.4)) + .02, .8 + Math.random() * .5, hitX / R * .7);
    }
    if (clinkN && Math.random() < Math.min(.6, .12 + clinkN / 30)){
      this.play(this.any(this.B.tick), .2 * quiet * Math.min(1, clinkV / (V0 * 1.4)) + .02, 1.35 + Math.random() * .4, clinkX / R * .7);
    }
  },
  synth(){
    const c = this.ctx, sr = c.sampleRate, TAU = Math.PI * 2, rn = Math.random;
    const mk = (sec, fn, peak) => {
      const n = Math.max(1, Math.floor(sec * sr)), b = c.createBuffer(1, n, sr), d = b.getChannelData(0);
      fn(d, n); let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(d[i]));
      if (m > 0){ const g = (peak || .9) / m; for (let i = 0; i < n; i++) d[i] *= g; }
      const f = Math.min(n, Math.floor(sr * .004)); for (let i = 0; i < f; i++) d[n - 1 - i] *= i / f;
      return b;
    };
    // コツッ（玉どうし）
    this.B.tick = [0, 1, 2, 3, 4, 5].map(() => mk(.07, (d, n) => {
      const f1 = 850 + rn() * 900, f2 = f1 * (2.2 + rn() * .6); let lp = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = Math.sin(TAU * f1 * t) * Math.exp(-t / .011) * .8 + Math.sin(TAU * f2 * t) * Math.exp(-t / .005) * .35;
        if (t < .0025){ lp += ((rn() * 2 - 1) * (1 - t / .0025) - lp) * .5; v += lp * .5; }
        d[i] = v;
      }
    }, .8));
    // ポン（分かれる）
    this.B.pop = [0, 1, 2].map(() => mk(.14, (d, n) => {
      const f0 = 240 + rn() * 90, f1 = f0 * (2.6 + rn() * .7); let ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, f = f0 + (f1 - f0) * (1 - Math.exp(-t / .02)); ph += TAU * f / sr;
        d[i] = Math.sin(ph) * Math.min(1, t / .002) * Math.exp(-t / .03);
      }
    }));
    // ガシャン（閉じる）
    this.B.clank = mk(1.1, (d, n) => {
      const P = [[390, .34, .5], [1040, .22, .34], [1730, .16, .26], [2620, .11, .18], [3510, .08, .12], [4890, .05, .08]];
      let lp = 0, ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        const ft = 42 + 80 * Math.exp(-t / .035); ph += TAU * ft / sr; v += Math.sin(ph) * Math.exp(-t / .17);
        for (const p of P) v += Math.sin(TAU * p[0] * t + p[0]) * Math.exp(-t / p[1]) * p[2];
        lp += ((rn() * 2 - 1) - lp) * .25; v += lp * Math.exp(-t / .02) * .9;
        d[i] = v * Math.min(1, t / .001);
      }
    });
    // カチッ（閉じかけ）
    this.B.clack = mk(.13, (d, n) => {
      let hp = 0, prev = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, w = rn() * 2 - 1; hp = .9 * (hp + w - prev); prev = w;
        d[i] = hp * Math.exp(-t / .006) * .8 + Math.sin(TAU * 2150 * t) * Math.exp(-t / .018) * .5 + Math.sin(TAU * 3320 * t) * Math.exp(-t / .012) * .35;
      }
    });
    // シャキン（8 の字）
    this.B.snip = mk(.65, (d, n) => {
      const P = [[2280, .16, .4], [3460, .12, .32], [5120, .09, .22], [1210, .2, .25]]; let ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        for (const p of P) v += Math.sin(TAU * p[0] * t) * Math.exp(-t / p[1]) * p[2];
        v += (rn() * 2 - 1) * Math.exp(-t / .012) * .5;
        const ft = 70 + 60 * Math.exp(-t / .03); ph += TAU * ft / sr; v += Math.sin(ph) * Math.exp(-t / .09) * .6;
        d[i] = v;
      }
    });
    // ドーン（割れる）
    this.B.boom = mk(2.3, (d, n) => {
      let ph = 0, lp = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, f = 28 + 40 * Math.exp(-t / .25); ph += TAU * f / sr;
        let v = Math.sin(ph) * Math.exp(-t / .7);
        lp += ((rn() * 2 - 1) - lp) * (.02 + .5 * Math.exp(-t / .35)); v += lp * Math.exp(-t / .9) * 1.2;
        d[i] = v * Math.min(1, t / .004);
      }
    });
    // ボフッ（消し刃）
    this.B.poof = mk(.2, (d, n) => {
      let lp = 0, ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; lp += ((rn() * 2 - 1) - lp) * .1;
        const f = 90 + 60 * Math.exp(-t / .03); ph += TAU * f / sr;
        d[i] = lp * Math.exp(-t / .045) * 1.4 + Math.sin(ph) * Math.exp(-t / .06) * .5;
      }
    });
    // キラン（金色・合図）
    this.B.bell = mk(2.2, (d, n) => {
      const f = 1046.5, P = [[1, .9, 1], [2.76, .45, .5], [5.4, .25, .25], [8.93, .12, .12]];
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        for (const p of P) v += Math.sin(TAU * f * p[0] * t) * Math.exp(-t / p[1]) * p[2];
        d[i] = v * Math.min(1, t / .002);
      }
    }, .6);
    // ウィーン（仕掛けが動く音。くり返し）
    this.B.hum = mk(3, (d, n) => {
      let b = 0, lp = 0;
      for (let i = 0; i < n; i++){ const w = rn() * 2 - 1; b = (b + .02 * w) / 1.02; lp += (b - lp) * .08; d[i] = lp + Math.sin(TAU * 55 * i / sr) * .02; }
      const f = Math.floor(sr * .2); for (let i = 0; i < f; i++){ d[i] *= i / f; }
    }, .5);
  },
};
function showHint(){
  const h = $("#hint");
  h.hidden = !(AU.ctx && AU.ctx.state !== "running" && !SET.mute && SET.vol > 0);
}

/* ── 名札（仕掛けの名前などを少し出す） ─────────────────── */
let labelTimer = 0;
function showLabel(text, keep){
  labelEl.textContent = text; labelEl.classList.add("show");
  clearTimeout(labelTimer);
  if (!keep) labelTimer = setTimeout(() => labelEl.classList.remove("show"), 2600);
}

/* ── 操作 ──────────────────────────────────────── */
const ICON = {
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM18.5 6a8.5 8.5 0 010 12l-1.4-1.4a6.5 6.5 0 000-9.2z"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9.4l1.4-1.4 2.1 2.1 2.1-2.1L23 9.4 20.9 11.5 23 13.6l-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>',
};
let paused = Q.get("pause") === "1";   // ?pause=1 で止めた状態から始める（録画用）
function buildPanel(){
  const box = $("#opts"); let sec = "";
  for (const [s, key, label, opts] of OPTS){
    if (s !== sec){ sec = s; const h = document.createElement("h3"); h.textContent = s; box.appendChild(h); }
    const row = document.createElement("div"); row.className = "row";
    const sp = document.createElement("span"); sp.textContent = label;
    const sel = document.createElement("select"); sel.id = "o_" + key;
    for (const [v, t] of opts){ const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); }
    sel.onchange = () => {
      sel.blur(); SET[key] = sel.value; saveSet();
      if (key === "quality") HS = HS_Q[SET.quality] || 1 / 180;
      if (!LIVE.has(key)) nextRound();
    };
    row.appendChild(sp); row.appendChild(sel); box.appendChild(row);
  }
}
function syncUI(){
  $("#bPlay").innerHTML = paused ? ICON.play : ICON.pause;
  $("#bMute").innerHTML = SET.mute ? ICON.mute : ICON.snd;
  $("#bMute").classList.toggle("on", SET.mute);
  $("#sMech").value = MECHS[SET.mech] ? SET.mech : "auto";
  for (const o of OPTS){ const el = $("#o_" + o[1]); if (el && o[3].some(v => v[0] === SET[o[1]])) el.value = SET[o[1]]; }
  $("#cCount").checked = !!SET.count;
  $("#vol").value = SET.vol; $("#vol2").value = SET.vol;
  $("#ver").textContent = "ふえる玉 v" + VERSION;
}
function togglePause(){ paused = !paused; syncUI(); if (paused) showLabel("一時停止中", true); else labelEl.classList.remove("show"); }
function nextRound(){ paused = false; syncUI(); newRound(); }
function toggleMute(){ SET.mute = !SET.mute; saveSet(); AU.resume(); AU.setVol(); syncUI(); showHint(); }
function setVol(v){ SET.vol = clamp(Math.round(v), 0, 100); if (SET.vol > 0) SET.mute = false; saveSet(); AU.resume(); AU.setVol(); syncUI(); showHint(); }
function setMech(m){ SET.mech = m; saveSet(); syncUI(); nextRound(); }
function toggleFull(){
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e){}
}
$("#bPlay").onclick = togglePause;
$("#bNext").onclick = nextRound;
$("#bMute").onclick = toggleMute;
$("#bFull").onclick = toggleFull;
$("#bSet").onclick = () => { $("#panel").hidden = !$("#panel").hidden; $("#bSet").classList.toggle("on", !$("#panel").hidden); };
$("#vol").oninput = e => setVol(+e.target.value);
$("#vol2").oninput = e => setVol(+e.target.value);
$("#sMech").onchange = e => { e.target.blur(); setMech(e.target.value); };
$("#cCount").onchange = e => { SET.count = e.target.checked; saveSet(); layout(); };
cv.addEventListener("dblclick", toggleFull);
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "SELECT" || (tag === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox")) return;
  const k = e.key;
  if (k === " "){ togglePause(); e.preventDefault(); }
  else if (k === "n" || k === "N" || k === "ArrowRight"){ nextRound(); }
  else if (k === "f" || k === "F"){ toggleFull(); }
  else if (k === "m" || k === "M"){ toggleMute(); }
  else if (k === "ArrowUp"){ setVol(SET.vol + 10); e.preventDefault(); }
  else if (k === "ArrowDown"){ setVol(SET.vol - 10); e.preventDefault(); }
  else if (k === "0"){ setMech("auto"); }
  else if (k >= "1" && k <= "3"){ setMech(MECH_KEYS[+k - 1]); }
  else if (k === "c" || k === "C"){ SET.count = !SET.count; saveSet(); syncUI(); layout(); }
  poke();
});
/* しばらく触らなければ、操作の帯とマウスの矢印を隠す */
let idleTimer = 0, overBar = false;
function poke(){
  $("#bar").classList.remove("hide"); document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (overBar || !$("#panel").hidden) return poke();
    $("#bar").classList.add("hide"); document.body.classList.add("idle");
  }, 2800);
}
for (const ev of ["pointermove", "pointerdown", "touchstart"]) addEventListener(ev, poke, { passive: true });
for (const ev of ["pointerdown", "keydown", "touchend"]) addEventListener(ev, () => AU.resume(), { passive: true });
$("#bar").addEventListener("pointerenter", () => { overBar = true; });
$("#bar").addEventListener("pointerleave", () => { overBar = false; });
cv.addEventListener("pointerdown", () => { if (!$("#panel").hidden){ $("#panel").hidden = true; $("#bSet").classList.remove("on"); } });

/* ── くり返し ──────────────────────────────────── */
let last = performance.now(), physAvg = 0, fps = 60, fpsN = 0, fpsT = last;
function frame(now){
  requestAnimationFrame(frame);
  try {
    let dt = (now - last) / 1000; last = now;
    if (dt > .1) dt = .1;
    if (dt < 0) dt = 0;
    fpsN++; if (now - fpsT > 1000){ fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
    hitN = 0; hitV = 0; clinkN = 0; clinkV = 0;
    if (!paused){
      const t0 = performance.now();
      advance(dt * +SET.speed);
      physAvg = physAvg * .95 + (performance.now() - t0) * .05;
      // 重いときは、1 こまの歩数を減らす（細かさの設定より細かくはしない）
      const base = HS_Q[SET.quality] || 1 / 180;
      if (physAvg > 22 && HS < 1 / 91) HS = 1 / 90;
      else if (physAvg > 12 && HS < 1 / 121) HS = 1 / 120;
      else if (physAvg < 5 && HS > base) HS = base;
      AU.frame(lastFill, mech.motion());
    } else if (AU.ready) AU.frame(lastFill, 0);
    render();
  } catch (err){ console.error(err); }
}

/* 試験用（画面を描かずに速く進めるなど） */
window.FT = {
  version: VERSION,
  state(){ return { N, phase: RD.phase, mech: RD.mk, nb: mech.NB || mech.NL || 0, shape: mech.shape || "", size: RD.sz, k: RD.k,
                    cap: RD.cap, target: RD.target, gold: RD.gold, foe: RD.foe, foeOn: RD.foeOn, foeLv: RD.foeLv,
                    t: +RD.t.toFixed(2), T: +T.toFixed(2), epoch: RD.epoch, peak: RD.peak, rounds: STAT.rounds,
                    crush: STAT.crush, erased: STAT.erased, eaten: STAT.eaten, drained: STAT.drained, expired: STAT.expired,
                    eaters: EAT.list.length, gaps: DRN.on ? DRN.gaps.length : 0, red: mech.redOn ? mech.red.size : 0,
                    fps: Math.round(fps), physMs: +physAvg.toFixed(2), hs: Math.round(1 / HS), rad, gl: GLR.ok,
                    paused, mute: SET.mute, vol: SET.vol, setMech: SET.mech }; },
  run(sec){ const n = Math.round(sec * 60); for (let i = 0; i < n; i++){ hitN = 0; clinkN = 0; advance(1 / 60); } return this.state(); },
  next(){ newRound(); return this.state(); },
  pause(v){ paused = !!v; syncUI(); },
};

buildPanel();
layout();
if (Q.get("gl") !== "0") GLR.init();
newRound();
syncUI();
AU.init();
showHint();
poke();
addEventListener("resize", layout);
requestAnimationFrame(frame);
</script>
</body>
