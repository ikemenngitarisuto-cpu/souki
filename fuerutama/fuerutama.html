<style>
/* いつも暗い画面（夜の実験室のような見た目。明るい設定でも同じ色） */
:root{
  --bg:#04050a; --fg:#f3f5ff; --muted:#9ba3bf; --panel:rgba(16,18,30,.92); --line:rgba(255,255,255,.14);
  --btn:rgba(255,255,255,.07); --btn-hover:rgba(255,255,255,.16); --gold:#f6c445; --focus:#9fb4ff; --warn:#ff8f8f;
  --sans:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.idle{cursor:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#count{position:fixed;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;pointer-events:none;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,.7);transform-origin:50% 60%;transition:color .4s}
#count.gold{color:var(--gold);text-shadow:0 0 26px rgba(246,196,69,.45)}
#count.off{display:none}
#label,#fight{position:fixed;left:16px;right:16px;text-align:center;pointer-events:none;letter-spacing:.08em}
#label{font-size:13px;color:var(--muted);opacity:0;transition:opacity .8s}
#label.show{opacity:1}
#fight{font-size:12px;color:var(--warn);opacity:0;transition:opacity .5s;font-variant-numeric:tabular-nums}
#fight.show{opacity:.95}
#hint{position:fixed;left:16px;right:16px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;
  letter-spacing:.06em;transition:opacity .5s}
#hint[hidden]{display:block;opacity:0}
#bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:7px 9px;
  width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .35s,transform .35s}
#bar.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
#bar button,#panel select,#bar select,.chips button{font:inherit;font-size:13px;color:var(--fg);background:var(--btn);
  border:1px solid transparent;border-radius:9px;height:34px;cursor:pointer}
#bar button{width:38px;display:grid;place-items:center;padding:0}
#bar button:hover,#bar select:hover,#panel select:hover,.chips button:hover{background:var(--btn-hover)}
#bar button.on,.chips button.on{border-color:rgba(255,255,255,.4);background:rgba(159,180,255,.18)}
#bar select,#panel select{padding:0 8px}
#bar select option,#panel select option{background:#151827;color:var(--fg)}
#bar svg{width:18px;height:18px;fill:currentColor}
#bar :focus-visible,#panel :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#vol{width:84px;accent-color:var(--focus);cursor:pointer}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(390px,calc(100vw - 32px));
  max-height:calc(100% - 110px);overflow-y:auto;overscroll-behavior:contain;
  box-sizing:border-box;padding:8px 14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px}
#panel[hidden]{display:none}
#panel h3{margin:13px 0 3px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
#panel h3:first-child{margin-top:4px}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}
#panel .row span{color:var(--fg)}
#panel select{height:32px;max-width:215px}
#panel input[type=checkbox]{width:18px;height:18px;accent-color:var(--focus)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chips button{height:30px;padding:0 11px;border-radius:999px}
#pinrow{margin:8px 0 2px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.5}
#pinrow b{color:var(--fg);font-weight:600}
.stats{color:var(--muted);font-size:12px;line-height:1.7;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
#panel .keys{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;color:var(--muted);font-size:12px;line-height:1.6}
#panel .keys b{color:var(--fg);font-weight:600;white-space:nowrap}
#panel .row.vol{display:none}
#vol2{width:150px;accent-color:var(--focus)}
#panel .ver{margin-top:6px;color:var(--muted);font-size:11px;text-align:right}
@media (max-width:560px){ #vol{display:none} #panel .row.vol{display:flex} }
@media (max-width:440px){ #bar button{width:34px} #bar{gap:4px;padding:6px 7px} #bar select{max-width:96px;padding:0 4px} }
@media (max-width:350px){ #bar button{width:30px} #bar select{max-width:80px} }
</style>
</head>

<script>
"use strict";
/* ふえる玉 v2 — 刃が寄る → 締める（玉が白く光る）→ はじける → 出口からかたまりで飛び出す。
   円がいっぱいになっても重なりながら増えつづけ、最後は割れて、また 1 個から。 */
const VERSION = "2.0.0";
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;

/* ── 乱数（?seed= で固定できる。玉の動きにはこれだけを使う。絵の飾りと音は Math.random） ── */
let seed = (parseInt(Q.get("seed"), 10) | 0) || ((Math.random() * 2147483647) | 0);
function rnd(){
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const pick = a => a[(rnd() * a.length) | 0];
function wpick(list){ let s = 0; for (const x of list) s += x[1]; let v = rnd() * s; for (const x of list){ if ((v -= x[1]) < 0) return x[0]; } return list[list.length - 1][0]; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = (rnd() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

const tri = u => 2 / Math.PI * Math.asin(Math.sin(TAU * u));         // ギザギザ用の三角の波（-1〜1）

function addBall(x, y, vx, vy, c, imm, sc){

/* 消す（その場では空きにしておき、こまの終わりにまとめて詰める） */
function kill(i){

/* 穴から外へ出た（数からは外すが、消えるまでは飛んでいるのを描く） */

/* ── 近くの玉を探すための升目（升目の大きさ＝当たりの直径。混んで当たりが縮むと、升目も細かくする） ── */
let GW = 1, GHt = 1, G0 = -R, GINV = 1, GCELL = 1, D2MAX = 1;
const CST = new Int32Array(MAXC + 2), CUR = new Int32Array(MAXC + 1);
const ITEM = new Int32Array(MAXN), BC = new Int32Array(MAXN);
function gridFit(){
  let cell = Math.max(2 * RC * 1.05, 2.2);
  const half = R + 4 * rad + 8;
  let g = Math.ceil(2 * half / cell);
  if (g * g > MAXC){ g = Math.floor(Math.sqrt(MAXC)); cell = 2 * half / g; }
  GCELL = cell; GINV = 1 / cell; G0 = -half; GW = GHt = g;
}
function buildGrid(){
  const nc = GW * GHt, g0 = G0, gi = GINV, gw = GW;
  CST.fill(0, 0, nc + 1);
  for (let i = 0; i < M; i++){
    if (ST[i] & 7){ BC[i] = -1; continue; }           // 消えた・挟まれた・出ていく玉は、ほかの玉に当たらない
    const x = X[i], y = Y[i];
    if (x < g0 || y < g0){ BC[i] = -1; continue; }
    const cx = ((x - g0) * gi) | 0, cy = ((y - g0) * gi) | 0;
    if (cx >= gw || cy >= gw){ BC[i] = -1; continue; }
    const c = cy * gw + cx; BC[i] = c; CST[c + 1]++;
  }
  for (let c = 0; c < nc; c++) CST[c + 1] += CST[c];
  CUR.set(CST.subarray(0, nc));
  for (let i = 0; i < M; i++){ const c = BC[i]; if (c >= 0) ITEM[CUR[c]++] = i; }

/* ── 音を鳴らすぶつかりの記録（1 こまぶん） ── */
let hitN = 0, hitV = 0, hitX = 0, clinkN = 0, clinkV = 0, clinkX = 0;
function hit(v, x){ hitN++; if (v > hitV){ hitV = v; hitX = x; } }
function clink(v, x){ clinkN++; if (v > clinkV){ clinkV = v; clinkX = x; } }

/* ── 玉どうし（重なりを押し戻し、近づいていればはね返す） ── */
function pair(i, j){
  const dx = X[j] - X[i], dy = Y[j] - Y[i], d2 = dx * dx + dy * dy;
  if (d2 >= D2MAX) return;
  const D = (SC[i] + SC[j]) * RC;
  if (d2 >= D * D) return;
  let nx, ny, pen;
  if (d2 < 1e-8){ const a = (i * 12.9898 + j * 78.233 + STAMP) % TAU; nx = Math.cos(a); ny = Math.sin(a); pen = D; }
  else { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = D - d; }
  const p = pen * .5 * STIFF;
  X[i] -= nx * p; Y[i] -= ny * p; X[j] += nx * p; Y[j] += ny * p;
  const vn = (VX[j] - VX[i]) * nx + (VY[j] - VY[i]) * ny;
  if (vn < 0){
    const q = -(1 + E_BB) * vn * .5;
    VX[i] -= q * nx; VY[i] -= q * ny; VX[j] += q * nx; VY[j] += q * ny;
    if (-vn > HIT_MIN) hit(-vn, X[i]);
  }
}
function pairCell(i, m){
  const s = CST[m], e = CST[m + 1], n = e - s;
  if (!n) return;
  if (n <= CELL_MAX){ for (let b = s; b < e; b++) pair(i, ITEM[b]); return; }
  const st = Math.ceil(n / CELL_MAX);                                  // 詰まりすぎた升目は間引く（重くならないように）
  for (let b = s + (STAMP + i) % st; b < e; b += st) pair(i, ITEM[b]);
}
function collideBalls(){
  const gw = GW, gh = GHt;
  const half = N > 50000 ? 1 : 0;        // 玉がとても多いときは、升目を市松もようにして 1 歩おきに調べる（重さを半分に）
  for (let cy = 0; cy < gh; cy++){
    const row = cy * gw, down = cy + 1 < gh;
    for (let cx = (cy + STAMP) & half; cx < gw; cx += 1 + half){
      const c = row + cx, s0 = CST[c], e0 = CST[c + 1], n = e0 - s0;
      if (!n) continue;
      const st = n > CELL_MAX ? Math.ceil(n / CELL_MAX) : 1;
      if (n > CELL_SOLO){
        for (let a = s0; a < e0; a++){ const i = ITEM[a]; for (let b = a + 1 + (STAMP + a) % st; b < e0; b += st) pair(i, ITEM[b]); }
        continue;
      }
      const right = cx + 1 < gw, left = cx > 0;
      for (let a = s0; a < e0; a++){
        const i = ITEM[a];
        for (let b = a + 1; b < e0; b += st) pair(i, ITEM[b]);
        if (right) pairCell(i, c + 1);
        if (down){
          if (left) pairCell(i, c + gw - 1);
          pairCell(i, c + gw);
          if (right) pairCell(i, c + gw + 1);
        }
      }
    }
  }
}

/* ── 刃（太さのある線分の集まり）。1 本 12 個:
      今の両端(0-3)・太さ(4)・ひとつ前の両端(5-8)・種類(9: 0 押すだけ / 1 刃 / 2 消し刃)・組(10)・刃の番号(11) ── */
const SS = 12;
const SEG = new Float32Array(400 * SS);
let NSEG = 0;
function setSeg(k, ax, ay, bx, by, w, kind, grp, unit){
  const o = k * SS;
  SEG[o] = ax; SEG[o + 1] = ay; SEG[o + 2] = bx; SEG[o + 3] = by; SEG[o + 4] = w; SEG[o + 9] = kind; SEG[o + 10] = grp; SEG[o + 11] = unit;
}
/* 刃に触れた向きを覚え、別の組の刃からも逆向きに押されたら「挟まれた」 */
function contact(i, nx, ny, pen, grp, unit, kind){
  if (CS[i] !== STAMP){ CS[i] = STAMP; CNX[i] = nx; CNY[i] = ny; CNP[i] = pen; CG[i] = grp; CU[i] = unit; CK[i] = kind; return; }
  if (grp !== CG[i] && nx * CNX[i] + ny * CNY[i] < PINCH_DOT && pen + CNP[i] > PINCH_PEN * RV * SC[i]) pinch(i, kind, CK[i]);
  if (pen > CNP[i]){ CNX[i] = nx; CNY[i] = ny; CNP[i] = pen; CG[i] = grp; CU[i] = unit; CK[i] = kind; }
}
function pinch(i, k1, k2){
  if (ST[i] & 2) return;
  const ph = RD.phase;
  if (IMM[i] > T || (ph !== "grow" && ph !== "burst" && ph !== "clear")){   // 守られている玉は、刃の下をすり抜ける
    GHO[i] = T + .45; STAT.ghost++; return;
  }

  ST[i] |= 2; doomedN++; DT[i] = T; HEAT[i] = 1; VX[i] = 0; VY[i] = 0;
  EXI[i] = rig.exitFor(X[i], Y[i]);
  const reds = (k1 === 2 ? 1 : 0) + (k2 === 2 ? 1 : 0);
  if (reds === 2 || (reds === 1 && rnd() < .5)) ST[i] |= 8;             // 消し刃に挟まれた（ふつうの刃と半々なら、半分の確率で）
}
function collideMech(h){

    const pax = SEG[o + 5], pay = SEG[o + 6], pbx = SEG[o + 7], pby = SEG[o + 8];
    const kind = SEG[o + 9], grp = SEG[o + 10], unit = SEG[o + 11];

    const ccd = L2 > 1, L = Math.sqrt(L2), lnx = -aby / L, lny = abx / L;
    const pabx = pbx - pax, paby = pby - pay, PLn = Math.hypot(pabx, paby) || 1, plx = -paby / PLn, ply = pabx / PLn;
    const x0 = Math.min(ax, bx, pax, pbx) - mdm, x1 = Math.max(ax, bx, pax, pbx) + mdm;
    const y0 = Math.min(ay, by, pay, pby) - mdm, y1 = Math.max(ay, by, pay, pby) + mdm;
    const cx0 = Math.max(0, Math.floor((x0 - g0) * gi)), cx1 = Math.min(gw - 1, Math.floor((x1 - g0) * gi));
    const cy0 = Math.max(0, Math.floor((y0 - g0) * gi)), cy1 = Math.min(gh - 1, Math.floor((y1 - g0) * gi));
    for (let cy = cy0; cy <= cy1; cy++){
      for (let cx = cx0; cx <= cx1; cx++){
        const c = cy * gw + cx;
        for (let k = CST[c], e = CST[c + 1]; k < e; k++){
          const i = ITEM[k];
          if (GHO[i] > T || (ST[i] & 3)) continue;
          const md = w + RV * SC[i], md2 = md * md;
          let px = X[i], py = Y[i], moved = false;
          let t = ((px - ax) * abx + (py - ay) * aby) / L2;
          if (ccd && t > 0 && t < 1){
            // 速い刃が玉を飛び越えたら、もとの側へ戻す
            const sc = (px - ax) * lnx + (py - ay) * lny, sp = (PX[i] - pax) * plx + (PY[i] - pay) * ply;
            if (sc * sp < 0 && Math.abs(sp) > w * .3){
              const want = sp > 0 ? md * 1.001 : -md * 1.001;
              px += lnx * (want - sc); py += lny * (want - sc); moved = true;
            }
          }
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = ax + abx * t, qy = ay + aby * t, dx = px - qx, dy = py - qy, d2 = dx * dx + dy * dy;
          const svx = (qx - (pax + (pbx - pax) * t)) * inv, svy = (qy - (pay + (pby - pay) * t)) * inv;
          if (d2 >= md2){
            if (moved){
              X[i] = px; Y[i] = py;
              const sg = (px - ax) * lnx + (py - ay) * lny > 0 ? 1 : -1, nx = lnx * sg, ny = lny * sg;
              const vn = (VX[i] - svx) * nx + (VY[i] - svy) * ny;
              if (vn < 0){ VX[i] -= (1 + E_M) * vn * nx; VY[i] -= (1 + E_M) * vn * ny; }
              if (kind > 0) contact(i, nx, ny, 0, grp, unit, kind);
            }
            continue;
          }
          let nx, ny;
          const d = Math.sqrt(d2);
          if (d < 1e-6){
            nx = lnx; ny = lny;
            if (nx * svx + ny * svy < 0){ nx = -nx; ny = -ny; }
          } else { nx = dx / d; ny = dy / d; }
          const pen = md - d;
          X[i] = px + nx * pen; Y[i] = py + ny * pen;
          const vn = (VX[i] - svx) * nx + (VY[i] - svy) * ny;
          if (vn < 0){
            const tx = (VX[i] - svx) - vn * nx, ty = (VY[i] - svy) - vn * ny;
            VX[i] -= (1 + E_M) * vn * nx + MU * tx; VY[i] -= (1 + E_M) * vn * ny + MU * ty;
            if (-vn > HIT_MIN) clink(-vn, px);
          }
          if (kind > 0) contact(i, nx, ny, pen, grp, unit, kind);
        }
      }
    }
  }
}

/* ── 円のふち。穴（すき間）では押し返さず、外へ出た玉は数から外れる ── */
let GAPS = null;          // 穴: [{a: 真ん中の角度, hw: 半分の幅（角度）}]
function collideWall(){
  const gaps = GAPS, RR = R * R, out2 = (R + OUT_D) ** 2;
  for (let i = 0; i < M; i++){
    const st = ST[i];
    if (st & 1) continue;
    const x = X[i], y = Y[i], d2 = x * x + y * y;
    if (st & 4){ if (d2 > out2) kill(i); continue; }
    const lim = R - RV * SC[i];
    if (d2 <= lim * lim) continue;
    if (gaps){
      const a = Math.atan2(y, x), slack = RV * SC[i] / R * .6;
      let open = false;
      for (let g = 0; g < gaps.length; g++){
        const hw = gaps[g].hw;
        if (hw > .001 && Math.abs(wrapPi(a - gaps[g].a)) < hw - slack){ open = true; break; }
      }
      if (open){ if (d2 > RR) escapeBall(i); continue; }
    }
    const d = Math.sqrt(d2), nx = -x / d, ny = -y / d, pen = d - lim;
    X[i] = x + nx * pen; Y[i] = y + ny * pen;
    const vn = VX[i] * nx + VY[i] * ny;
    if (vn < 0){
      let vx = VX[i] - (1 + E_W) * vn * nx, vy = VY[i] - (1 + E_W) * vn * ny;
      // はね返るたびに、少しだけ真ん中のほうへ向きを寄せる
      // （まん丸の器では、ふち寄りを回る玉はいつまでも真ん中へ来ない。仕掛けに近寄らない玉をなくすため）
      const sp = Math.sqrt(vx * vx + vy * vy), vin = vx * nx + vy * ny;
      if (sp > 1 && vin < .97 * sp){
        const tx = vx - vin * nx, ty = vy - vin * ny, tl = Math.sqrt(tx * tx + ty * ty) || 1;
        let sn = vin / sp; sn += (1 - sn) * (.1 + .4 * rnd());
        const cs = Math.sqrt(1 - sn * sn);
        vx = (nx * sn + tx / tl * cs) * sp; vy = (ny * sn + ty / tl * cs) * sp;
      }
      VX[i] = vx; VY[i] = vy;
      if (-vn > HIT_MIN) clink(-vn * .6, x);
    }
  }
}
/* 穴のふちの小さな柱（玉がふちに引っかからないように）。仕掛けの刃のうしろに足す */
function extraSegs(){
  let k = rig.n;
  if (GAPS) for (const g of GAPS){
    if (g.hw <= .001) continue;
    for (let sg = -1; sg <= 1; sg += 2){
      const a = g.a + sg * g.hw, x = Math.cos(a) * R, y = Math.sin(a) * R, o = k * SS;
      SEG[o] = SEG[o + 2] = SEG[o + 5] = SEG[o + 7] = x; SEG[o + 1] = SEG[o + 3] = SEG[o + 6] = SEG[o + 8] = y;
      SEG[o + 4] = 4; SEG[o + 9] = 0; SEG[o + 10] = -1; SEG[o + 11] = 255; k++;
    }
  }
  NSEG = k;
}

/* ── 挟まれた玉は、はじけるまで白いかたまりになって集まる ── */
const LUMP = { x: 0, y: 0 };
function doomedPass(h){
  const gather = Math.min(1, 10 * h), spread = RV * .55 * Math.sqrt(Math.max(1, doomedN));
  for (let i = 0; i < M; i++){
    if ((ST[i] & 3) !== 2) continue;
    if (T - DT[i] > 1.4){ splitOne(i); continue; }     // はじける合図が来なかった玉は、その場で分かれる
    if (SC[i] > .62) SC[i] = Math.max(.62, SC[i] - 1.4 * h);
    if (rig.lump(EXI[i], LUMP)){
      const dx = LUMP.x - X[i], dy = LUMP.y - Y[i], d = Math.hypot(dx, dy), keep = Math.min(spread, 60);
      if (d > keep){ const f = (d - keep) / d * gather; X[i] += dx * f; Y[i] += dy * f; }
    }
  }
}

/* ── こまごとの手入れ ── */
/* 生まれたての玉をふくらませる（生まれた順に並んでいるので、うしろから見ていけば足りる） */
function growYoung(){
  for (let i = M - 1; i >= 0; i--){
    const age = T - BORN[i];
    if (age >= GROW_T){
      if (age > GROW_T + .25) break;
      if (SC[i] < 1 && !(ST[i] & 19)) SC[i] = 1;
      continue;
    }
    if (ST[i] & 19) continue;
    SC[i] = SC0 + (1 - SC0) * EZ.outC(age / GROW_T);
  }
}
/* 速さをふだんの速さに寄せる（混むほど、ゆっくりに。玉ごとにせっかちさが違う） */
function governor(dt){
  const fill = N * RC * RC / ((R - RV) * (R - RV));
  const vt = V0 * (1 - .68 * smooth(.3, .72, fill));
  const kk = 1 - Math.exp(-dt * 1.5);
  const still = RD.still;
  for (let i = 0; i < M; i++){
    if (ST[i] & 7) continue;
    const vx = VX[i], vy = VY[i], s = Math.sqrt(vx * vx + vy * vy);
    if (X[i] !== X[i] || Y[i] !== Y[i] || s !== s){ kill(i); continue; }   // 万一の壊れた値は捨てる
    const want = vt * TMP[i];
    if (!(s > 1e-3)){
      if (still) continue;
      const a = rnd() * TAU; VX[i] = Math.cos(a) * want * .5; VY[i] = Math.sin(a) * want * .5; continue;
    }
    const f = (s + (want - s) * kk) / s;
    VX[i] = vx * f; VY[i] = vy * f;
  }
  return fill;
}
/* 混んでいるのに空いた所が残らないよう、混んだ所から空いた所へ玉を流す。
   当たりの大きさを縮めただけでは、玉は詰まったままでいられるので、刃が通ったあとに黒いすき間が残る。
   粗い升目で混み具合を見て、差の大きい所だけ、空いたほうへ少しずつ動かす（円がいっぱいに近いときだけ） */
const SGMAX = 40;
const SDN = new Float32Array(SGMAX * SGMAX), SDB = new Float32Array(SGMAX * SGMAX), SFR = new Float32Array(SGMAX * SGMAX);
const SGX = new Float32Array(SGMAX * SGMAX), SGY = new Float32Array(SGMAX * SGMAX);       // 升目ごとの、流す向きと速さ
let sfrG = 0;
function spread(dt){
  const lim = R - RV, fillC = N * RC * RC / (lim * lim);
  if (N < 300 || fillC < .5) return;
  const g = clamp(Math.floor(2 * R / (5 * RC)), 8, SGMAX), cs = 2 * R / g, inv = 1 / cs, unit = Math.PI * RC * RC / (cs * cs);
  if (sfrG !== g){                                       // 升目ごとの「円の中に入っている割合」
    sfrG = g;
    for (let cy = 0; cy < g; cy++) for (let cx = 0; cx < g; cx++){
      let n = 0;
      for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++){ const x = -R + (cx + (a + .5) / 4) * cs, y = -R + (cy + (b + .5) / 4) * cs; if (x * x + y * y < lim * lim) n++; }
      SFR[cy * g + cx] = n / 16;
    }
  }
  const nc = g * g;
  SDN.fill(0, 0, nc);
  for (let i = 0; i < M; i++){
    if (ST[i] & 7) continue;
    const cx = ((X[i] + R) * inv) | 0, cy = ((Y[i] + R) * inv) | 0;
    if (cx < 0 || cy < 0 || cx >= g || cy >= g) continue;
    SDN[cy * g + cx] += SC[i] * SC[i];
  }
  for (let c = 0; c < nc; c++){ const f = SFR[c]; SDN[c] = f > .2 ? SDN[c] * unit / f : fillC; }      // ふちの外は「ふつうの混み具合」と見なす（ふちへ押しつけない）
  for (let cy = 0; cy < g; cy++) for (let cx = 0; cx < g; cx++){                                    // 3×3 でならす
    const x0 = cx > 0 ? cx - 1 : cx, x1 = cx < g - 1 ? cx + 1 : cx, y0 = cy > 0 ? cy - 1 : cy, y1 = cy < g - 1 ? cy + 1 : cy;
    SDB[cy * g + cx] = (SDN[y0 * g + x0] + 2 * SDN[y0 * g + cx] + SDN[y0 * g + x1] + 2 * SDN[cy * g + x0] + 4 * SDN[cy * g + cx] + 2 * SDN[cy * g + x1]
                      + SDN[y1 * g + x0] + 2 * SDN[y1 * g + cx] + SDN[y1 * g + x1]) / 16;
  }
  // 流す速さは 1 こまで 10 まで（刃の太さより小さく。刃をすり抜けない）。玉が少ない升目は数のばらつきが大きいので、差が小さいうちは動かさない
  const k = smooth(.5, .7, fillC), vmax = Math.min(700 * dt, 10), dead = clamp(Math.sqrt(unit / PHI_C), .08, .2);
  SGX.fill(0, 0, nc); SGY.fill(0, 0, nc);
  for (let cy = 1; cy < g - 1; cy++) for (let cx = 1; cx < g - 1; cx++){
    const c = cy * g + cx, gx = SDB[c + 1] - SDB[c - 1], gy = SDB[c + g] - SDB[c - g], m = Math.sqrt(gx * gx + gy * gy) * .5;
    if (m < dead) continue;
    const v = Math.min(vmax, 1500 * (m - dead) * dt) * k / (2 * m);
    SGX[c] = -gx * v; SGY[c] = -gy * v;
  }
  // 玉ごとに、まわり 4 つの升目の値をなめらかにつないで使う（升目の境目で向きが急に変わると、玉の並びに升目のあとが出る）
  const gm = g - 1.001;
  for (let i = 0; i < M; i++){
    if (ST[i] & 7) continue;
    const fx = (X[i] + R) * inv - .5, fy = (Y[i] + R) * inv - .5;
    if (fx < 0 || fy < 0 || fx > gm || fy > gm) continue;
    const cx = fx | 0, cy = fy | 0, u = fx - cx, w = fy - cy, c = cy * g + cx;
    const a00 = (1 - u) * (1 - w), a10 = u * (1 - w), a01 = (1 - u) * w, a11 = u * w;
    X[i] += SGX[c] * a00 + SGX[c + 1] * a10 + SGX[c + g] * a01 + SGX[c + g + 1] * a11;
    Y[i] += SGY[c] * a00 + SGY[c + 1] * a10 + SGY[c + g] * a01 + SGY[c + g + 1] * a11;
  }
}
/* 混んできたら、玉どうしの当たりの大きさを数に合わせて縮める（詰め具合を保つ → 重なって見える） */
function updateRadius(dt){
  CAPC = PHI_C * AFREE / (Math.PI * rad * rad);
  const want = rad * Math.min(1, Math.sqrt(CAPC / Math.max(1, N)));
  RC += (want - RC) * (1 - Math.exp(-dt / .25));
  RV = rad * Math.pow(RC / rad, GAMMA);
  D2MAX = 4 * RC * RC;
  if (2 * RC > GCELL || 2 * RC * 1.16 < GCELL) gridFit();
}
/* 囲まれた玉を、締まり具合に合わせて白く光らせる（外へ出たら冷める） */
const ZB = [0, 0, 0, 0];
function heatPass(dt){
  const dk = Math.exp(-dt / .12);
  for (let i = 0; i < M; i++){ if (HEAT[i] > .004 && !(ST[i] & 2)) HEAT[i] *= dk; }
  if (!rig.box(ZB)) return;
  const cx0 = Math.max(0, Math.floor((ZB[0] - G0) * GINV)), cx1 = Math.min(GW - 1, Math.floor((ZB[2] - G0) * GINV));
  const cy0 = Math.max(0, Math.floor((ZB[1] - G0) * GINV)), cy1 = Math.min(GHt - 1, Math.floor((ZB[3] - G0) * GINV));
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++){
    const c = cy * GW + cx;
    for (let k = CST[c], e = CST[c + 1]; k < e; k++){
      const i = ITEM[k];
      if (i >= M || (ST[i] & 7) || IMM[i] > T) continue;
      const q = rig.heat(X[i], Y[i]);
      if (q > HEAT[i]) HEAT[i] = q;
    }
  }
}

/* ── 1 こまの中の細かい 1 歩 ── */
const HS_Q = { "0": 1 / 120, "1": 1 / 180, "2": 1 / 240 };
let HS = HS_Q[SET.quality] || 1 / 180;
function substep(h){
  STAMP++;
  const vm2 = VMAX * VMAX;
  for (let i = 0; i < M; i++){
    const st = ST[i];
    if (st & 3) continue;
    let vx = VX[i], vy = VY[i];
    const s2 = vx * vx + vy * vy;
    if (s2 > vm2){ const f = Math.sqrt(vm2 / s2); vx *= f; vy *= f; VX[i] = vx; VY[i] = vy; }
    PX[i] = X[i]; PY[i] = Y[i]; X[i] += vx * h; Y[i] += vy * h;
  }
  if (RD.phase === "gold") rig.keep(); else rig.step(h);      // 金色のあいだは仕掛けを止める
  extraSegs();
  buildGrid();
  collideBalls();
  collideMech(h);
  if (wallOn) collideWall();
  if (FOE && FOE.substep) FOE.substep(h);
  if (impactDue) doImpact();
  else if (doomedN && rig.closed) splitAll();          // 閉じたままの刃に、あとから挟まれた玉も、すぐ分かれる
  if (doomedN) doomedPass(h);
  T += h;
}

/* ══════════════════════════════════════════════════════════════════
   仕掛け（刃の集まりと、その動き）
   どの仕掛けも同じ合図を出す:
     close  … 刃が寄りはじめた（生まれる玉の色を次へ）
     seal   … 囲いこんだ（ここから中の玉が白く光る）
     lock   … 音だけ
     impact … 閉じきった（挟まれた玉がいっせいに分かれる）
   ══════════════════════════════════════════════════════════════════ */
const SHAPE_NAMES = { bar: "まっすぐ", arc: "弧", saw: "ギザギザ", chev: "くの字" };

/* 動きの段取り（いくつかの数を、段ごとに行き先・時間・動き方で動かす。待ちの段は、玉が来るまでのばせる） */
class Phases {
  constructor(vals, gen){
    this.v = Object.assign({}, vals); this.from = Object.assign({}, vals); this.gen = gen;
    this.list = null; this.k = 0; this.t = 0; this.cyc = 0; this.held = 0; this.name = "";
  }
  begin(){ const s = this.list[this.k]; this.name = s.n || ""; if (s.enter) s.enter(); }
  update(dt){
    let rem = dt, guard = 0;
    while (rem > 1e-9 && guard++ < 40){
      if (!this.list || this.k >= this.list.length){
        this.list = this.gen(this.cyc++); this.k = 0; this.t = 0; this.held = 0;
        Object.assign(this.from, this.v); this.begin();
      }
      const s = this.list[this.k];
      if (this.t >= s.d){
        if (s.hold && this.held < (s.maxHold || 0) && s.hold()){ this.held += rem; return; }   // 待ちをのばす
        if (s.to) for (const key in s.to) this.v[key] = s.to[key];
        Object.assign(this.from, this.v);
        this.t = 0; this.k++; this.held = 0;
        if (s.exit) s.exit();
        if (this.k < this.list.length) this.begin();
        continue;
      }
      const step = Math.min(rem, s.d - this.t);
      this.t += step; rem -= step;
      if (s.to){
        const u = Math.min(1, this.t / s.d), f = s.e ? s.e(u) : u;
        for (const key in s.to) this.v[key] = this.from[key] + (s.to[key] - this.from[key]) * f;
      }
    }
  }
}

const RED = { on: false, set: new Set() };      // 消し刃（赤い刃の番号）
const ASSIST = [1, .5, 0];                       // ケンカ中に、仕掛けが玉を待つ長さ（減るものの強さ: 弱い・ふつう・強い）
let SMART = Q.get("smart") !== "0";              // 玉が少ないうちは、玉が来るまで待ってから閉じる
class Rig {
  constructor(){ this.n = 0; this.ang = 0; this.spin = 0; this.area = 0; this.cycle = 2; this.units = 0; this.redK = null; this.q = 0; this.nex = 0; this.closed = false; this.live = true;
                 this.up = false; this.upK = 0; }     // up: 刃が浮いている（玉に当たらない）
  keep(){ for (let k = 0; k < this.n; k++){ const o = k * SS; SEG[o + 5] = SEG[o]; SEG[o + 6] = SEG[o + 1]; SEG[o + 7] = SEG[o + 2]; SEG[o + 8] = SEG[o + 3]; } }
  install(){ this.redK = new Float32Array(Math.max(1, this.units)); this.geom(); this.keep(); NSEG = this.n; }
  step(dt){
    this.keep(); this.advance(dt); this.geom();
    for (let u = 0; u < this.units; u++){                 // 赤くなる・戻るのは、じわっと
      const want = RED.on && RED.set.has(u) ? 1 : 0, k = this.redK[u];
      if (k !== want) this.redK[u] = want > k ? Math.min(1, k + dt / .7) : Math.max(0, k - dt / .5);
    }
  }
  kindOf(u){ return RED.on && RED.set.has(u) && this.redK[u] > .6 ? 2 : 1; }
  /* 待ち時間の倍率。玉が増えるほど短くして、テンポを上げていく */
  wk(){ return 1 - .75 * smooth(40, 400, N); }
  /* 玉がひとつも来そうにないなら待つ（玉が少ないうちだけ）。
     減るものとケンカしている間は、相手が強いほど待たない（待ってばかりいると、玉がいつまでも減らない） */
  patience(){ return RD.foeOn && !RD.foeDone ? ASSIST[RD.foeLv - 1] : 1; }
  noPrey(tau){ return SMART && RD.phase === "grow" && N < 60 && this.ph.held < 2.6 * this.patience() && this.prey(tau) === 0; }
  motion(){ return 0; }
  drawBack(){}
  snd(){ return "cross"; }
  /* 囲いに挟まれた大きなもの（食べる玉）の置き場所 o.x, o.y・つぶれる向き o.ax, o.ay（0 なら丸のまま縮む）・すき間の半分 o.half */
  vise(e, x, y, o){ o.x = x; o.y = y; o.ax = 0; o.ay = 0; o.half = 1e9; }
  /* (x, y) からいちばん近い「次に囲いこまれる所」 */
  bait(x, y, o){ o.x = 0; o.y = 0; }
}

/* ── 寄せ刃: N 枚の刃がまわりから真ん中へ寄ってきて、間の玉をつぶす（2 枚＝プレス、4 枚＝十字） ── */
class Yose extends Rig {
  constructor(NB, shape){
    super();
    this.key = "yose"; this.NB = NB; this.shape = shape; this.units = NB; this.nex = NB === 2 ? 0 : NB;
    const tb = this.tb = NB === 2 ? 11 : 10; this.rw = 7;
    let L, dOpen, dLock = 0;
    if (NB === 2){ L = 318; dOpen = 262; }
    else {
      // 3 枚以上: 開いているあいだ、刃は円の外にいる（刃のうしろに玉がたまると、中へ来なくなるため）。
      // 外から寄ってきて、円の半径の 4 割の所で角がふさがり（多角形になり）、そこからゆっくり締まる
      dLock = 205; dOpen = R + tb + 8;
      L = (dLock + tb + 3) * Math.tan(Math.PI / NB);
    }
    this.L = L; this.dOpen = dOpen; this.dLock = dLock;
    // 刃の形（刃の上の点。x は刃に沿って、y は真ん中へ向かう向き）
    const lp = [];
    if (shape === "arc"){
      const sag = L * (NB === 2 ? .18 : .2);        // 端が真ん中のほうへ反る量
      for (let j = 0; j <= 8; j++){ const u = -1 + 2 * j / 8; lp.push(u * L, sag * u * u); }
    } else if (shape === "chev"){
      const hh = L * .2; lp.push(-L, hh, 0, 0, L, hh);
    } else if (shape === "saw"){
      // 2 枚のときは上下の刃がかみ合う形。3 枚以上は、真ん中だけ平らにして、その外にギザギザ
      // （真ん中までギザギザだと、歯の谷に玉が隠れて挟まれない）
      const P = NB === 2 ? 64 : 46, A = P * .42, q = P / 4, K = Math.floor((L - 1) / q);
      this.sawA = A; this.sawP = P;
      const w0 = NB === 2 ? 0 : Math.min(L * .5, 1.8 * rad + 8);
      const f = x => NB === 2 ? tri(x / P) * A / 2 : (Math.abs(x) <= w0 ? A / 2 : tri((Math.abs(x) - w0) / P + .25) * A / 2);
      lp.push(-L, f(-L));
      for (let j = -K; j <= K; j++){ const x = j * q; if (NB > 2 && Math.abs(x) < w0) continue; lp.push(x, f(x)); }
      lp.push(L, f(L));
      if (NB > 2){                                   // 平らな所の両端を足して、並べ直す
        lp.push(-w0, A / 2, w0, A / 2);
        const pts = []; for (let j = 0; j < lp.length; j += 2) pts.push([lp[j], lp[j + 1]]);
        pts.sort((a, b) => a[0] - b[0]); lp.length = 0;
        for (const p of pts){ if (lp.length && Math.abs(lp[lp.length - 2] - p[0]) < .5) continue; lp.push(p[0], p[1]); }
      }
    } else lp.push(-L, 0, L, 0);
    this.lp = lp; this.np = lp.length / 2;
    this.n = NB === 2 ? NB * this.np : NB * (this.np - 1);   // 1 枚につき、刃のかけら (np-1) 本。2 枚（プレス）は押し棒も当たる
    this.wp = new Float32Array(NB * this.np * 2);
    this.ang = NB === 2 ? pick([0, Math.PI / 2]) + (rnd() < .3 ? rr(-.35, .35) : 0) : rr(0, TAU / NB);
    this.spin = rnd() < (NB === 2 ? .25 : .4) ? pick([1, -1]) * rr(.05, .2) : 0;
    const tp = this.tp = rr(.9, 1.12);
    this.dCn = this.dC(); this.dHeat = this.dCn + Math.max(70, 5.5 * RV); this.sealed = false;
    const ev = rigEvent;
    if (NB === 2){
      // 動画のプレス: 待つ → 閉じる（ほぼ等速）→ すぐ開く
      this.cycle = 1.62 * tp;
      this.ph = new Phases({ d: dOpen }, c => {
        this.dCn = this.dC(); this.dHeat = this.dCn + Math.max(70, 5.5 * RV);
        return [
          { n: "wait", d: (c ? rr(.45, .7) * this.wk() : .7) * tp, hold: () => this.noPrey(.6 * tp), maxHold: 2.6 },
          { n: "close", d: .6 * tp, to: { d: this.dCn }, e: EZ.press, enter: () => ev("close"), exit: () => ev("impact") },
          { n: "hold", d: .09 * tp },
          { n: "open", d: .34 * tp, to: { d: dOpen }, e: EZ.outC },
        ];
      });
    } else {
      // 動画の 4 本の棒: 線路をすべって寄る → 閉じる → ゆっくり締める → 閉じたまま少し → 開く
      this.cycle = 2.2 * tp;
      this.ph = new Phases({ d: dOpen }, c => {
        this.dCn = this.dC();
        return [
          { n: "wait", d: (c ? rr(.3, .5) * this.wk() : .45) * tp, hold: () => this.noPrey(.5 * tp), maxHold: 2.6 },
          { n: "approach", d: .5 * tp, to: { d: dLock }, e: EZ.inOut, enter: () => { ev("close"); this.grab = this.grabAt(); this.up = this.d > this.grab; },
            exit: () => { this.up = false; ev("lock"); ev("seal"); } },
          { n: "pause", d: .07 * tp },
          { n: "squeeze", d: .62 * tp, to: { d: this.dCn }, e: EZ.inQ, exit: () => ev("impact") },
          { n: "hold", d: .2 * tp },
          { n: "open", d: .5 * tp, to: { d: dOpen }, e: EZ.outC },
        ];
      });
    }
    this.d = dOpen; this.dPrev = dOpen; this.vel = 0; this.grab = dOpen + 1;
    this.area = NB === 2 ? NB * ((2 * L + 2 * tb) * 2 * tb + 2 * this.rw * (R - dOpen)) : 0;   // 3 枚以上は、ふだん円の外にいる
  }
  /* 刃が降りて玉をつかまえはじめる距離。玉が少ないうちは円の外から全部かき集め、
     増えてきたら真ん中の近くだけにする（全部かき集めると、増え方が速すぎて、円の中がいつも空っぽに見える） */
  grabAt(){ const near = this.dLock * 1.45; return near + (this.dOpen + 1 - near) * (1 - smooth(60, 300, N)); }
  name(){ return "寄せ刃 " + this.NB + " 枚・" + SHAPE_NAMES[this.shape]; }
  snd(){ return this.NB === 2 ? "press" : "cross"; }
  start(){ return [0, 0]; }
  /* 閉じきったときの、真ん中から刃までの距離（玉の大きさに合わせる） */
  dC(){
    const g = this.tb + .8 * RV;
    if (this.shape !== "saw") return g;
    return this.NB === 2 ? g / Math.cos(Math.atan(2 * this.sawA / this.sawP)) : g + this.sawA / 2;
  }
  advance(dt){
    this.ph.update(dt);
    const d = this.ph.v.d, nm = this.ph.name;
    this.vel = Math.abs(d - this.dPrev) / dt; this.dPrev = d; this.d = d;
    this.ang += this.spin * dt; this.closed = nm === "hold"; this.live = nm !== "open" && nm !== "wait";
    if (this.NB === 2){
      if (nm === "close"){
        if (!this.sealed && d < this.dHeat){ this.sealed = true; rigEvent("seal"); }
        this.q = d < this.dHeat ? clamp(1 - (d - this.dCn) / (this.dHeat - this.dCn), 0, 1) : 0;
      } else if (nm === "hold") this.q = 1;
      else { this.q = 0; this.sealed = false; }
    } else {
      this.sealed = nm === "pause" || nm === "squeeze" || nm === "hold";
      this.q = nm === "squeeze" || nm === "pause" ? clamp((this.dLock - d) / (this.dLock - this.dCn), 0, 1) : nm === "hold" ? 1 : 0;
      if (nm === "approach"){ if (this.up && d <= this.grab) this.up = false; }
      else if (nm === "open" || nm === "wait") this.up = d > this.grab;         // 開くときも、同じ所で浮く（玉を外へ押しのけない）
      this.upK += ((this.up ? 1 : 0) - this.upK) * Math.min(1, dt * 16);
    }
  }
  motion(){ return this.vel / 1300; }
  geom(){
    const NB = this.NB, lp = this.lp, np = this.np, d = this.d, tb = this.tb, wp = this.wp;
    let k = 0;
    for (let i = 0; i < NB; i++){
      const th = this.ang + TAU * i / NB, ux = Math.cos(th), uy = Math.sin(th), cx = ux * d, cy = uy * d;
      for (let j = 0; j < np; j++){   // 刃に沿う向き (-uy, ux)、真ん中へ向かう向き (-ux, -uy)
        const x = lp[j * 2], y = lp[j * 2 + 1], o = (i * np + j) * 2;
        wp[o] = cx - uy * x - ux * y; wp[o + 1] = cy + ux * x - uy * y;
      }
      const kind = this.kindOf(i);
      for (let j = 0; j < np - 1; j++){ const o = (i * np + j) * 2; setSeg(k++, wp[o], wp[o + 1], wp[o + 2], wp[o + 3], tb, kind, i, i); }
      // 押し棒（刃の背中から円の外へ）。3 枚以上のときは絵だけ（動画の線路と同じ。玉の通り道をふさがない）
      if (NB === 2) setSeg(k++, cx + ux * tb, cy + uy * tb, ux * (R + 90), uy * (R + 90), this.rw, 0, -1, 255);
    }
  }
  inPoly(x, y, apo){
    const NB = this.NB;
    for (let i = 0; i < NB; i++){ const th = this.ang + TAU * i / NB; if (x * Math.cos(th) + y * Math.sin(th) > apo) return false; }
    return true;
  }
  /* 囲まれている所なら、締まり具合（0〜1）を返す */
  heat(x, y){
    if (this.q <= 0) return 0;
    if (this.NB === 2){
      const c = Math.cos(this.ang), s = Math.sin(this.ang), yn = x * c + y * s, xt = -x * s + y * c;
      return Math.abs(xt) < this.L + this.tb && Math.abs(yn) < this.d - this.tb + RV ? this.q * .8 : 0;
    }
    return this.inPoly(x, y, this.d - this.tb + RV * .5) ? this.q * .8 : 0;
  }
  box(o){
    if (this.q <= 0) return false;
    const r = this.NB === 2 ? this.L + this.tb : this.d / Math.cos(Math.PI / this.NB) + RV;
    o[0] = -r; o[1] = -r; o[2] = r; o[3] = r; return true;
  }
  /* 囲いの中か（食べる玉が挟まれるかどうかに使う。m は余裕） */
  contains(x, y, m){
    if (this.NB === 2){
      const c = Math.cos(this.ang), s = Math.sin(this.ang);
      return Math.abs(-x * s + y * c) < this.L * .92 + m && Math.abs(x * c + y * s) < this.d - this.tb + m;
    }
    return this.inPoly(x, y, Math.min(this.d, this.dLock) - this.tb + m);
  }
  vise(e, x, y, o){
    o.half = Math.max(2, this.d - this.tb);
    if (this.NB === 2){
      const c = Math.cos(this.ang), s = Math.sin(this.ang), xt = clamp(-x * s + y * c, -this.L * .85, this.L * .85);
      o.x = -s * xt; o.y = c * xt; o.ax = c; o.ay = s;
    } else { o.x = 0; o.y = 0; o.ax = 0; o.ay = 0; }
  }
  exitFor(x, y){
    if (this.NB === 2) return 0;
    const a = Math.atan2(y, x) - this.ang, w = TAU / this.NB;
    return ((Math.floor(a / w) % this.NB) + this.NB) % this.NB;
  }
  /* 出口（生まれた玉が出てくる所）。2 枚のときは、その場からすき間に沿って流れる */
  exitInfo(e, o){
    if (this.NB === 2){ o.mode = 0; o.tx = -Math.sin(this.ang); o.ty = Math.cos(this.ang); return; }
    const a = this.ang + TAU * (e + .5) / this.NB, se = (this.dCn + this.tb + 10) / Math.cos(Math.PI / this.NB);
    o.mode = 1; o.dx = Math.cos(a); o.dy = Math.sin(a); o.x = o.dx * se; o.y = o.dy * se;
  }
  lump(e, o){ if (this.NB === 2) return false; o.x = 0; o.y = 0; return true; }
  /* tau 秒後に閉じたとき、囲いの中にいそうな玉の数 */
  prey(tau){
    const NB = this.NB; let n = 0;
    if (NB === 2){
      const s = Math.sin(this.ang), c = Math.cos(this.ang), lim = this.L - 30 - RV;
      for (let i = 0; i < M; i++){
        if ((ST[i] & 7) || IMM[i] > T + tau) continue;
        const yn = X[i] * c + Y[i] * s;
        if (Math.abs(yn) > this.d - this.tb) continue;                       // 板のうしろにいる
        const xt = -(X[i] + VX[i] * tau) * s + (Y[i] + VY[i] * tau) * c;
        if (Math.abs(xt) < lim) n++;
      }
      return n;
    }
    const apo = this.dLock * 1.35, a0 = this.ang + this.spin * tau;                // 外から来る刃が玉を寄せ集めるので、少し広めに見る
    for (let i = 0; i < M; i++){
      if ((ST[i] & 7) || IMM[i] > T + tau + .5) continue;
      const x = X[i] + VX[i] * tau, y = Y[i] + VY[i] * tau;
      let inside = true;
      for (let b = 0; b < NB; b++){ const th = a0 + TAU * b / NB; if (x * Math.cos(th) + y * Math.sin(th) > apo){ inside = false; break; } }
      if (inside) n++;
    }
    return n;
  }
  drawBack(c){
    if (this.NB === 2) return;
    for (let i = 0; i < this.NB; i++){ const th = this.ang + TAU * i / this.NB; rail(c, 0, 0, Math.cos(th) * R * 2.4, Math.sin(th) * R * 2.4, 4); }
  }
  draw(c){
    const NB = this.NB, np = this.np, wp = this.wp, tb = this.tb;
    for (let i = 0; i < NB; i++){
      c.save(); c.rotate(this.ang + TAU * i / NB - Math.PI / 2);   // 押し棒と台は、下向きの形で描いて回す
      if (NB === 2){ rod(c, 0, R + 20, 0, this.d + tb, this.rw); mount(c, R + 6, -1); }
      else rod(c, 0, R * 2.4, 0, this.d + tb, 4);
      c.restore();
    }
    const ga = c.globalAlpha;
    c.globalAlpha = ga * (1 - .5 * this.upK);          // 浮いている刃は、うすく描く
    for (let i = 0; i < NB; i++){
      const red = this.redK[i];
      if (this.shape === "bar"){ const o = i * np * 2; bar(c, wp[o], wp[o + 1], wp[o + 2], wp[o + 3], tb, NB === 2, red); }
      else drawPoly(c, wp, i * np, np, tb, red);
    }
    c.globalAlpha = ga;
  }
}

/* ── 8 の字: 弧 N 本ずつの組が 2 つ、軸のまわりを逆向きに回り続ける。
      弧がそろうと輪になり、そのまま行き違ってレンズ形に細り、つぶれる（動画と同じ。往復しない） ── */
class Loops extends Rig {
  constructor(NL, shape){
    super();
    this.key = "loops"; this.NL = NL; this.shape = shape; this.units = 2 * NL;
    this.rho = (NL <= 3 ? 150 : NL === 4 ? 142 : 134) * (shape === "arc" ? 1 : 1.14); this.tb = 9; this.hub = 28; this.hm = 1;
    this.P = shape === "arc" ? 10 : 2;
    this.n = 2 * NL * this.P + 1;
    this.thc = shape === "arc" ? Math.PI / 2 : Math.atan(this.hm);       // 輪ができてから、つぶれきるまでに回る角度
    const Ts = [0, 0, 1.25, 1.35, 1.5, 1.6][NL] * rr(.92, 1.1);          // 輪ができる間隔（秒）
    this.stp = Math.PI / NL; this.om = this.stp / Ts; this.cycle = Ts;
    this.ang = rr(0, TAU); this.spin = rnd() < .35 ? pick([1, -1]) * rr(.04, .1) : 0;
    this.phi = Math.min(this.stp * .9, this.om * .95);                   // 最初は口が開いている（1 秒たらずで輪になる）
    this.lam = 1; this.slowT = 0; this.w = this.om;
    this.area = NL * 2 * (shape === "arc" ? Math.PI * this.rho : 2 * this.rho * Math.hypot(1, this.hm)) * 2 * this.tb + Math.PI * this.hub ** 2;
  }
  name(){ return "8 の字 " + this.NL + " つ・" + SHAPE_NAMES[this.shape]; }
  snd(){ return "loops"; }
  start(){ const g = this.ang + Math.PI * Math.floor(this.phi / this.stp) / this.NL; return [this.rho * Math.cos(g), this.rho * Math.sin(g)]; }
  advance(dt){
    const stp = this.stp, p0 = this.phi;
    // 玉が少ないうちは、輪の中に玉が来るまで、ゆっくり回って待つ
    let lam = 1;
    if (SMART && RD.phase === "grow" && N < 60){
      const th = p0 - Math.floor(p0 / stp) * stp;
      if (th < .75 && th > .05 && this.slowT < 3 * this.patience() && this.prey(th / this.om) === 0){ lam = .28; this.slowT += dt; }
    }
    this.lam += (lam - this.lam) * Math.min(1, dt * 8);
    this.w = this.om * this.lam;
    const p1 = p0 - this.w * dt;
    this.phi = p1;
    this.ang += this.spin * dt;
    // つぶれる（先に）→ 次の輪ができる
    if (Math.floor((p1 + this.thc) / stp) < Math.floor((p0 + this.thc) / stp)) rigEvent("impact");
    if (Math.floor(p1 / stp) < Math.floor(p0 / stp)){ this.slowT = 0; rigEvent("close"); rigEvent("lock"); rigEvent("seal"); }
    const s1 = Math.ceil((p1 + this.thc) / stp) - 1, th1 = p1 - s1 * stp;
    this.q = th1 < 0 ? clamp(-th1 / this.thc, 0, 1) : 0;
  }
  motion(){ return .12 + .1 * this.lam; }
  geom(){
    const NL = this.NL, P = this.P, rho = this.rho, tb = this.tb;
    let k = 0;
    for (let b = 0; b < 2; b++) for (let j = 0; j < NL; j++){
      const dir = this.ang + (b ? -this.phi : this.phi) + TAU * j / NL, dx = Math.cos(dir), dy = Math.sin(dir);
      const nx = b ? dy : -dy, ny = b ? -dx : dx, unit = b * NL + j, kind = this.kindOf(unit);   // 組 A は左へ、組 B は右へふくらむ
      let px = 0, py = 0;
      for (let q = 1; q <= P; q++){
        let x, y;
        if (P > 2){ const u = Math.PI * q / P, cu = Math.cos(u), su = Math.sin(u); x = rho * (dx - cu * dx + su * nx); y = rho * (dy - cu * dy + su * ny); }
        else if (q === 1){ x = rho * (dx + this.hm * nx); y = rho * (dy + this.hm * ny); }
        else { x = 2 * rho * dx; y = 2 * rho * dy; }
        setSeg(k++, px, py, x, y, tb, kind, b, unit); px = x; py = y;
      }
    }
    setSeg(k++, 0, 0, 0, 0, this.hub, 0, -1, 255);   // 真ん中の軸（押すだけ）
  }
  /* いま閉じている輪（レンズ）の中か。中なら締まり具合を返す */
  lens(x, y, m){
    const lim0 = 2 * this.rho + this.tb;
    if (x * x + y * y > lim0 * lim0) return 0;
    const NL = this.NL, stp = this.stp, rho = this.rho, lim = rho - this.tb * .5 + m, lim2 = lim * lim;
    const a = Math.atan2(y, x) - this.ang, w = TAU / NL;
    const s0 = Math.floor(this.phi / stp) + 1, s1 = Math.ceil((this.phi + this.thc) / stp) - 1;
    let best = 0;
    for (let s = s0; s <= s1; s++){
      const th = this.phi - s * stp;                                    // 0 より小さい（輪ができてから回った角度）
      const j = Math.round((a - Math.PI * s / NL) / w), g = this.ang + Math.PI * (2 * j + s) / NL;
      const ax = rho * Math.cos(g + th) - x, ay = rho * Math.sin(g + th) - y;
      if (ax * ax + ay * ay > lim2) continue;
      const bx = rho * Math.cos(g - th) - x, by = rho * Math.sin(g - th) - y;
      if (bx * bx + by * by > lim2) continue;
      const q = Math.max(.02, -th / this.thc);
      if (q > best) best = q;
    }
    return best;
  }
  heat(x, y){ return this.lens(x, y, RV * .3) * .8; }
  box(o){ const r = 2 * this.rho + this.tb; o[0] = -r; o[1] = -r; o[2] = r; o[3] = r; return true; }
  contains(x, y, m){ return this.lens(x, y, m) > 0; }
  vise(e, x, y, o){
    const NL = this.NL, p = e >= NL ? 1 : 0, g = this.ang + Math.PI * (2 * (e % NL) + p) / NL;
    this.lump(e, o);
    o.ax = -Math.sin(g); o.ay = Math.cos(g);
    o.half = Math.max(2, this.rho * (1 - Math.sin(this.q * Math.PI / 2)) - this.tb);
  }
  bait(x, y, o){
    const w = Math.PI / this.NL, a = this.ang + Math.round((Math.atan2(y, x) - this.ang) / w) * w;
    o.x = this.rho * Math.cos(a); o.y = this.rho * Math.sin(a);
  }
  exitFor(x, y){
    const NL = this.NL;
    const s1 = Math.ceil((this.phi + this.thc) / this.stp) - 1;        // いちばん古い（もうすぐつぶれる）輪
    const p = ((s1 % 2) + 2) % 2;
    let j = Math.round((Math.atan2(y, x) - this.ang - Math.PI * p / NL) / (TAU / NL));
    j = ((j % NL) + NL) % NL;
    return p * NL + j;
  }
  /* 出口: 輪がつぶれた向きの先、弧の届かない外側 */
  exitInfo(e, o){
    const NL = this.NL, p = e >= NL ? 1 : 0, j = e % NL, g = this.ang + Math.PI * (2 * j + p) / NL, dist = 2 * this.rho + this.tb + 12;
    o.mode = 1; o.dx = Math.cos(g); o.dy = Math.sin(g); o.x = o.dx * dist; o.y = o.dy * dist;
  }
  lump(e, o){
    const NL = this.NL, p = e >= NL ? 1 : 0, j = e % NL, g = this.ang + Math.PI * (2 * j + p) / NL;
    let s1 = Math.ceil((this.phi + this.thc) / this.stp) - 1;
    if ((((s1 % 2) + 2) % 2) !== p) s1--;
    const th = Math.min(0, this.phi - s1 * this.stp);
    const dist = Math.max(this.hub + RV + 4, this.rho * Math.cos(clamp(th * (Math.PI / 2) / this.thc, -Math.PI / 2, 0)));
    o.x = Math.cos(g) * dist; o.y = Math.sin(g) * dist; return true;
  }
  prey(tau){
    const NL = this.NL, sN = Math.floor(this.phi / this.stp), rho = this.rho;
    const lim = (this.shape === "arc" ? rho : rho * Math.SQRT1_2) - this.tb - RV * 1.15, lim2 = lim * lim;
    const a0 = this.ang + this.spin * tau, late = T + tau + this.thc / this.om * .7;
    let n = 0;
    for (let i = 0; i < M; i++){
      if ((ST[i] & 7) || IMM[i] > late) continue;
      const x = X[i] + VX[i] * tau, y = Y[i] + VY[i] * tau;
      for (let j = 0; j < NL; j++){
        const g = a0 + Math.PI * (2 * j + sN) / NL, dx = rho * Math.cos(g) - x, dy = rho * Math.sin(g) - y;
        if (dx * dx + dy * dy < lim2){ n++; break; }
      }
    }
    return n;
  }
  draw(c){
    const NL = this.NL, rho = this.rho, Mv = this.shape === "arc" ? 26 : 2;
    for (let b = 0; b < 2; b++) for (let j = 0; j < NL; j++){
      const dir = this.ang + (b ? -this.phi : this.phi) + TAU * j / NL, dx = Math.cos(dir), dy = Math.sin(dir);
      const nx = b ? dy : -dy, ny = b ? -dx : dx;
      const pt = u => {
        if (this.shape === "arc"){ const a = Math.PI * u, cu = Math.cos(a), su = Math.sin(a); return [rho * (dx - cu * dx + su * nx), rho * (dy - cu * dy + su * ny)]; }
        if (u <= .5){ const f = u * 2; return [rho * (dx + this.hm * nx) * f, rho * (dy + this.hm * ny) * f]; }
        const f = (u - .5) * 2; return [rho * (dx + this.hm * nx) + (rho * dx - rho * this.hm * nx) * f, rho * (dy + this.hm * ny) + (rho * dy - rho * this.hm * ny) * f];
      };
      c.beginPath();
      for (let q = 0; q <= Mv; q++){ const p = pt(q / Mv); q ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
      blade(c, this.tb, this.redK[b * NL + j]);
      for (let q = 1; q < 7; q++){ const p = pt(q / 7); rivet(c, p[0], p[1], 1.7); }
    }
    hubDraw(c, this.hub);
  }
}

/* ── はさみ箱: 棒 2 本がすべって入り、先の羽根が折れて箱になり、横に締まる。逆の順で戻る（動画の折れる箱） ── */
class Box extends Rig {
  constructor(){
    super();
    this.key = "box"; this.units = 2; this.n = 4; this.tb = 9; this.nex = 2;
    this.hb = 122;                       // 箱になったときの、真ん中から棒までの距離
    this.hf = 338;                       // 棒が入ってくるときの距離
    this.X0 = 292;                       // 箱になったときの、真ん中から羽根までの距離
    this.Lf = 2 * this.hb;               // 羽根の長さ（向かいの棒に届く）
    this.Xfar = R + 70 + this.Lf;
    this.mx = rnd() < .5 ? 1 : -1;       // 左右を入れかえた形もある
    this.ang = pick([0, Math.PI / 2]) + rr(-.4, .4);
    this.ca = Math.cos(this.ang); this.sa = Math.sin(this.ang);
    const tp = this.tp = rr(.92, 1.1), ev = rigEvent;
    this.cycle = 2.56 * tp; this.xc = this.tb + .8 * RV;
    this.ph = new Phases({ s: -this.Xfar, h: this.hf, psi: 0 }, c => {
      this.xc = this.tb + .8 * RV;
      return [
        { n: "wait", d: (c ? rr(.25, .45) * this.wk() : .2) * tp, hold: () => this.noPrey(.74 * tp), maxHold: 2.6 },
        { n: "in", d: .4 * tp, to: { s: this.X0 }, e: EZ.inOut, enter: () => ev("close") },
        { n: "fold", d: .34 * tp, to: { h: this.hb, psi: Math.PI / 2 }, e: EZ.inOut, exit: () => { this.sealed = true; ev("lock"); ev("seal"); } },
        { n: "pause", d: .05 * tp },
        { n: "squeeze", d: .32 * tp, to: { s: this.xc }, e: EZ.inQ, exit: () => ev("impact") },
        { n: "hold", d: .1 * tp },
        { n: "unsq", d: .3 * tp, to: { s: this.X0 }, e: EZ.outC },
        { n: "unfold", d: .32 * tp, to: { h: this.hf, psi: 0 }, e: EZ.inOut },
        { n: "out", d: .38 * tp, to: { s: -this.Xfar }, e: EZ.inQ },
      ];
    });
    this.sPrev = -this.Xfar; this.vel = 0; this.sealed = false;
    this.area = 2 * (2 * this.X0 + this.Lf) * 2 * this.tb;
  }
  name(){ return "はさみ箱"; }
  snd(){ return "box"; }
  start(){ return [0, 0]; }
  advance(dt){
    this.ph.update(dt);
    const v = this.ph.v, nm = this.ph.name;
    this.vel = Math.abs(v.s - this.sPrev) / dt; this.sPrev = v.s;
    this.sealed = nm === "pause" || nm === "squeeze" || nm === "hold"; this.closed = nm === "hold";
    this.live = nm === "in" || nm === "fold" || this.sealed;
    this.q = nm === "squeeze" || nm === "pause" ? clamp((this.X0 - v.s) / (this.X0 - this.xc), 0, 1) : nm === "hold" ? 1 : 0;
  }
  motion(){ return Math.min(1, this.vel / 1500); }
  /* 箱の向きに合わせた座標（lx: 羽根が寄る向き、ly: 棒が寄る向き）→ 画面の座標 */
  wx(lx, ly){ return this.mx * lx * this.ca - ly * this.sa; }
  wy(lx, ly){ return this.mx * lx * this.sa + ly * this.ca; }
  lx(x, y){ return this.mx * (x * this.ca + y * this.sa); }
  ly(x, y){ return -x * this.sa + y * this.ca; }
  lseg(k, ax, ay, bx, by, w, kind, grp, unit){ setSeg(k, this.wx(ax, ay), this.wy(ax, ay), this.wx(bx, by), this.wy(bx, by), w, kind, grp, unit); }
  geom(){
    const { s, h, psi } = this.ph.v, Lf = this.Lf, cp = Math.cos(psi), sp = Math.sin(psi), tb = this.tb;
    this.lseg(0, -s, -h, R + 150, -h, tb, 0, 2, 255);                          // 上の棒（右から入る）
    this.lseg(1, s, h, -R - 150, h, tb, 0, 3, 255);                            // 下の棒（左から入る）
    this.lseg(2, -s, -h, -s - Lf * cp, -h + Lf * sp, tb, this.kindOf(0), 0, 0);   // 左の羽根（上の棒の先）
    this.lseg(3, s, h, s + Lf * cp, h - Lf * sp, tb, this.kindOf(1), 1, 1);       // 右の羽根（下の棒の先）
  }
  inBox(x, y, m){
    const v = this.ph.v;
    return Math.abs(this.lx(x, y)) < v.s - this.tb + m && Math.abs(this.ly(x, y)) < v.h - this.tb + m;
  }
  heat(x, y){ return this.q > 0 && this.inBox(x, y, RV * .5) ? this.q * .8 : 0; }
  box(o){ if (this.q <= 0) return false; const r = Math.hypot(this.ph.v.s, this.hb) + RV; o[0] = -r; o[1] = -r; o[2] = r; o[3] = r; return true; }
  contains(x, y, m){ return this.sealed && this.inBox(x, y, m); }
  vise(e, x, y, o){
    const ly = clamp(this.ly(x, y), -this.hb * .45, this.hb * .45);
    o.x = this.wx(0, ly); o.y = this.wy(0, ly); o.ax = this.wx(1, 0); o.ay = this.wy(1, 0);
    o.half = Math.max(2, this.ph.v.s - this.tb);
  }
  exitFor(x, y){ return this.ly(x, y) < 0 ? 0 : 1; }
  /* 出口: 蝶番の 2 つの角の外（左上と右下） */
  exitInfo(e, o){
    const eo = this.tb + 14, sg = e ? 1 : -1, lx = sg * (this.xc + eo), ly = sg * (this.hb + eo), k = Math.SQRT1_2;
    o.mode = 1; o.x = this.wx(lx, ly); o.y = this.wy(lx, ly); o.dx = this.wx(sg * k, sg * k); o.dy = this.wy(sg * k, sg * k);
  }
  lump(e, o){ const ly = (e ? 1 : -1) * this.hb * .32; o.x = this.wx(0, ly); o.y = this.wy(0, ly); return true; }
  prey(tau){
    const limX = this.X0 - this.tb - RV - 25, limY = this.hb - this.tb - RV;
    let n = 0;
    for (let i = 0; i < M; i++){
      if ((ST[i] & 7) || IMM[i] > T + tau + .3) continue;
      const x = X[i] + VX[i] * tau, y = Y[i] + VY[i] * tau;
      if (Math.abs(this.lx(x, y)) < limX && Math.abs(this.ly(x, y)) < limY) n++;
    }
    return n;
  }
  draw(c){
    const { s, h, psi } = this.ph.v, Lf = this.Lf, cp = Math.cos(psi), sp = Math.sin(psi), tb = this.tb;
    c.save(); c.rotate(this.ang); c.scale(this.mx, 1);
    bar(c, -s, -h, R + 150, -h, tb, true, 0); bar(c, s, h, -R - 150, h, tb, true, 0);
    bar(c, -s, -h, -s - Lf * cp, -h + Lf * sp, tb, false, this.redK[0], true);
    bar(c, s, h, s + Lf * cp, h - Lf * sp, tb, false, this.redK[1], true);
    bolt(c, -s, -h, tb * .62); bolt(c, s, h, tb * .62);
    c.restore();
  }
}
const MECHS = { yose: Yose, loops: Loops, box: Box };
const MECH_KEYS = ["yose", "loops", "box"];

/* ── 仕掛けの絵 ── */
const METAL = ["#eef1f7", "#c3c9d4", "#8d94a1", "#5a606b"], REDM = ["#ffe1d6", "#ff8068", "#d23a2c", "#701812"];
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h1, h2, t){ const a = hexRgb(h1), b = hexRgb(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`; }
function rgba(h, a){ const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function rrect(c, x, y, w, h, r){
  if (c.roundRect){ c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function metal(c, x0, y0, x1, y1, red){
  const g = c.createLinearGradient(x0, y0, x1, y1), st = [0, .3, .62, 1];
  for (let q = 0; q < 4; q++) g.addColorStop(st[q], red > 0 ? mix(METAL[q], REDM[q], red) : METAL[q]);
  return g;
}
function rivet(c, x, y, r){ c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = "rgba(40,45,56,.55)"; c.fill(); }
/* まっすぐな刃・棒（groove: 板の溝、gold: 羽根の金色の筋、red: 消し刃の赤さ 0〜1） */
function bar(c, x0, y0, x1, y1, w, groove, red, gold){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  red = red || 0;
  c.save(); c.translate(x0, y0); c.rotate(Math.atan2(dy, dx));
  if (red > .02){ c.fillStyle = `rgba(255,70,40,${.22 * red})`; rrect(c, -w * 1.9, -w * 1.9, L + w * 3.8, w * 3.8, w * 1.9); c.fill(); }   // 赤く焼けた光
  c.fillStyle = metal(c, 0, -w, 0, w, red);
  rrect(c, -w, -w, L + 2 * w, 2 * w, w); c.fill();
  c.lineWidth = Math.max(.8, w * .12); c.strokeStyle = "rgba(20,24,32,.55)"; c.stroke();
  c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = w * .16;
  c.beginPath(); c.moveTo(w * .2, -w * .55); c.lineTo(L - w * .2, -w * .55); c.stroke();
  if (gold){ c.strokeStyle = "rgba(226,170,70,.85)"; c.lineWidth = w * .3; c.beginPath(); c.moveTo(w * 1.2, w * .42); c.lineTo(L - w * .6, w * .42); c.stroke(); }
  if (groove && L > 6 * w){
    c.strokeStyle = "rgba(40,46,58,.45)"; c.lineWidth = w * .14;
    c.beginPath(); c.moveTo(w * 2, w * .25); c.lineTo(Math.min(L, 2 * R) - w * 2, w * .25); c.stroke();
  }
  const n = Math.min(24, Math.floor(L / 46));
  for (let q = 1; q <= n; q++) rivet(c, L * q / (n + 1), 0, w * .17);
  c.restore();
}
function drawPoly(c, wp, p0, np, w, red){
  c.beginPath();
  for (let j = 0; j < np; j++){ const o = (p0 + j) * 2; j ? c.lineTo(wp[o], wp[o + 1]) : c.moveTo(wp[o], wp[o + 1]); }
  blade(c, w, red);
}
function rod(c, x0, y0, x1, y1, w){
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  c.save(); c.translate(x0, y0); c.rotate(Math.atan2(dy, dx));
  const g = c.createLinearGradient(0, -w, 0, w);
  g.addColorStop(0, "#9aa2b0"); g.addColorStop(.4, "#d9dde6"); g.addColorStop(1, "#4d535e");
  c.fillStyle = g; c.fillRect(0, -w, L, 2 * w);
  c.restore();
}
function mount(c, y, dir){
  c.save(); c.translate(0, y);
  const g = c.createLinearGradient(-34, 0, 34, 0);
  g.addColorStop(0, "#3b404b"); g.addColorStop(.5, "#9ba3b1"); g.addColorStop(1, "#30343d");
  c.fillStyle = g;
  rrect(c, -34, -13, 68, 26, 6); c.fill();
  c.fillStyle = "#1c1f26"; c.fillRect(-12, dir > 0 ? 9 : -15, 24, 6);
  c.restore();
}
function rail(c, x0, y0, x1, y1, w){
  c.save(); c.lineCap = "round";
  c.strokeStyle = "rgba(170,180,200,.13)"; c.lineWidth = w * 2.2;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = "rgba(230,236,248,.12)"; c.lineWidth = w * .5;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.restore();
}
/* いま組んである道筋を、刃として描く（曲がった刃・ギザギザ用） */
function blade(c, w, red){
  red = red || 0;
  c.lineCap = "round"; c.lineJoin = "round";
  if (red > .02){ c.strokeStyle = `rgba(255,70,40,${.22 * red})`; c.lineWidth = w * 3.8; c.stroke(); }
  c.strokeStyle = red ? mix("#555b67", "#4a1410", red) : "#555b67"; c.lineWidth = w * 2 + 1.6; c.stroke();
  c.strokeStyle = red ? mix("#a9b0bd", "#e2503a", red) : "#a9b0bd"; c.lineWidth = w * 2; c.stroke();
  c.strokeStyle = red ? `rgba(255,${Math.round(247 - 70 * red)},${Math.round(252 - 110 * red)},.75)` : "rgba(244,247,252,.75)";
  c.lineWidth = w * .55; c.stroke();
}
function bolt(c, x, y, r){
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  c.fillStyle = "#4a505b"; c.fill();
  c.beginPath(); c.arc(x - r * .2, y - r * .2, r * .55, 0, TAU);
  c.fillStyle = "#c9ced8"; c.fill();
}
function hubDraw(c, r){
  const g = c.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
  g.addColorStop(0, "#f2f4f8"); g.addColorStop(.6, "#9aa1ae"); g.addColorStop(1, "#4f5561");
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = g; c.fill();
  c.lineWidth = 2; c.strokeStyle = "rgba(30,34,42,.6)"; c.stroke();
  for (let q = 0; q < 6; q++){ const a = q * TAU / 6; rivet(c, Math.cos(a) * r * .58, Math.sin(a) * r * .58, r * .09); }
  c.beginPath(); c.arc(0, 0, r * .2, 0, TAU); c.fillStyle = "#2b2f38"; c.fill();
}

/* ══════════════════════════════════════════════════════════════════
   減るもの（増えるほうとケンカする相手）
   どれも「行ったり来たり」になるように作ってあり、いつかは必ず引き下がる（終わりがある）。
     食べる玉 … 食べるほど大きくなる。大きいと刃に挟まれてはじけ、食べた玉を吐き出す
     穴       … ひびで知らせてから開き、しばらくすると閉じる。混んでいるほど勢いよく噴き出す
     寿命     … 年をとると色あせ、しぼんで消える。だんだん長くなって、最後はなくなる
     消し刃   … 赤い刃が 1 枚ずつ広がり、やがて引いていく。赤い刃に挟まれた玉は消える
   ══════════════════════════════════════════════════════════════════ */
const VZ = { x: 0, y: 0, ax: 0, ay: 0, half: 0 };
const FOE_TUNE = {
  //            弱い  ふつう  強い
  // 食べる玉: 何匹・食べられる速さ（出てきたときの玉の数の何倍か/秒と、その下限）・おなかの大きさ（玉の数の何倍かと、その下限）
  eater: { lives: [2, 3, 5], atOnce: [1, 2, 3], cE: [.22, .34, .45], eMin: [16, 26, 34], cFull: [.7, .8, .9], fullMin: [30, 36, 44], share: [.8, .65, .5],
           keen: [.5, .7, .85], pull: [1000, 1600, 2000], reach: [70, 115, 130], age: [12, 13, 14], speed: [330, 400, 440], gulp: [.3, .3, .3] },
  // 穴: 何回開くか・吸い出す風の強さ・玉が少ないうちの上乗せ（強い穴ほど、出だしの玉を吸いつくしにくる）・開いている秒数・2 つ同時に開くか
  hole:  { opens: [2, 3, 4], wind: [600, 1400, 2100], early: [0, .5, 1.6], openT: [3, 4, 5.5], two: [0, 0, 1] },
  // 寿命: 出てきたとき、1 個の玉が寿命のうちに残す子の数のねらい（1 より小さいと減っていく）・寿命がある秒数
  life:  { rho: [1.75, 1.1, .8], dur: [16, 22, 28] },
  // 消し刃: 赤がいちばん多いまま続く秒数（いちばん多いときの枚数は、分かれる数から決める）
  red:   { hold: [5, 8, 9] },
};
function tune(key, name, lv){ return FOE_TUNE[key][name][lv - 1]; }
function makeFoe(key, lv){
  lv = clamp(lv | 0, 1, 3);

}

/* ── 食べる玉 ── */
class Eater {
  constructor(lv){

    this.gulp = tune("eater", "gulp", lv);           // いっぺんに飲みこめる量（食べる速さの何秒ぶんか）

  }
  start(){ this.next = T + .15; showLabel("食べる玉が来た！"); this.tell(); }
  tell(){
    showFight("食べる玉　のこり " + this.left + "　食べた " + NF.format(STAT.eaten - this.n0) + " 個" + (this.list.some(e => e.full && e.state !== "pop") ? "　おなかいっぱい！" : ""));
  }
  spawn(){

      const a = rnd() * TAU, d = R - r - 8;
