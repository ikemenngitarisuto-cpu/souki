    const eMax = clamp(tune("eater", "cE", this.lv) * N, tune("eater", "eMin", this.lv), 400);
    const cap = clamp(Math.round(tune("eater", "cFull", this.lv) * N), tune("eater", "fullMin", this.lv), 2500);
    this.list.push({ x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, r, rd: 0, eaten: 0, eMax, cap, t0: T, state: "hunt", st: T, tx: 0, ty: 0, pickT: 0,
                     bite: 0, dir: a, mouth: 0, exit: 0, fx: x, fy: y, hx: x, hy: y, heat: 0, sq: 1, sq2: 1, sqA: 0, full: false, fullT: 0 });
    this.toCome--;
    fxBig(x, y, 9, r * 2.4);
    AU.sfx("foe");
  }
  /* まだ決着がついていない（挟まれた食べる玉が、これから玉を吐き出す） */
  pending(){ return this.list.some(e => e.state === "trap" && Math.round(e.eaten * this.share) > 0); }
  update(dt){
    if (this.off){
      for (let j = this.list.length - 1; j >= 0; j--){ const e = this.list[j]; e.rd -= dt * 260; if (e.rd <= 0) this.list.splice(j, 1); }
      return;
    }
    if (RD.phase !== "grow") return;
    if (this.toCome > 0 && this.list.length < this.atOnce && T >= this.next){ this.spawn(); this.next = T + 1.3; }
    for (let j = this.list.length - 1; j >= 0; j--){
      const e = this.list[j];
      e.r = Math.sqrt(this.r0 * this.r0 + (this.rMax * this.rMax - this.r0 * this.r0) * Math.min(1, e.eaten / e.cap));
      e.rd += (e.r - e.rd) * Math.min(1, dt * 7);
      e.mouth = Math.max(0, e.mouth - dt * 3.2);
      if (e.state === "hunt") this.hunt(e, dt);
      else if (e.state === "hop"){
        const u = Math.min(1, (T - e.st) / .24), f = EZ.outC(u);
        e.x = e.fx + (e.hx - e.fx) * f; e.y = e.fy + (e.hy - e.fy) * f;
        if (u >= 1){ e.state = "hunt"; e.pickT = 0; }
      } else if (e.state === "trap"){
        // 挟まれた: 白いかたまりと一緒に、刃に押しつぶされていく
        rig.vise(e.exit, e.x, e.y, VZ);
        const k = Math.min(1, dt * 9);
        e.x += (VZ.x - e.x) * k; e.y += (VZ.y - e.y) * k;
        e.heat = Math.min(1, e.heat + dt * 2.5);
        const f = clamp(VZ.half / e.r, .1, 1);
        if (VZ.ax || VZ.ay){ e.sqA = Math.atan2(VZ.ay, VZ.ax); e.sq = f; e.sq2 = Math.min(1.7, 1 / Math.sqrt(f)); }
        else { e.sqA = 0; e.sq = e.sq2 = f; }
        if (T - e.st > 3.4) this.pop(e);             // はじける合図が来なかったとき
      }
      if (e.state === "pop") this.list.splice(j, 1);
    }
    this.tell();
  }
  hunt(e, dt){
    // おなかいっぱいになると、のろくなって、囲いの真ん中へ寄っていく（もうよけられない → 次に閉じたとき挟まれる）
    if (!e.full && (e.eaten >= e.cap || T - e.t0 > this.age)){ e.full = true; e.fullT = T; e.pickT = 0; }
    if (T >= e.pickT){
      e.pickT = T + .28;
      // 近くの玉（生まれたてのかたまりは、ごちそう）をねらう
      let best = -1, bs = 0;
      const tries = Math.min(M, 30);
      for (let q = 0; q < tries; q++){
        const i = (rnd() * M) | 0;
        if (ST[i] & 7) continue;
        const sc = (T - BORN[i] < .8 ? 2.2 : 1) / (Math.hypot(X[i] - e.x, Y[i] - e.y) + 90);
        if (sc > bs){ bs = sc; best = i; }
      }
      if (best >= 0){                                 // 玉の行く先を読んで、先回りする
        const lead = Math.min(.45, Math.hypot(X[best] - e.x, Y[best] - e.y) / 700);
        e.tx = X[best] + VX[best] * lead; e.ty = Y[best] + VY[best] * lead;
        const td = Math.hypot(e.tx, e.ty), tl = R - e.r; if (td > tl){ e.tx *= tl / td; e.ty *= tl / td; }
      } else { const a = rnd() * TAU; e.tx = Math.cos(a) * R * .5; e.ty = Math.sin(a) * R * .5; }
      if (e.full){
        rig.bait(e.x, e.y, VZ); e.tx = VZ.x; e.ty = VZ.y;
        if (T - e.fullT > 16 && !rig.live){ e.exit = rig.exitFor(e.x, e.y); this.pop(e); return; }   // それでも挟まれなければ、食べすぎではじける
      }
    }
    let dx = e.tx - e.x, dy = e.ty - e.y;
    const d = Math.hypot(dx, dy) || 1, sp = this.speed * Math.pow(this.r0 / e.r, .4) * Math.min(1, d / 24) * (e.full ? .8 : 1), k = Math.min(1, dt * 3.5);
    e.vx += (dx / d * sp - e.vx) * k; e.vy += (dy / d * sp - e.vy) * k;
    for (const o of this.list){                      // 食べる玉どうしは重ならない
      if (o === e) continue;
      const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy) || 1, pen = e.r + o.r + 6 - od;
      if (pen > 0){ e.vx += ox / od * pen * 6; e.vy += oy / od * pen * 6; }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    const dc = Math.hypot(e.x, e.y), lim = R - e.r - 2;
    if (dc > lim){ e.x *= lim / dc; e.y *= lim / dc; }
    if (Math.hypot(e.vx, e.vy) > 12) e.dir += wrapPi(Math.atan2(e.vy, e.vx) - e.dir) * Math.min(1, dt * 8);
    this.feed(e, dt);
  }
  /* 吸いこんで、触れた玉を食べる。食べきれない玉は体ではね返す */
  feed(e, dt){
    // 食べはじめはゆっくり、おなかの 3 割まで食べたところで、いちばん速くなる。おなかいっぱいになると遅くなる
    const rate = e.eMax * (.25 + .75 * Math.min(1, e.eaten / (.3 * e.cap))) * (e.full ? .4 : 1);
    e.bite = Math.min(e.bite + rate * dt, Math.max(2, rate * this.gulp));
    const S = e.r * 1.6 + this.reach + 3 * RV, S2 = S * S, span = S - e.r, pull = this.pull * dt;
    const cx0 = Math.max(0, Math.floor((e.x - S - G0) * GINV)), cx1 = Math.min(GW - 1, Math.floor((e.x + S - G0) * GINV));
    const cy0 = Math.max(0, Math.floor((e.y - S - G0) * GINV)), cy1 = Math.min(GHt - 1, Math.floor((e.y + S - G0) * GINV));
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++){
      const c = cy * GW + cx;
      for (let k = CST[c], end = CST[c + 1]; k < end; k++){
        const i = ITEM[k];
        if (i >= M || (ST[i] & 7)) continue;
        const dx = e.x - X[i], dy = e.y - Y[i], d2 = dx * dx + dy * dy;
        if (d2 > S2) continue;
        const d = Math.sqrt(d2) || 1, rb = RV * SC[i];
        if (d < e.r + rb * .6){
          if (e.bite >= 1){
            e.bite -= 1; e.eaten++; e.mouth = 1;
            if (FX.length < 160) fxRing(X[i], Y[i], COL[i]);
            kill(i); STAT.eaten++; RD.gone++; AU.sfx("gulp");
            continue;
          }
          const nx = -dx / d, ny = -dy / d, pen = e.r + rb - d;
          X[i] += nx * pen; Y[i] += ny * pen;
          const vn = (VX[i] - e.vx) * nx + (VY[i] - e.vy) * ny;
          if (vn < 0){ VX[i] -= 1.5 * vn * nx; VY[i] -= 1.5 * vn * ny; }
        } else {
          const a = pull * (1 - (d - e.r) / span);
          VX[i] += dx / d * a; VY[i] += dy / d * a;
        }
      }
    }
  }
  /* 囲いこまれた: 小さいうちは、たいていとび出してよける。大きいと逃げられない */
  onSeal(){
    if (this.off) return;
    for (const e of this.list){
      if (e.state !== "hunt" || !rig.contains(e.x, e.y, 0)) continue;
      const big = clamp((e.r - this.r0) / (this.rMax - this.r0), 0, 1);
      const pd = e.full ? 0 : this.keen * (1 - .5 * big);
      if (rnd() < pd) this.hop(e);
      else { e.state = "trap"; e.st = T; e.heat = 0; e.exit = rig.exitFor(e.x, e.y); }
    }
  }
  hop(e){
    // いちばん近い「囲いの外」へ、ひょいと跳ぶ
    const m = e.r + 2 * rig.tb + 12, a0 = Math.atan2(e.y, e.x);
    let bx = e.x, by = e.y, bn = 1e9;
    for (let q = 0; q < 12; q++){
      const a = a0 + q * TAU / 12, dx = Math.cos(a), dy = Math.sin(a);
      let x = e.x, y = e.y, n = 0;
      while (n < 60 && rig.contains(x, y, m)){ x += dx * 12; y += dy * 12; n++; }
      if (Math.hypot(x, y) > R - e.r - 4) n += 30;         // 円のふちにぶつかる向きは、あとまわし
      if (n < bn){ bn = n; bx = x; by = y; }
    }
    const dc = Math.hypot(bx, by), lim = R - e.r - 4;
    if (dc > lim){ bx *= lim / dc; by *= lim / dc; }
    e.state = "hop"; e.st = T; e.fx = e.x; e.fy = e.y; e.hx = bx; e.hy = by; e.vx = e.vy = 0;
    AU.sfx("pip");
  }
  onImpact(){
    if (this.off) return;
    for (const e of this.list) if (e.state === "trap") this.pop(e);
  }
  /* はじける: 食べた玉を、出口から吐き出す */
  pop(e){
    if (e.state === "pop") return;
    e.state = "pop";
    this.left--;
    const n = RD.phase === "grow" ? clamp(Math.round(e.eaten * this.share), 0, Math.max(0, RD.target - N)) : 0;
    if (n > 0) this.spill(e, n);
    STAT.spilled += n;
    fxBig(e.x, e.y, 9, e.r * 1.7); fxBig(e.x, e.y, 10, e.r);
    cam.shake = Math.max(cam.shake, 9);
    AU.sfx("splat");
    if (this.left <= 0 && this.toCome <= 0){ this.tell(); foeOver("食べる玉をやっつけた！"); }
    else { this.next = Math.max(this.next, T + 1.5); showLabel("食べる玉がはじけた！　のこり " + this.left); }
  }
  spill(e, n){
    const pal = RD.pal, ep = RD.epoch + pal.length * 4;
    rig.exitInfo(e.exit, EXO);
    if (EXO.mode === 0){
      // その場から、すき間に沿って左右へ
      const tx = EXO.tx, ty = EXO.ty, ve = EJECT_V[+SET.eject] || EJECT_V[1], span = Math.min((rig.L || 240) * .8, 24 + RV * SC0 * n * .5);
      for (let j = 0; j < n; j++){
        const sg = j & 1 ? 1 : -1, off = span * Math.sqrt(rnd()) * sg, sp = ve * (.5 + .7 * rnd()) * sg, ac = ve * .2 * (rnd() - .5);
        birth(e.x + tx * off, e.y + ty * off, tx * sp - ty * ac, ty * sp + tx * ac, pal[(ep - j % 3) % pal.length], SC0);
      }
      return;
    }
    const ne = rig.nex || 1;
    for (let q = 0; q < ne; q++){
      const cnt = Math.floor(n / ne) + (q < n % ne ? 1 : 0);
      if (!cnt) continue;
      const col = pal[(ep - q % 3) % pal.length];
      rig.exitInfo(rig.nex ? (e.exit + q) % ne : e.exit, EXO);
      fxStreak(e.x, e.y, EXO.x, EXO.y, col);
      spawnBlob(EXO.x, EXO.y, EXO.dx, EXO.dy, cnt, col);
    }
  }
  stop(){ if (RD.phase !== "gone") this.off = true; }      // 食べる玉が勝ったときは、消えるまで居すわる
  info(){ return { left: this.left, toCome: this.toCome, list: this.list.map(e => ({ state: e.state, full: e.full, r: +e.r.toFixed(1), eaten: e.eaten, cap: e.cap, eMax: Math.round(e.eMax), x: Math.round(e.x), y: Math.round(e.y) })) }; }
  draw(c){
    for (const e of this.list){
      const r = e.rd;
      if (r < 1 || e.state === "pop") continue;
      if (e.state === "hop"){                               // よけたときの残像
        c.strokeStyle = "rgba(196,150,255,.3)"; c.lineWidth = r * 1.3; c.lineCap = "round";
        c.beginPath(); c.moveTo(e.fx, e.fy); c.lineTo(e.x, e.y); c.stroke();
      }
      c.save(); c.translate(e.x, e.y);
      const trap = e.state === "trap";
      if (trap){
        c.translate((Math.random() - .5) * 4 * e.heat, (Math.random() - .5) * 4 * e.heat);
        c.rotate(e.sqA); c.scale(e.sq, e.sq2); c.rotate(-e.sqA);
      }
      // 体（暗いむらさき。明るいふちどり）
      const g = c.createRadialGradient(-r * .32, -r * .36, r * .08, 0, 0, r);
      g.addColorStop(0, "#7c58bd"); g.addColorStop(.5, "#35205f"); g.addColorStop(1, "#130a24");
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1.6, r * .07); c.strokeStyle = "rgba(216,176,255,.92)"; c.stroke();
      // 口（進む向きに開く。食べるとぱくぱくする）と歯
      c.save();
      c.rotate(e.dir); c.scale(1, Math.cos(e.dir) < 0 ? -1 : 1);
      const open = trap ? .04 : .15 + .5 * e.mouth * (.55 + .45 * Math.sin(T * 30));
      c.beginPath(); c.moveTo(-r * .12, 0); c.arc(0, 0, r * .95, -open, open); c.closePath();
      c.fillStyle = "#2c0616"; c.fill();
      if (!trap){
        c.fillStyle = "#f6f1ff";
        const th = r * .13 * Math.min(1, open * 3.2);
        for (let sg = -1; sg <= 1; sg += 2){
          const ex = Math.cos(open) * r * .95 + r * .12, ey = sg * Math.sin(open) * r * .95, el = Math.hypot(ex, ey) || 1;
          const ux = ex / el, uy = ey / el, px = uy * -sg, py = ux * sg;             // 口のふちに沿う向きと、口の中へ向かう向き
          for (const t of [.52, .72, .92]){
            const bx = -r * .12 + ex * t, by = ey * t, w = r * .075;
            c.beginPath(); c.moveTo(bx - ux * w, by - uy * w); c.lineTo(bx + ux * w, by + uy * w); c.lineTo(bx - px * th, by - py * th); c.closePath(); c.fill();
          }
        }
      }
      // 目（挟まれると見ひらく）
      const ex = r * .2, ey = -r * .53, er = r * (trap ? .25 : .2);
      c.beginPath(); c.arc(ex, ey, er, 0, TAU); c.fillStyle = "#fff"; c.fill();
      c.beginPath(); c.arc(ex + er * (trap ? 0 : .34), ey + er * .08, er * (trap ? .24 : .52), 0, TAU); c.fillStyle = "#170a22"; c.fill();
      if (e.full && !trap){                                 // おなかいっぱい: まぶたが下がる
        c.beginPath(); c.arc(ex, ey, er * 1.04, Math.PI * 1.08, Math.PI * 1.92); c.closePath(); c.fillStyle = "#3b2468"; c.fill();
      }
      c.restore();
      if (trap && e.heat > .02){ c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = `rgba(255,255,255,${.75 * e.heat * rig.q})`; c.fill(); }
      c.restore();
    }
  }
}

/* ── 穴 ── */
const CRACK_T = 1.3;
class Hole {
  constructor(lv){
    this.lv = lv;
    this.left = tune("hole", "opens", lv);           // あと何回開くか
    this.wind = tune("hole", "wind", lv);            // 穴へ吸い出す風の強さ
    this.early = tune("hole", "early", lv);          // 玉が少ないうちの上乗せ
    this.openT = tune("hole", "openT", lv);          // 開いている時間（秒）
    this.two = !!tune("hole", "two", lv);            // 2 つ同時に開く
    this.gaps = []; this.next = 0; this.spray = 0; this.d0 = STAT.drained; this.lastD = STAT.drained; this.lastA = rnd() * TAU; this.busy = false;
    // 2 回目からは、玉が増えてから開く（決めた数の何割まで増えたら開くか）。混んでいるほど勢いよく噴き出すのを見せるため
    this.marks = this.left === 2 ? [0, .3] : this.left === 3 ? [0, .08, .5] : [0, .04, .2, .6];
    this.count = 0; this.late = 0;
  }
  start(){ GAPS = this.gaps; this.next = T + .3; showLabel("円にひびが入る…"); this.tell(); }
  tell(){ showFight("穴　あと " + this.left + " 回　こぼれた " + NF.format(STAT.drained - this.d0) + " 個"); }
  site(a){
    const hw = Math.max(2.6 * RV + 10, 52) * [.85, 1, 1.15][this.lv - 1] / R;
    const lines = [];                                      // ひびの形（絵の飾り）
    for (let q = 0; q < 5; q++){
      const pts = [[0, (Math.random() - .5) * hw * R * .8]], side = q < 2;
      let x = 0, y = pts[0][1];
      const n = 4 + ((Math.random() * 4) | 0), dirY = Math.random() < .5 ? 1 : -1;
      for (let j = 0; j < n; j++){
        if (side){ x = Math.abs((Math.random() - .3) * 9); y += dirY * (8 + Math.random() * 12); }
        else { x += 7 + Math.random() * 13; y += (Math.random() - .5) * 20; }
        pts.push([x, y]);
      }
      lines.push(pts);
    }
    this.gaps.push({ a, hw: 0, max: hw, state: "crack", t: T, lines });
  }
  update(dt){
    // 穴が開いているあいだは少し引いて映す（外へ噴き出す玉が見えるように）
    const zt = this.gaps.some(g => g.hw > .002) && RD.phase === "grow" ? .9 : 1;
    if (RD.phase === "grow" || RD.phase === "gone") cam.zoom += (zt - cam.zoom) * Math.min(1, dt * 3);
    if (RD.phase !== "grow") return;
    if (!this.busy && this.left > 0 && T >= this.next && (N >= this.marks[this.count] * RD.target || T >= this.late)){   // なかなか増えないときは、12 秒で開く
      this.busy = true;
      this.lastA += rr(1.6, 4.6);
      this.site(this.lastA);
      if (this.two) this.site(this.lastA + Math.PI + rr(-.7, .7));
      showLabel("ひびが入った…");
    }
    let open = false;
    for (let j = this.gaps.length - 1; j >= 0; j--){
      const g = this.gaps[j], e = T - g.t;
      if (g.state === "crack"){
        if (Math.random() < dt * 10) AU.sfx("crack");
        if (e > CRACK_T){ g.state = "open"; g.t = T; AU.sfx("boom2"); cam.shake = Math.max(cam.shake, 6); fxBig(Math.cos(g.a) * R, Math.sin(g.a) * R, GOLD, g.max * R * 1.6); }
      } else if (g.state === "open"){
        g.hw = g.max * EZ.outC(Math.min(1, e / .28));
        if (e > this.openT){ g.state = "shut"; g.t = T; }
      } else {
        g.hw = g.max * (1 - EZ.inOut(Math.min(1, e / .6)));
        if (e >= .6){ this.gaps.splice(j, 1); AU.sfx("plug"); continue; }
      }
      if (g.hw > .004) open = true;
    }
    if (this.busy && !this.gaps.length){
      this.busy = false; this.left--; this.count++;
      if (this.left <= 0){ this.tell(); foeOver("穴はぜんぶふさがった！"); return; }
      this.next = T + rr(1.5, 2.4); this.late = T + 12;
    }
    // 風: 穴へ向かって吸い出す。中が混んでいるほど強い
    let flow = 0;
    if (open){
      const press = 1 + 2 * smooth(.6, 2.2, N / Math.max(1, CAPC)), W = this.wind * (press + this.early * (1 - smooth(60, 400, N))) * dt;
      for (const g of this.gaps){
        if (g.hw <= .004) continue;
        const gx = Math.cos(g.a) * R, gy = Math.sin(g.a) * R, w = W * (g.hw / g.max) * R;
        for (let i = 0; i < M; i++){
          if (ST[i] & 7) continue;
          const dx = gx - X[i], dy = gy - Y[i], d = Math.sqrt(dx * dx + dy * dy) + 1, a = w / (d + .3 * R);
          VX[i] += dx / d * a; VY[i] += dy / d * a;
        }
      }
      const out = 700 * press * dt;                        // 外へ出た玉は、勢いよく飛んでいく
      for (let i = 0; i < M; i++){
        if ((ST[i] & 5) !== 4) continue;
        const d = Math.hypot(X[i], Y[i]) || 1;
        VX[i] += X[i] / d * out; VY[i] += Y[i] / d * out;
      }
    }
    flow = (STAT.drained - this.lastD) / Math.max(dt, 1e-3); this.lastD = STAT.drained;
    this.spray += (Math.min(1, flow / 45) - this.spray) * Math.min(1, dt * 8);
    this.tell();
  }
  stop(){ this.gaps.length = 0; this.spray = 0; }
  info(){ return { left: this.left, gaps: this.gaps.map(g => ({ state: g.state, hw: +g.hw.toFixed(3), a: +g.a.toFixed(2) })) }; }
  draw(c, s){
    const lw = 2 * DPR / s;
    for (const g of this.gaps){
      const gx = Math.cos(g.a) * R, gy = Math.sin(g.a) * R;
      if (g.state === "crack"){
        const u = Math.min(1, (T - g.t) / CRACK_T);
        c.save(); c.translate(gx, gy); c.rotate(g.a + Math.PI);                 // x が円の中へ向かう向き
        c.translate((Math.random() - .5) * 2.5 * u, (Math.random() - .5) * 2.5 * u);
        c.strokeStyle = `rgba(255,255,255,${.55 + .45 * Math.random()})`; c.lineWidth = lw * (.8 + .6 * u); c.lineCap = "round"; c.lineJoin = "round";
        for (const pts of g.lines){
          const n = u * (pts.length - 1), full = Math.floor(n), fr = n - full;
          c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
          for (let j = 1; j <= full; j++) c.lineTo(pts[j][0], pts[j][1]);
          if (full + 1 < pts.length) c.lineTo(pts[full][0] + (pts[full + 1][0] - pts[full][0]) * fr, pts[full][1] + (pts[full + 1][1] - pts[full][1]) * fr);
          c.stroke();
        }
        c.restore();
      } else if (g.hw > .004){
        const k = g.hw / g.max;                             // 風のすじ（穴へ吸いこまれていく）
        c.lineCap = "round"; c.lineWidth = lw * 1.2;
        for (let j = 0; j < 11; j++){
          const ph = (T * 1.5 + j * .37) % 1, ang = g.a + Math.PI + (j - 5) * .19 + Math.sin(j * 12.9) * .07;
          const d0 = 50 + 330 * (1 - ph) * (1 - ph), d1 = Math.max(6, d0 - 40 - 70 * ph);
          c.strokeStyle = `rgba(255,255,255,${.24 * k * Math.sin(Math.PI * ph)})`;
          c.beginPath(); c.moveTo(gx + Math.cos(ang) * d0, gy + Math.sin(ang) * d0); c.lineTo(gx + Math.cos(ang) * d1, gy + Math.sin(ang) * d1); c.stroke();
        }
      }
    }
  }
}

/* ── 寿命 ── */
class Life {
  constructor(lv){
    this.lv = lv;
    this.rho0 = tune("life", "rho", lv);             // 1 個の玉が、寿命のうちに残す子の数のねらい（1 より小さいと減っていく）
    this.dur = tune("life", "dur", lv);              // 寿命がある時間（秒）
    this.t0 = T; this.L = 6; this.x0 = STAT.expired; this.done = false; this.spray = 0;
  }
  /* 寿命の長さ。挟まれる割合と分かれる数から逆算する（時間がたつほど長くなり、玉が有利になる） */
  calc(){
    const k = RD.k, f = clamp(RD.fhat, .1, .9), u = clamp((T - this.t0) / this.dur, 0, 1);
    const rho = Math.min(k * .96, this.rho0 + (k * .9 - this.rho0) * u * u);
    const n = Math.log(1 - rho / k) / Math.log(1 - f);     // 守りが切れてから、挟まれるまでに使える回数
    return clamp(rig.cycle * (+SET.guard + n) + GROW_T, 1.5, 60);
  }
  start(){
    this.t0 = T; this.L = LIFE_L = this.calc();
    for (let i = 0; i < M; i++) if (!(ST[i] & 1)) DIE[i] = T + this.L * rr(.5, 1.1);
    showLabel("玉に寿命がついた"); this.tell();
  }
  tell(){ showFight("寿命 " + this.L.toFixed(1) + " 秒　なくなるまで " + Math.max(0, Math.ceil(this.dur - (T - this.t0))) + " 秒　消えた " + NF.format(STAT.expired - this.x0) + " 個"); }
  onBirth(i){ if (!this.done) DIE[i] = T + this.L * rr(.92, 1.08); }
  update(dt){
    if (this.done || RD.phase !== "grow") return;
    if (T - this.t0 >= this.dur){ this.end(); foeOver("寿命がなくなった！"); return; }
    this.L += (this.calc() - this.L) * Math.min(1, dt * .9); LIFE_L = this.L;
    let dead = 0, fx = 0;
    for (let i = 0; i < M; i++){
      const st = ST[i];
      if (st & 7) continue;                                // 挟まれた玉は間に合った（分かれて、若い玉になる）
      if (st & 16){
        SC[i] -= dt / .4;
        if (SC[i] <= .12){ if (fx++ < 10 && FX.length < 200) fxFade(X[i], Y[i]); kill(i); dead++; }
      } else if (DIE[i] <= T) ST[i] = st | 16;
    }
    if (dead){ STAT.expired += dead; RD.gone += dead; AU.sfx("pip"); }
    this.tell();
  }
  end(){
    this.done = true; LIFE_L = 0;
    for (let i = 0; i < M; i++){ DIE[i] = Infinity; if ((ST[i] & 17) === 16){ ST[i] &= ~16; SC[i] = 1; } }
  }
  stop(){ if (!this.done) this.end(); }
  info(){ return { L: +this.L.toFixed(2), left: +(this.dur - (T - this.t0)).toFixed(1), done: this.done }; }
}

/* ── 消し刃 ── */
class RedTide {
  constructor(lv){
    this.lv = lv;
    const U = this.U = rig.units, be = 1 - 1 / RD.k;      // 赤い刃の割合がこれを超えると、玉は減っていく
    // いちばん赤が多いときの枚数: 弱い＝増え方がにぶる／ふつう＝少し減る／強い＝全部赤
    this.P = lv === 1 ? Math.max(1, Math.floor((be - .1) * U + 1e-9)) : lv === 2 ? clamp(Math.ceil((be + .08) * U - 1e-9), 1, U) : U;
    this.hold = tune("red", "hold", lv);
    this.up = clamp(7 / this.P, .8, 2.2); this.down = clamp(5 / this.P, .6, 1.6);
    // 赤くなる順（となりへ広がっていく）
    const order = [], s0 = (rnd() * U) | 0;
    if (rig.key === "loops"){ const NL = rig.NL; for (let j = 0; j < NL; j++){ const q = (s0 + j) % NL; order.push(q, NL + q); } }
    else for (let j = 0; j < U; j++) order.push(((s0 + (j & 1 ? (j + 1) >> 1 : -(j >> 1))) % U + U) % U);
    this.order = order; this.n = 0; this.t = T - this.up + .35; this.stage = "up"; this.done = false; this.x0 = STAT.erased; this.spray = 0;
  }
  start(){ RED.on = true; RED.set.clear(); showLabel("刃が赤くなる…"); this.tell(); }
  tell(){ showFight("消し刃　赤い刃 " + this.n + "/" + this.U + " 枚　消された " + NF.format(STAT.erased - this.x0) + " 個"); }
  update(dt){
    if (this.done || RD.phase !== "grow") return;
    const e = T - this.t;
    if (this.stage === "up"){
      if (e > this.up){ RED.set.add(this.order[this.n++]); this.t = T; AU.sfx("redon"); if (this.n >= this.P) this.stage = "hold"; }
    } else if (this.stage === "hold"){
      if (e > this.hold){ this.stage = "down"; this.t = T - this.down; }
    } else if (e > this.down){
      RED.set.delete(this.order[--this.n]); this.t = T;
      if (this.n <= 0){ this.done = true; RED.on = false; this.tell(); foeOver("赤がひいた！"); return; }
    }
    this.tell();
  }
  stop(){ RED.on = false; RED.set.clear(); this.done = true; }
  info(){ return { n: this.n, P: this.P, U: this.U, stage: this.stage, done: this.done }; }
}

/* ══════════════════════════════════════════════════════════════════
   1 回ぶんの進め方（1 個から始まって、割れるか金色になるか全滅するまで）
   ══════════════════════════════════════════════════════════════════ */
let rig = null, RD = null, FOE = null;
const EJECT_V = [.45 * R, 1.15 * R, 1.8 * R];       // 飛び出す勢い（弱く・ふつう・強く）
const FOE_AT = { eater: 30, hole: 40, life: 30, red: 50 };   // 減るものが出てくる玉の数
const FOE_NAMES = { eater: "食べる玉", hole: "穴", life: "寿命", red: "消し刃" };

/* 袋から引く（同じものが続かないように、ひととおり出るまで戻さない） */
const BAG = {};
function bagDraw(name, items){
  let b = BAG[name];
  if (!b || !b.list.length){
    const list = [];
    for (const [v, w] of items) for (let i = 0; i < w; i++) list.push(v);
    shuffle(list);
    if (b && list.length > 1 && list[list.length - 1] === b.last){ const t = list[0]; list[0] = list[list.length - 1]; list[list.length - 1] = t; }
    b = BAG[name] = { list, last: b ? b.last : undefined };
  }
  b.last = b.list.pop();
  return b.last;
}
/* この回の組み合わせを決める（📌 で固定していれば、それを使う） */
function planRound(){
  if (SET.pin && MECHS[SET.pin.mk] && SIZES[SET.pin.sz]) return Object.assign({}, SET.pin);
  const mk = MECHS[SET.mech] ? SET.mech : bagDraw("rig", [["yose", 4], ["loops", 3], ["box", 2]]);
  const sz = SIZES[SET.size] ? SET.size : bagDraw("size", [["xl", 2], ["l", 3], ["m", 3], ["s", 2], ["t", 1]]);
  // 分かれる数のおまかせ: 小さい玉ほど決めた数が多い（極小は 3 万個）ので、2 つは出さない（1 回が 2 分をこえて、だれる）
  const k = [2, 3, 4].includes(+SET.split) ? +SET.split : wpick(sz === "s" || sz === "t" ? [[3, .5], [4, .5]] : sz === "m" ? [[2, .1], [3, .45], [4, .45]] : [[2, .18], [3, .45], [4, .37]]);
  let nb = 0, shape = "";
  if (mk === "yose"){
    nb = SET.yoseN !== "auto" ? +SET.yoseN : bagDraw("yn", [[2, 3], [3, 2], [4, 3], [5, 2], [6, 2], [8, 2]]);
    shape = SET.yoseShape !== "auto" ? SET.yoseShape : wpick([["bar", .35], ["arc", .25], ["saw", .2], ["chev", .2]]);
  } else if (mk === "loops"){
    nb = SET.loopN !== "auto" ? +SET.loopN : bagDraw("ln", [[2, 4], [3, 3], [4, 2], [5, 1]]);
    if (sz === "xl" && nb > 4) nb = 4;       // 特大の玉は、輪 5 つだと輪が小さくて入れない（増えなくなる）ので、4 つまで
    shape = SET.loopShape !== "auto" ? SET.loopShape : wpick([["arc", .75], ["bar", .25]]);
  }
  const fs = SET.foe;
  const foe = fs === "none" ? null : fs === "auto" ? bagDraw("foe", [[null, 4], ["eater", 1], ["hole", 1], ["life", 1], ["red", 1]])   // おまかせ: 2 回に 1 回は、減るものなし
            : fs === "any" ? bagDraw("foe2", [["eater", 1], ["hole", 1], ["life", 1], ["red", 1]]) : fs;
  return { mk, nb, shape, sz, k, foe };
}
function recipeText(rc){
  return rig.name() + "　" + SIZES[rc.sz].n + "の玉　" + rc.k + " つに分かれる" + (rc.foe ? "　＋ " + FOE_NAMES[rc.foe] : "");
}
function newRound(){
  const rc = planRound();
  rad = SIZES[rc.sz].r; RC = RV = rad; GAMMA = GAMMAS[SET.crowd] || 0;
  M = 0; N = 0; DEAD = 0; doomedN = 0; FX.length = 0; wallOn = true; GAPS = null;
  RED.on = false; RED.set.clear();
  FOE = null; LIFE_L = 0; OUT_D = Math.max(4 * rad + 4, 170);
  gridFit(); D2MAX = 4 * RC * RC;
  rig = rc.mk === "yose" ? new Yose(rc.nb, rc.shape) : rc.mk === "loops" ? new Loops(rc.nb, rc.shape) : new Box();
  rig.install();
  AFREE = Math.PI * (R - rad) ** 2 - rig.area;
  // どこまで増やすか（「円 1 杯」の何倍か、または数）。キリのいい数にそろえる
  const cap = PACK * AFREE / (Math.PI * rad * rad), lim = SET.limit;
  let target = lim === "auto" ? round2(cap * 3) : lim === "x1" ? round2(cap) : lim === "x2" ? round2(cap * 2) : lim === "x5" ? round2(cap * 5) : +lim || round2(cap * 3);
  target = Math.max(10, Math.min(MAXN - 1000, target));
  let gold = target === 10000 || rnd() < .15;
  if (Q.get("gold")) gold = Q.get("gold") === "1";   // 試験用
  const start = (rnd() * PAL.length) | 0, pal = [];
  for (let i = 0; i < PAL.length; i++) pal.push((start + i * 5) % PAL.length);
  RD = { rc, mk: rc.mk, sz: rc.sz, k: rc.k, cap: Math.round(cap), target, gold, pal, phase: "intro", t: 0, epoch: 0,
         lastCrush: -99, still: true, fade: 1, mAlpha: 0, beads: null, frags: null,
         foe: rc.foe, foeLv: +SET.foeLv, foeOn: false, foeDone: false, peak: 1, peakT: 0, growT: 0,
         elig: 0, fhat: .3, born: 0, gone: 0, result: "", impT: 0 };
  STAT.rounds++;
  cam.zoom = 1;
  buildSprites(); drawBg();
  showLabel(recipeText(rc), false, 3400);
  showFight("");
  syncPin();
}
/* 生まれた玉を守る時間。玉がまだ少ないうち（12 個まで）は守らず、40 個までにだんだん長くする（出だしを待たせないため） */
function guardTime(){
  const g = +SET.guard;
  if (!g) return .2;
  return .2 + (rig.cycle * g - .08) * clamp((N - 12) / 28, 0, 1);
}
/* いま挟まれうる玉の数（守られていない玉） */
function crushableCount(){
  let n = 0;
  const late = T + rig.cycle * .5;
  for (let i = 0; i < M; i++) if (!(ST[i] & 7) && IMM[i] <= late) n++;
  return n;
}
function rigEvent(name){
  if (!RD) return;
  if (name === "close"){
    if (RD.phase === "grow"){ RD.epoch++; RD.elig = crushableCount(); }   // 閉じるたびに、次に生まれる玉の色を変える
  } else if (name === "lock"){
    AU.sfx("lock");
  } else if (name === "seal"){
    if (FOE && FOE.onSeal) FOE.onSeal();
  } else if (name === "impact"){
    impactDue = true;        // その歩の当たりを調べ終えてから、はじけさせる（閉じきった瞬間に挟まれた玉も入れるため）
  }
}
let impactDue = false;
function doImpact(){
  impactDue = false;
  RD.still = false;
  if (RD.impT > 0 && N > 40) rig.cycle += (clamp(T - RD.impT, .6, 4) - rig.cycle) * .4;   // 閉じる間隔（守る時間の物差し）を、実際の間隔に合わせる
  RD.impT = T;
  const n = splitAll();
  if (RD.phase === "grow" && RD.elig > 0) RD.fhat = RD.fhat * .7 + .3 * Math.min(1, n / RD.elig);   // 1 回で挟まれる割合（寿命の長さを決めるのに使う）
  cam.shake = Math.max(cam.shake, rig.key === "yose" && rig.NB === 2 ? 7 : 5);
  AU.sfx(rig.snd());
  if (FOE && FOE.onImpact) FOE.onImpact(n);
}

/* ── はじける: 挟まれていた玉が、いっせいに決まった数に分かれる ── */
const EXO = { mode: 0, x: 0, y: 0, dx: 0, dy: 0, tx: 0, ty: 0 };
const EXC = new Int32Array(32);
function splitAll(){
  if (!doomedN) return 0;
  const grow = RD.phase === "grow", k = RD.k, col = RD.pal[RD.epoch % RD.pal.length];
  EXC.fill(0);
  let room = RD.target - N, parents = 0, erased = 0, rings = 0, lx = 1e9, ly = 1e9;
  for (let i = 0; i < M; i++){
    const st = ST[i];
    if ((st & 3) !== 2) continue;
    if (st & 8){ if (erased < 60) fxPoof(X[i], Y[i]); kill(i); erased++; continue; }      // 消し刃: 分かれずに消える
    if (!grow || room <= 0){ ST[i] = st & ~2; doomedN--; GHO[i] = T + .5; HEAT[i] = 0; SC[i] = 1; continue; }   // もう増やせない: そのまま放す
    const kids = Math.min(k, room + 1);
    room -= kids - 1;
    const e = EXI[i];
    rig.exitInfo(e, EXO);
    if (EXO.mode === 0){ spawnInPlace(X[i], Y[i], kids, col, EXO.tx, EXO.ty); if (rings++ < 70) fxRing(X[i], Y[i], col); }   // その場で分かれる: 分かれた所に輪
    else if (rig.nex){ const st = Math.max(1, Math.round(rig.nex / kids)); for (let j = 0; j < kids; j++) EXC[(e + j * st) % rig.nex]++; }   // 出口（角）に分けて出す
    else EXC[e] += kids;
    kill(i); parents++;
  }
  for (let e = 0; e < 32; e++) if (EXC[e]){
    rig.exitInfo(e, EXO);
    if (rig.lump(e, LUMP)){
      fxStreak(LUMP.x, LUMP.y, EXO.x, EXO.y, col);
      if (Math.abs(LUMP.x - lx) + Math.abs(LUMP.y - ly) > 1){     // かたまりのあった所に、大きな輪をひとつ
        lx = LUMP.x; ly = LUMP.y;
        fxBig(lx, ly, col, clamp(RV * 2.2 * Math.sqrt(parents), RV * 3, 110));
      }
    }
    spawnBlob(EXO.x, EXO.y, EXO.dx, EXO.dy, EXC[e], col);
  }
  STAT.crush += parents; STAT.erased += erased; RD.born += parents * (k - 1); RD.gone += erased;
  if (parents){ RD.lastCrush = T; AU.pops(parents, RD.epoch); }
  if (erased) AU.sfx("sizzle");
  return parents;
}
function birth(x, y, vx, vy, col, sc){
  const i = addBall(x, y, vx, vy, col, guardTime(), sc);
  if (i >= 0){ FL[i] = T; if (FOE && FOE.onBirth) FOE.onBirth(i); }
  return i;
}
/* 出口から、かたまりで飛び出す（出たては小さく、ふくらみながら広がる） */
function spawnBlob(px, py, dx, dy, n, col){
  const ve = EJECT_V[+SET.eject] || EJECT_V[1];
  const rb = clamp(SC0 * RC * Math.sqrt(n / .78), RC * .6, 95);
  let cx = px + dx * rb, cy = py + dy * rb;
  const dc = Math.hypot(cx, cy), lim = R - RV - rb * .7;
  if (dc > lim){ cx *= lim / dc; cy *= lim / dc; }
  const a0 = rnd() * TAU;
  for (let j = 0; j < n; j++){
    const q = rb * Math.sqrt((j + .5) / n), a = a0 + j * 2.39996, ox = Math.cos(a) * q, oy = Math.sin(a) * q;
    const sp = ve * (.8 + .32 * rnd());
    birth(cx + ox, cy + oy, dx * sp + ox / rb * ve * .22, dy * sp + oy / rb * ve * .22, col, SC0);
  }
}
/* その場から、すき間に沿って左右へ流れ出す（プレス） */
function spawnInPlace(x, y, n, col, tx, ty){
  const ve = EJECT_V[+SET.eject] || EJECT_V[1], s0 = rnd() < .5 ? 1 : -1;
  for (let j = 0; j < n; j++){
    const sg = (j & 1) ? -s0 : s0, sp = ve * (.5 + .7 * rnd()) * sg, across = ve * .2 * (rnd() - .5), off = (j + 1) * .5 * RV * SC0 * sg;
    birth(x + tx * off, y + ty * off, tx * sp - ty * across, ty * sp + tx * across, col, SC0);
  }
}
/* はじける合図が来なかった玉が、その場で分かれる（めったにない） */
function splitOne(i){
  if (ST[i] & 8){ fxPoof(X[i], Y[i]); kill(i); STAT.erased++; RD.gone++; return; }
  const room = RD.target - N;
  if (RD.phase !== "grow" || room <= 0){ ST[i] &= ~2; doomedN--; GHO[i] = T + .5; HEAT[i] = 0; SC[i] = 1; return; }
  const kids = Math.min(RD.k, room + 1), col = RD.pal[RD.epoch % RD.pal.length], x = X[i], y = Y[i], a0 = rnd() * TAU;
  kill(i);
  for (let j = 0; j < kids; j++){ const a = a0 + j * TAU / kids; birth(x + Math.cos(a) * RV * .4, y + Math.sin(a) * RV * .4, Math.cos(a) * V0, Math.sin(a) * V0, col, SC0); }
  fxRing(x, y, col); STAT.crush++; RD.born += kids - 1; RD.lastCrush = T; AU.pops(1, RD.epoch);
}

/* ── 進み方（段取り） ── */
function roundUpdate(dt){
  RD.t += dt;
  const ph = RD.phase;
  RD.mAlpha = ph === "clear" ? Math.max(0, RD.mAlpha - dt / .6) : Math.min(1, RD.mAlpha + dt / .5);
  if (ph === "intro"){
    if (RD.t > .75){
      const p = rig.start();
      const i = addBall(p[0], p[1], 0, 0, RD.pal[0], 0, 1);
      FL[i] = T;
      RD.phase = "grow"; RD.growT = RD.t; RD.peakT = RD.t; RD.lastCrush = T;
      AU.sfx("pop");
    }
  } else if (ph === "grow"){
    if (!RD.foeOn && RD.foe && N >= FOE_AT[RD.foe]) startFoe();
    if (N >= RD.peak + Math.max(2, RD.peak * .01)){ RD.peak = N; RD.peakT = RD.t; }     // ゆっくりでも増えていれば（45 秒で 1%）、打ち切らない
    if (N > REC.maxN) REC.maxN = N;
    const fighting = RD.foeOn && !RD.foeDone;
    if (N >= RD.target){
      if (RD.foeOn){ showLabel("増えるほうの勝ち！"); if (!RD.result) RD.result = "win"; }
      if (RD.gold) startGold(); else startWarn();
    } else if (N === 0 && !doomedN && !(FOE && FOE.pending && FOE.pending())){
      foeWins(RD.foeOn ? FOE_NAMES[RD.foe] + "の勝ち（全滅）" : "全滅");
    } else if (!fighting && ((N < 8 && T - RD.lastCrush > 24) || RD.t - RD.peakT > 45 || RD.t - RD.growT > 330)){
      // 増えも減りもしなくなった回は、そっと終わりにする
      if (N > RD.target * .5){ if (RD.gold) startGold(); else startWarn(); } else fizzle();
    }
  } else if (ph === "gone" || ph === "fizzle"){
    if (ph === "fizzle") RD.fade = Math.max(0, 1 - (RD.t - RD.goneT) / 1.2);
    if (RD.t - RD.goneT > 1.8) startClear();
  } else if (ph === "warn"){
    cam.zoom += (1 - cam.zoom) * Math.min(1, dt * 5);
    const e = (RD.t - RD.warnT) / 1.8;
    cam.shake = Math.max(cam.shake, 1 + 5 * e * e);
    if (e >= 1) startBurst();
  } else if (ph === "burst"){

    for (let i = 0; i < M; i++) if (COL[i] !== GOLD && !(ST[i] & 1) && X[i] * X[i] + Y[i] * Y[i] < wr2){ COL[i] = GOLD; FL[i] = T; }

function startFoe(){
  RD.foeOn = true;

  if (!FOE){ RD.foeDone = true; return; }
  FOE.start();
  AU.sfx("foe");
}
/* 減るものが引き下がった（玉の勝ち。あとは決めた数まで増える） */
function foeOver(text){
  if (RD.foeDone) return;
  RD.foeDone = true; RD.result = "win";
  RD.peak = Math.max(1, N); RD.peakT = RD.t; RD.growT = RD.t; RD.lastCrush = T;   // ここから増え直す（「増えなくなった」の見張りを、やり直す）
  showLabel(text); showFight("");
  AU.sfx("cheer");
}
function endFoes(){ if (FOE && FOE.stop) FOE.stop(); showFight(""); }
function startWarn(){
  RD.phase = "warn"; RD.warnT = RD.t; endFoes();

}

  RD.phase = "burst"; RD.burstT = RD.t; wallOn = false; GAPS = null;

    if (ST[i] & 2){ ST[i] &= ~2; doomedN--; SC[i] = 1; HEAT[i] = 0; }
    const x = X[i], y = Y[i], d = Math.hypot(x, y);
    let nx, ny;
    if (d < 1){ const a = rnd() * TAU; nx = Math.cos(a); ny = Math.sin(a); } else { nx = x / d; ny = y / d; }
    const sp = 320 + 760 * (d / R) + rnd() * 160;
    VX[i] = VX[i] * .3 + nx * sp; VY[i] = VY[i] * .3 + ny * sp;
  }

  for (let i = 0; i < 20; i++){
    const a0 = i / 20 * TAU, a1 = (i + 1) / 20 * TAU, am = (a0 + a1) / 2, sp = rr(260, 520);
    RD.frags.push({ a0: a0 - am, a1: a1 - am, x: Math.cos(am) * R, y: Math.sin(am) * R, vx: Math.cos(am) * sp, vy: Math.sin(am) * sp, rot: am, vr: rr(-1.5, 1.5) });
  }

}
function startGold(){ RD.phase = "gold"; RD.goldT = RD.t; endFoes(); AU.chime(); roundDone(); }
function startClear(){ RD.phase = "clear"; RD.clearT = RD.t; if (FOE && FOE.stop) FOE.stop(); }
function foeWins(text){
  RD.phase = "gone"; RD.goneT = RD.t; RD.result = RD.foeOn ? "lose" : "";

}
function fizzle(){ RD.phase = "fizzle"; RD.goneT = RD.t; endFoes(); showLabel("増えなくなったので、次へ"); roundDone(); }
/* 玉が少ないのに、しばらくひとつも挟まれていないとき: 玉を「次に囲いこまれる所」へ少しずつ向かわせる。
   （玉が刃のうしろや端に回りこんだまま、いつまでも増えない回をなくす。ふだんは働かない） */
function herd(dt){
  if (RD.phase !== "grow" || N >= 30 || T - RD.lastCrush < 4) return;
  const a = 1100 * dt;
  for (let i = 0; i < M; i++){
    if (ST[i] & 7) continue;
    rig.bait(X[i], Y[i], VZ);
    const dx = VZ.x - X[i], dy = VZ.y - Y[i], d = Math.hypot(dx, dy);
    if (d < 40) continue;

  }
}
/* 記録をつける */
function roundDone(){
  REC.rounds++;

  saveRec(); syncStats();
}
/* 割れたあと: 外向きの風で、残った玉も外へ運ぶ */
function blowOut(dt){
  const a = 900 * dt;

    if (ST[i] & 1) continue;
    const x = X[i], y = Y[i], d = Math.hypot(x, y) || 1;
    VX[i] += x / d * a; VY[i] += y / d * a;

}
function wipeOffscreen(){
  const s = VIEW.s * (CALM ? 1 : cam.zoom), m = rad * 3;
  const l = -VIEW.cx / s - m, r = (CW - VIEW.cx) / s + m, t = -VIEW.cy / s - m, b = (CH - VIEW.cy) / s + m;
  for (let i = 0; i < M; i++){ const x = X[i], y = Y[i]; if (!(ST[i] & 1) && (x < l || x > r || y < t || y > b)) kill(i); }
}

/* ── 進める（描かない） ── */
let simAcc = 0, lastFill = 0;
function advance(dt){
  simAcc += dt;

  while (simAcc >= HS && n < 12){ substep(HS); simAcc -= HS; n++; }
  if (n >= 12) simAcc = 0;

  updateRadius(dt);

}

/* ── 演出（輪・けむり・すじ・きらめき）と、画面の揺れ ── */
const FX = [];
const cam = { zoom: 1, shake: 0, sx: 0, sy: 0 };
const CALM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);   // 動きを控えめにする設定なら、画面を揺らさない
function fxRing(x, y, col){ FX.push({ k: 0, x, y, col, t0: T, life: .4 }); }
function fxPoof(x, y){ FX.push({ k: 2, x, y, col: 0, t0: T, life: .45 }); }
function fxStreak(x0, y0, x1, y1, col){ FX.push({ k: 3, x: x0, y: y0, x1, y1, col, t0: T, life: .22 }); }
function fxBig(x, y, col, r){ FX.push({ k: 4, x, y, col, r, t0: T, life: .55 }); }
function fxFade(x, y){ FX.push({ k: 5, x, y, col: 0, t0: T, life: .4 }); }
function fxTwinkle(){
  if (!M) return;
  const i = (Math.random() * M) | 0;
  if (ST[i] & 1) return;
  FX.push({ k: 1, x: X[i], y: Y[i], col: GOLD, t0: T, life: .6 });
}
function fxUpdate(dt){
  for (let i = FX.length - 1; i >= 0; i--) if (T - FX[i].t0 > FX[i].life) FX.splice(i, 1);
  if (RD.frags) for (const f of RD.frags){ f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; }

}

  SPR.gray = ballSprite("#8c8f98", size, rp, 0);

  if (SPR.size !== Math.max(4, Math.ceil(RV * VIEW.s * 2 + 2))) { GLR.ok = false; buildSprites(); }
  const k = s / VIEW.s, base = RV * s, m = 2 * base + 4, l = -m, r = CW + m, t = -m, b = CH + m;
  for (let i = 0; i < M; i++){
    if (ST[i] & 1) continue;
    const x = ox + X[i] * s, y = oy + Y[i] * s;
    if (x < l || x > r || y < t || y > b) continue;
    ballLook(i, 0, LOOK, x, y, base);
    const z = SPR.size * k * SC[i], a = alpha * LOOK[6];
    c.globalAlpha = a; c.drawImage(SPR.img[COL[i]], x - z / 2, y - z / 2, z, z);
    if (LOOK[5] > .03){ c.globalAlpha = a * LOOK[5] * .85; c.drawImage(SPR.gray, x - z / 2, y - z / 2, z, z); }
    if (LOOK[4] > .03){ c.globalAlpha = a * LOOK[4]; c.drawImage(SPR.white, x - z / 2, y - z / 2, z, z); }
  }
  c.globalAlpha = 1;
}

/* 円（穴があれば、そこだけ線を切る）と、割れるときのかけら・白い粒 */
function drawContainer(c, s){
  const ph = RD.phase, lw = 2.2 * DPR / s;
  if (ph === "burst" || ph === "clear"){
    if (!RD.frags) return;
    const e = RD.t - RD.burstT, a = Math.max(0, 1 - e / 1.4);
    if (a <= 0) return;
    c.strokeStyle = `rgba(255,255,255,${.85 * a})`; c.lineWidth = lw;
    for (const f of RD.frags){
      c.save(); c.translate(f.x, f.y); c.rotate(f.rot);
      c.beginPath(); c.arc(-R, 0, R, f.a0, f.a1); c.stroke();
      c.restore();
    }
    return;
  }
  let alpha = .88;
  if (ph === "warn") alpha *= .55 + .45 * Math.random();
  c.strokeStyle = `rgba(255,255,255,${alpha})`; c.lineWidth = lw; c.lineCap = "butt";
  const gaps = GAPS ? GAPS.filter(g => g.hw > .001).sort((p, q) => p.a - q.a) : null;
  if (gaps && gaps.length){
    for (let j = 0; j < gaps.length; j++){
      const g = gaps[j], h = gaps[(j + 1) % gaps.length];
      const from = g.a + g.hw, to = h.a - h.hw + (j + 1 === gaps.length ? TAU : 0);
      if (to > from){ c.beginPath(); c.arc(0, 0, R, from, to); c.stroke(); }
    }
    c.fillStyle = `rgba(255,255,255,${alpha})`;
    for (const g of gaps) for (let sg = -1; sg <= 1; sg += 2){ const a = g.a + sg * g.hw; c.beginPath(); c.arc(Math.cos(a) * R, Math.sin(a) * R, Math.max(4, lw * 1.6), 0, TAU); c.fill(); }
  } else {
    const a0 = -Math.PI / 2, sweep = TAU * (ph === "intro" ? EZ.outC(Math.min(1, RD.t / .6)) : 1);
    c.beginPath(); c.arc(0, 0, R, a0, a0 + sweep); c.stroke();
  }
  if (ph === "warn" && RD.beads){
    for (const b of RD.beads){
      const e = RD.t - b.t; if (e < 0) continue;
      const k = Math.min(1, e / .15), rb = (5 + 3 * Math.sin(e * 18)) * k * DPR / s * 1.6;
      c.beginPath(); c.arc(Math.cos(b.a) * R, Math.sin(b.a) * R, Math.max(rb, lw), 0, TAU);
      c.fillStyle = "rgba(255,255,255,.95)"; c.fill();
    }
  }
}
/* 進み具合の輪（決めた数まで、あとどのくらいか。けたで数えるので、増え方が一定なら一定の速さで進む） */
let ringShown = 0;
function drawRing(c, s){
  const ph = RD.phase;
  if (SET.ring === "0" || (ph !== "grow" && ph !== "warn" && ph !== "gold")) { ringShown = 0; return; }
  const want = N > 1 ? clamp(Math.log(N) / Math.log(RD.target), 0, 1) : 0;
  ringShown += (want - ringShown) * .12;
  const rr_ = R + 15, lw = 3.4 * DPR / s, a0 = -Math.PI / 2;
  c.lineWidth = lw; c.lineCap = "round";
  c.strokeStyle = "rgba(255,255,255,.07)"; c.beginPath(); c.arc(0, 0, rr_, 0, TAU); c.stroke();
  if (ringShown > .004){
    c.strokeStyle = ph === "gold" ? rgba(PALX[GOLD], .85) : rgba(PALX[RD.pal[RD.epoch % RD.pal.length]], .75);
    c.beginPath(); c.arc(0, 0, rr_, a0, a0 + TAU * ringShown); c.stroke();
  }
}
function drawFx(c){
  for (const f of FX){
    const e = (T - f.t0) / f.life;
    if (f.k === 0){                                      // はじけた所の輪
      c.strokeStyle = rgba(PALX[f.col], .9 * (1 - e)); c.lineWidth = RV * .45 * (1 - e) + .5;
      c.beginPath(); c.arc(f.x, f.y, RV * (1.2 + 3.2 * EZ.outC(e)), 0, TAU); c.stroke();
    } else if (f.k === 2){                               // 消し刃のけむり
      c.strokeStyle = `rgba(190,120,100,${.8 * (1 - e)})`; c.lineWidth = RV * .3 * (1 - e) + .5;
      c.beginPath(); c.arc(f.x, f.y, RV * (.6 + 1.8 * EZ.outC(e)), 0, TAU); c.stroke();
      c.fillStyle = `rgba(16,8,6,${.6 * (1 - e)})`; c.beginPath(); c.arc(f.x, f.y, RV * (1 - e), 0, TAU); c.fill();
    } else if (f.k === 3){                               // つぶれた所から出口へのすじ
      const u = EZ.outC(e), x = f.x + (f.x1 - f.x) * u, y = f.y + (f.y1 - f.y) * u;
      c.strokeStyle = rgba(PALX[f.col], .55 * (1 - e)); c.lineWidth = RV * 1.5 * (1 - e) + 1; c.lineCap = "round";
      c.beginPath(); c.moveTo(f.x + (f.x1 - f.x) * u * u, f.y + (f.y1 - f.y) * u * u); c.lineTo(x, y); c.stroke();
    } else if (f.k === 4){                               // 大きな光の輪
      c.strokeStyle = rgba(PALX[f.col], .8 * (1 - e)); c.lineWidth = (f.r * .16) * (1 - e) + 1;
      c.beginPath(); c.arc(f.x, f.y, f.r * (.4 + 1.3 * EZ.outC(e)), 0, TAU); c.stroke();
    } else if (f.k === 5){                               // 寿命で消えた所（灰色の輪）
      c.strokeStyle = `rgba(170,174,186,${.6 * (1 - e)})`; c.lineWidth = RV * .22 * (1 - e) + .4;
      c.beginPath(); c.arc(f.x, f.y, RV * (.5 + 1.1 * EZ.outC(e)), 0, TAU); c.stroke();
    } else {                                             // 金色のきらめき
      const r = RV * 2.6 * Math.sin(Math.PI * e);
      c.strokeStyle = `rgba(255,240,200,${.9 * (1 - e)})`; c.lineWidth = RV * .25;
      c.beginPath(); c.moveTo(f.x - r, f.y); c.lineTo(f.x + r, f.y); c.moveTo(f.x, f.y - r); c.lineTo(f.x, f.y + r); c.stroke();
    }
  }
}
let shownN = -1, bumpAt = 0;
const NF = new Intl.NumberFormat("en-US");
function render(){
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, CW, CH);
  if (!RD) return;
  const calm = CALM || SET.shake === "0";
  const shake = calm ? 0 : cam.shake, zoom = CALM ? 1 : cam.zoom;
  cam.sx = (Math.random() - .5) * 2 * shake * DPR; cam.sy = (Math.random() - .5) * 2 * shake * DPR;
  const s = VIEW.s * zoom, ox = VIEW.cx + cam.sx, oy = VIEW.cy + cam.sy;
  const fade = RD.phase === "clear" ? Math.min(RD.fade, RD.mAlpha) : RD.fade;
  if (!GLR.draw(s, ox, oy, fade)){ GLR.clear(); drawBalls2D(c, s, ox, oy, fade); }
  c.setTransform(s, 0, 0, s, ox, oy);
  c.globalAlpha = RD.mAlpha * fade; rig.drawBack(c);
  c.globalAlpha = fade; drawRing(c, s); drawContainer(c, s);
  if (FOE && FOE.draw) FOE.draw(c, s);
  c.globalAlpha = RD.mAlpha * fade; rig.draw(c);
  c.globalAlpha = fade; drawFx(c);
  c.globalAlpha = 1;
  // 玉の数
  if (N !== shownN && RD.phase !== "clear"){   // 消えていく間は数字を止めておく
    if (N > shownN && shownN > 0) bumpAt = performance.now();
    shownN = N; countEl.textContent = NF.format(N);
  }
  const b = Math.exp(-(performance.now() - bumpAt) / 110);
  countEl.style.transform = b > .01 ? `scale(${1 + .1 * b})` : "";
  countEl.classList.toggle("gold", RD.phase === "gold" || (RD.phase === "clear" && RD.gold && RD.fade < 1));
  countEl.style.opacity = RD.phase === "clear" || RD.phase === "intro" ? ".35" : "1";
}

/* 名札（仕掛けの名前や、できごとを少しのあいだ出す）と、ケンカの様子（出しっぱなし） */
let labelTimer = 0;
function showLabel(text, keep, ms){
  labelEl.textContent = text; labelEl.classList.add("show");
  clearTimeout(labelTimer);
  if (!keep) labelTimer = setTimeout(() => labelEl.classList.remove("show"), ms || 2600);
}
let fightText = "";
function showFight(text){
  if (text === fightText) return;
  fightText = text; fightEl.textContent = text; fightEl.classList.toggle("show", !!text);
}

/* ══════════════════════════════════════════════════════════════════
   音（その場で作る。ファイルは使わない）
   ・はじける音は、閉じるたびに音程が上がっていく（5 つの音の音階を 3 段。15 回でひとまわり）
   ・玉どうしの粒の音は、数が増えると「ザーッ」という 1 本の音にまとめる
   ・仕掛けが動く低い音、閉じる音、割れる前に上がっていく音
   ══════════════════════════════════════════════════════════════════ */
const SCALE = [0, 2, 4, 7, 9];
const AU = {
  ctx: null, master: null, B: {}, voices: 0, hum: null, humSrc: null, rain: null, rainBP: null, hiss: null,
  ready: false, last: {}, act: 0, dest: null,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e){ return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .2;
    this.master = c.createGain(); this.master.connect(comp); comp.connect(c.destination);
    if (Q.get("rec") === "1" && c.createMediaStreamDestination){ this.dest = c.createMediaStreamDestination(); comp.connect(this.dest); }   // 試験用（音を録って確かめる）
    try { this.synth(); } catch (e){ console.error(e); return; }
    const loop = (buf, filterType, freq, q) => {
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = c.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; if (q) f.Q.value = q;
      const g = c.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
      return { src, f, g };
    };
    const h = loop(this.B.hum, "lowpass", 420); this.hum = h.g; this.humSrc = h.src;      // 仕掛けが動く音
    const r = loop(this.B.noise, "bandpass", 1800, .7); this.rain = r.g; this.rainBP = r.f;   // 玉の粒の音をまとめた「ザーッ」
    const s = loop(this.B.noise, "highpass", 2600); this.hiss = s.g;                       // 穴から噴き出す音
    this.ready = true; this.setVol();
    c.onstatechange = () => showHint();
  },
  running(){ return this.ready && this.ctx.state === "running" && !SET.mute && SET.vol > 0; },
  resume(){ this.init(); if (this.ctx && this.ctx.state !== "running") this.ctx.resume().then(showHint, () => {}); },
  setVol(){ if (this.master){ const v = SET.mute ? 0 : (SET.vol / 100) ** 2; this.master.gain.setTargetAtTime(v, this.ctx.currentTime, .03); } },
  rl(key, gap){ const now = this.ctx.currentTime; if ((this.last[key] || -9) + gap > now) return false; this.last[key] = now; return true; },
  play(buf, gain, rate, pan, when){
    if (this.voices > 46 || !buf) return;
    const c = this.ctx, src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; src.playbackRate.value = rate || 1; g.gain.value = gain;
    src.connect(g);
    if (pan && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(this.master); }
    else g.connect(this.master);
    this.voices++; src.onended = () => { this.voices--; };
    src.start(when || 0);
  },
  any(a){ return a[(Math.random() * a.length) | 0]; },
  sfx(name){
    if (!this.running()) return;
    const B = this.B, now = this.ctx.currentTime, j = () => .94 + Math.random() * .12;
    if (name === "press"){ this.play(B.clank, .8, .92 * j()); }
    else if (name === "cross"){ this.play(B.clank, .72, 1.18 * j()); this.play(B.clack, .4, 1); }
    else if (name === "box"){ this.play(B.clank, .66, 1.32 * j()); this.play(B.clack, .45, .9); }
    else if (name === "loops"){ this.play(B.snip, .8, j()); }
    else if (name === "lock"){ this.play(B.clack, .3, 1.05 * j(), 0, now); }
    else if (name === "pop"){ this.play(B.pop[0], .5, j()); }
    else if (name === "boom"){ this.play(B.boom, 1, 1); this.play(B.shatter, .5, 1, 0, now + .02); }
    else if (name === "gulp"){ if (this.rl("gulp", .09)) this.play(this.any(B.pop), .3, .42 * j()); }
    else if (name === "splat"){ this.play(B.splat, .9, j()); }
    else if (name === "sizzle"){ if (this.rl("sizzle", .08)) this.play(B.sizzle, .5, j()); }
    else if (name === "pip"){ if (this.rl("pip", .12)) this.play(this.any(B.tick), .06, 2.2 * j()); }
    else if (name === "crack"){ if (this.rl("crack", .05)) this.play(this.any(B.tick), .3, .5 * j(), (Math.random() - .5)); }
    else if (name === "plug"){ this.play(B.pop[1], .4, .6); }
    else if (name === "boom2"){ this.play(B.shatter, .42, .8); this.play(B.boom, .4, 1.5); }
    else if (name === "redon"){ this.play(B.sizzle, .34, .7); this.play(B.bell, .14, .2, 0, now); }
    else if (name === "foe"){ this.play(B.bell, .24, .36, -.3, now); this.play(B.bell, .2, .27, .3, now + .12); }
    else if (name === "gone"){ this.play(B.bell, .3, .3, 0, now); this.play(B.bell, .22, .225, 0, now + .25); }
    else if (name === "cheer"){ [1, 1.25, 1.5].forEach((r, q) => this.play(B.bell, .2, r * .75, (q - 1) * .3, now + q * .07)); }
  },
  /* はじける音。m: 分かれた玉の数、epoch: 何回目の閉じか（音程を決める） */
  pops(m, epoch){
    if (!this.running()) return;
    const B = this.B, now = this.ctx.currentTime, idx = ((epoch % 15) + 15) % 15;
    const note = 2 ** ((SCALE[idx % 5] + 12 * Math.floor(idx / 5) - 12) / 12);
    const n = Math.min(7, 1 + Math.floor(Math.log2(m + 1))), loud = Math.min(1, .45 + .08 * Math.log2(m + 1));
    const mult = [1, 1.5, 2, 1.25, 3, 1, 1.5];
    for (let q = 0; q < n; q++){
      this.play(this.any(B.pop), loud * .8 / (1 + q * .28), note * mult[q] * (.99 + Math.random() * .02), (Math.random() - .5) * .8, now + q * (.012 + Math.random() * .02));
    }
  },
  /* 割れる前に上がっていく音と、ぱちぱち */
  riser(sec){
    if (!this.running()) return;
    const c = this.ctx, now = c.currentTime;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(150, now); o.frequency.exponentialRampToValueAtTime(640, now + sec);
    f.type = "lowpass"; f.frequency.setValueAtTime(500, now); f.frequency.exponentialRampToValueAtTime(3200, now + sec);
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.085, now + sec * .9); g.gain.linearRampToValueAtTime(0, now + sec + .04);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(now); o.stop(now + sec + .06);
    for (let q = 0; q < 34; q++){ const t = sec * Math.sqrt(q / 34); this.play(this.any(this.B.tick), .12 + .25 * (t / sec), 1.6 + Math.random() * .8, (Math.random() - .5) * 1.4, now + t); }
  },
  chime(){
    if (!this.running()) return;
    const now = this.ctx.currentTime;
    [1, 1.25, 1.5, 2, 2.5].forEach((r, q) => this.play(this.B.bell, .32, r * .5, (q - 2) * .25, now + q * .09));
  },
  /* こまごと: 仕掛けの音・粒の音・噴き出す音の大きさを、いまの様子に合わせる */
  frame(fill, motion, dt, spray){
    if (!this.ready) return;
    const on = this.running(), now = this.ctx.currentTime;
    this.hum.gain.setTargetAtTime(on ? Math.min(.16, motion * .16) : 0, now, .05);
    this.humSrc.playbackRate.setTargetAtTime(.85 + .5 * Math.min(1, motion), now, .08);
    const per = (hitN + clinkN) / Math.max(dt, 1 / 240);            // 1 秒あたりのぶつかり
    this.act += (per - this.act) * Math.min(1, dt * 6);
    const dense = Math.min(1, this.act / 1500);                    // 粒がまとまって 1 本の音になる度合い
    this.rain.gain.setTargetAtTime(on ? Math.min(.11, .0034 * Math.sqrt(this.act)) * (.35 + .65 * dense) : 0, now, .08);
    this.rainBP.frequency.setTargetAtTime(1300 + 1900 * dense, now, .1);
    this.hiss.gain.setTargetAtTime(on ? Math.min(.14, (spray || 0) * .14) : 0, now, .06);
    if (!on) return;
    const quiet = (1 - .65 * smooth(.25, .7, fill)) * (1 - .75 * dense);
    if (hitN && Math.random() < Math.min(.85, .15 + hitN / 40)){
      this.play(this.any(this.B.tick), .26 * quiet * Math.min(1, hitV / (V0 * 1.4)) + .015, .8 + Math.random() * .5, hitX / R * .7);
    }
    if (clinkN && Math.random() < Math.min(.6, .12 + clinkN / 30)){
      this.play(this.any(this.B.tick), .2 * quiet * Math.min(1, clinkV / (V0 * 1.4)) + .015, 1.35 + Math.random() * .4, clinkX / R * .7);
    }
  },
  synth(){
    const c = this.ctx, sr = c.sampleRate, rn = Math.random;
    const mk = (sec, fn, peak) => {
      const n = Math.max(1, Math.floor(sec * sr)), b = c.createBuffer(1, n, sr), d = b.getChannelData(0);
      fn(d, n); let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(d[i]));
      if (m > 0){ const g = (peak || .9) / m; for (let i = 0; i < n; i++) d[i] *= g; }
      const f = Math.min(n, Math.floor(sr * .004)); for (let i = 0; i < f; i++) d[n - 1 - i] *= i / f;
      return b;
    };
    // コツッ（玉どうし）
    this.B.tick = [0, 1, 2, 3, 4, 5].map(() => mk(.07, (d, n) => {
      const f1 = 850 + rn() * 900, f2 = f1 * (2.2 + rn() * .6); let lp = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = Math.sin(TAU * f1 * t) * Math.exp(-t / .011) * .8 + Math.sin(TAU * f2 * t) * Math.exp(-t / .005) * .35;
        if (t < .0025){ lp += ((rn() * 2 - 1) * (1 - t / .0025) - lp) * .5; v += lp * .5; }
        d[i] = v;
      }
    }, .8));
    // ポン（分かれる。音程をつけて鳴らす）
    this.B.pop = [0, 1, 2].map(() => mk(.3, (d, n) => {
      const f0 = 300 + rn() * 30, f1 = f0 * 2.02; let ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, f = f0 + (f1 - f0) * (1 - Math.exp(-t / .016)); ph += TAU * f / sr;
        d[i] = (Math.sin(ph) + .25 * Math.sin(2 * ph)) * Math.min(1, t / .002) * Math.exp(-t / .06);
      }
    }));
    // ガシャン（閉じる）
    this.B.clank = mk(1.1, (d, n) => {
      const P = [[390, .34, .5], [1040, .22, .34], [1730, .16, .26], [2620, .11, .18], [3510, .08, .12], [4890, .05, .08]];
      let lp = 0, ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        const ft = 42 + 80 * Math.exp(-t / .035); ph += TAU * ft / sr; v += Math.sin(ph) * Math.exp(-t / .17);
        for (const p of P) v += Math.sin(TAU * p[0] * t + p[0]) * Math.exp(-t / p[1]) * p[2];
        lp += ((rn() * 2 - 1) - lp) * .25; v += lp * Math.exp(-t / .02) * .9;
        d[i] = v * Math.min(1, t / .001);
      }
    });
    // カチッ（囲いこんだ）
    this.B.clack = mk(.13, (d, n) => {
      let hp = 0, prev = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, w = rn() * 2 - 1; hp = .9 * (hp + w - prev); prev = w;
        d[i] = hp * Math.exp(-t / .006) * .8 + Math.sin(TAU * 2150 * t) * Math.exp(-t / .018) * .5 + Math.sin(TAU * 3320 * t) * Math.exp(-t / .012) * .35;
      }
    });
    // シャキン（8 の字）
    this.B.snip = mk(.65, (d, n) => {
      const P = [[2280, .16, .4], [3460, .12, .32], [5120, .09, .22], [1210, .2, .25]]; let ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        for (const p of P) v += Math.sin(TAU * p[0] * t) * Math.exp(-t / p[1]) * p[2];
        v += (rn() * 2 - 1) * Math.exp(-t / .012) * .5;
        const ft = 70 + 60 * Math.exp(-t / .03); ph += TAU * ft / sr; v += Math.sin(ph) * Math.exp(-t / .09) * .6;
        d[i] = v;
      }
    });
    // ドーン（割れる）
    this.B.boom = mk(2.3, (d, n) => {
      let ph = 0, lp = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr, f = 28 + 40 * Math.exp(-t / .25); ph += TAU * f / sr;
        let v = Math.sin(ph) * Math.exp(-t / .7);
        lp += ((rn() * 2 - 1) - lp) * (.02 + .5 * Math.exp(-t / .35)); v += lp * Math.exp(-t / .9) * 1.2;
        d[i] = v * Math.min(1, t / .004);
      }
    });
    // パリン（円のかけら）
    this.B.shatter = mk(.9, (d, n) => {
      const P = []; for (let q = 0; q < 9; q++) P.push([2400 + rn() * 5200, .05 + rn() * .22, rn() * .5 + .2, rn() * .25]);
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        for (const p of P) if (t > p[3]) v += Math.sin(TAU * p[0] * (t - p[3])) * Math.exp(-(t - p[3]) / p[1]) * p[2];
        d[i] = v + (rn() * 2 - 1) * Math.exp(-t / .03) * .6;
      }
    }, .7);
    // ベチャ（食べる玉がはじける）
    this.B.splat = mk(.4, (d, n) => {
      let lp = 0, ph = 0;
      for (let i = 0; i < n; i++){
        const t = i / sr; lp += ((rn() * 2 - 1) - lp) * .18;
        const f = 70 + 130 * Math.exp(-t / .04); ph += TAU * f / sr;
        d[i] = lp * Math.exp(-t / .06) * 1.2 + Math.sin(ph) * Math.exp(-t / .1) * .8;
      }
    });
    // ジュッ（消し刃）
    this.B.sizzle = mk(.26, (d, n) => {
      let hp = 0, prev = 0;
      for (let i = 0; i < n; i++){ const t = i / sr, w = rn() * 2 - 1; hp = .82 * (hp + w - prev); prev = w; d[i] = hp * Math.min(1, t / .004) * Math.exp(-t / .07); }
    }, .7);
    // キラン（金色・合図）
    this.B.bell = mk(2.2, (d, n) => {
      const f = 1046.5, P = [[1, .9, 1], [2.76, .45, .5], [5.4, .25, .25], [8.93, .12, .12]];
      for (let i = 0; i < n; i++){
        const t = i / sr; let v = 0;
        for (const p of P) v += Math.sin(TAU * f * p[0] * t) * Math.exp(-t / p[1]) * p[2];
        d[i] = v * Math.min(1, t / .002);
      }
    }, .6);
    // ウィーン（仕掛けが動く音。くり返し）
    this.B.hum = mk(3, (d, n) => {
      let b = 0, lp = 0;
      for (let i = 0; i < n; i++){ const w = rn() * 2 - 1; b = (b + .02 * w) / 1.02; lp += (b - lp) * .08; d[i] = lp + Math.sin(TAU * 55 * i / sr) * .02; }
      const f = Math.floor(sr * .2); for (let i = 0; i < f; i++){ d[i] *= i / f; }
    }, .5);
    // 白い雑音（くり返し。粒の音・噴き出す音のもと）
    this.B.noise = mk(2.5, (d, n) => {
      for (let i = 0; i < n; i++) d[i] = rn() * 2 - 1;
      const f = Math.floor(sr * .05); for (let i = 0; i < f; i++){ const k = i / f; d[i] = d[i] * k + d[n - f + i] * (1 - k); }   // つなぎ目をならす
    }, .5);
  },
};
function showHint(){
  const h = $("#hint");
  h.hidden = !(AU.ctx && AU.ctx.state !== "running" && !SET.mute && SET.vol > 0);
}

/* ══════════════════════════════════════════════════════════════════
   操作（下の帯・設定の欄・キー）と、こまごとのくり返し
   ══════════════════════════════════════════════════════════════════ */
const ICON = {
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 010 7l-1.4-1.4a3 3 0 000-4.2zM18.5 6a8.5 8.5 0 010 12l-1.4-1.4a6.5 6.5 0 000-9.2z"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9.4l1.4-1.4 2.1 2.1 2.1-2.1L23 9.4 20.9 11.5 23 13.6l-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>',
};
let paused = Q.get("pause") === "1";   // ?pause=1 で止めた状態から始める（録画・試験用）
let restartTimer = 0;
function restartSoon(){ clearTimeout(restartTimer); restartTimer = setTimeout(nextRound, 500); }   // 続けていくつか変えても、作り直しは 1 回
function applyLive(key){
  if (key === "quality") HS = HS_Q[SET.quality] || 1 / 180;
  if (key === "crowd") GAMMA = GAMMAS[SET.crowd] || 0;
}
function buildPanel(){
  const pb = $("#presets");
  PRESETS.forEach(([name, vals], idx) => {
    const b = document.createElement("button"); b.textContent = name; b.dataset.i = idx;
    b.onclick = () => {
      for (const k of PRESET_KEYS) SET[k] = vals[k] !== undefined ? vals[k] : DEF[k];
      SET.pin = null; saveSet(); for (const k of LIVE) applyLive(k); syncUI(); nextRound();
    };
    pb.appendChild(b);
  });
  const box = $("#opts"); let sec = "";
  for (const [s, key, label, opts] of OPTS){
    if (s !== sec){ sec = s; const h = document.createElement("h3"); h.textContent = s; box.appendChild(h); }
    const row = document.createElement("div"); row.className = "row";
    const sp = document.createElement("span"); sp.textContent = label;
    const sel = document.createElement("select"); sel.id = "o_" + key;
    for (const [v, t] of opts){ const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); }
    sel.onchange = () => {
      sel.blur(); SET[key] = sel.value; saveSet();
      if (LIVE.has(key)) applyLive(key);
      else { if (SET.pin){ SET.pin = null; saveSet(); } restartSoon(); }
      syncUI();
    };
    row.appendChild(sp); row.appendChild(sel); box.appendChild(row);
  }
}
function syncUI(){
  $("#bPlay").innerHTML = paused ? ICON.play : ICON.pause;
  $("#bMute").innerHTML = SET.mute ? ICON.mute : ICON.snd;
  $("#bMute").classList.toggle("on", SET.mute);
  $("#sMech").value = MECHS[SET.mech] ? SET.mech : "auto";
  for (const o of OPTS){ const el = $("#o_" + o[1]); if (el && o[3].some(v => v[0] === SET[o[1]])) el.value = SET[o[1]]; }
  $("#cCount").checked = !!SET.count;
  $("#vol").value = SET.vol; $("#vol2").value = SET.vol;
  $("#ver").textContent = "ふえる玉 v" + VERSION;
  document.querySelectorAll("#presets button").forEach(b => {
    const vals = PRESETS[+b.dataset.i][1];
    b.classList.toggle("on", !SET.pin && PRESET_KEYS.every(k => SET[k] === (vals[k] !== undefined ? vals[k] : DEF[k])));
  });
  syncPin(); syncStats();
}
/* 気に入った組み合わせ（仕掛け・刃・玉の大きさ・分かれる数・減るもの）を固定する */
function syncPin(){
  $("#bPin").classList.toggle("on", !!SET.pin);
  const el = $("#pinrow");
  if (!RD || !rig){ el.textContent = ""; return; }
  el.innerHTML = "";
  const b = document.createElement("b"); b.textContent = SET.pin ? "固定中: " : "いまの回: ";
  el.appendChild(b);
  el.appendChild(document.createTextNode(recipeText(RD.rc) + (SET.pin ? "　（📌 か P で外す）" : "　（気に入ったら 📌 か P で固定）")));
}
function togglePin(){
  SET.pin = SET.pin ? null : Object.assign({}, RD.rc);
  saveSet(); syncUI();
  showLabel(SET.pin ? "この組み合わせを固定しました" : "固定を外しました");
}
function syncStats(){
  const el = $("#stats"); if (!el) return;
  el.innerHTML = "";
  const line = (parts) => { const d = document.createElement("div"); for (const p of parts){ if (p.b){ const b = document.createElement("b"); b.textContent = p.b; d.appendChild(b); } else d.appendChild(document.createTextNode(p)); } el.appendChild(d); };
  line(["見た回数 ", { b: NF.format(REC.rounds) }, "　いちばん多かった玉 ", { b: NF.format(REC.maxN) }, " 個"]);
  for (const k of Object.keys(FOE_NAMES)){
    const w = REC.win[k] || 0, l = REC.lose[k] || 0;
    if (w + l) line([FOE_NAMES[k] + " と ", { b: String(w) }, " 勝 ", { b: String(l) }, " 敗"]);
  }
}
function togglePause(){ paused = !paused; syncUI(); if (paused) showLabel("一時停止中", true); else labelEl.classList.remove("show"); }
function nextRound(){ clearTimeout(restartTimer); paused = false; newRound(); syncUI(); }
function toggleMute(){ SET.mute = !SET.mute; saveSet(); AU.resume(); AU.setVol(); syncUI(); showHint(); }
function setVol(v){ SET.vol = clamp(Math.round(v), 0, 100); if (SET.vol > 0) SET.mute = false; saveSet(); AU.resume(); AU.setVol(); syncUI(); showHint(); }
function setMech(m){ SET.mech = m; SET.pin = null; saveSet(); nextRound(); }
function toggleFull(){
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e){}
}
$("#bPlay").onclick = togglePause;
$("#bNext").onclick = nextRound;
$("#bPin").onclick = togglePin;
$("#bMute").onclick = toggleMute;
$("#bFull").onclick = toggleFull;
$("#bSet").onclick = () => { $("#panel").hidden = !$("#panel").hidden; $("#bSet").classList.toggle("on", !$("#panel").hidden); if (!$("#panel").hidden){ placePanel(); syncUI(); } };
$("#vol").oninput = e => setVol(+e.target.value);
$("#vol2").oninput = e => setVol(+e.target.value);
$("#sMech").onchange = e => { e.target.blur(); setMech(e.target.value); };
$("#cCount").onchange = e => { SET.count = e.target.checked; saveSet(); layout(); };
cv.addEventListener("dblclick", toggleFull);
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "SELECT" || (tag === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox")) return;
  const k = e.key;
  if (k === " "){ togglePause(); e.preventDefault(); }
  else if (k === "n" || k === "N" || k === "ArrowRight"){ nextRound(); }
  else if (k === "f" || k === "F"){ toggleFull(); }
  else if (k === "m" || k === "M"){ toggleMute(); }
  else if (k === "p" || k === "P"){ togglePin(); }
  else if (k === "ArrowUp"){ setVol(SET.vol + 10); e.preventDefault(); }
  else if (k === "ArrowDown"){ setVol(SET.vol - 10); e.preventDefault(); }
  else if (k === "0"){ setMech("auto"); }
  else if (k >= "1" && k <= "3"){ setMech(MECH_KEYS[+k - 1]); }
  else if (k === "c" || k === "C"){ SET.count = !SET.count; saveSet(); syncUI(); layout(); }
  poke();
});
/* しばらく触らなければ、操作の帯とマウスの矢印を隠す */
let idleTimer = 0, overBar = false;
function poke(){
  $("#bar").classList.remove("hide"); document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (overBar || !$("#panel").hidden) return poke();
    $("#bar").classList.add("hide"); document.body.classList.add("idle");
  }, 2800);
}
for (const ev of ["pointermove", "pointerdown", "touchstart"]) addEventListener(ev, poke, { passive: true });
for (const ev of ["pointerdown", "keydown", "touchend"]) addEventListener(ev, () => AU.resume(), { passive: true });
$("#bar").addEventListener("pointerenter", () => { overBar = true; });
$("#bar").addEventListener("pointerleave", () => { overBar = false; });
cv.addEventListener("pointerdown", () => { if (!$("#panel").hidden){ $("#panel").hidden = true; $("#bSet").classList.remove("on"); } });

/* ── くり返し ── */
let last = performance.now(), physAvg = 0, fps = 60, fpsN = 0, fpsT = last;
function frame(now){
  requestAnimationFrame(frame);
  try {
    let dt = (now - last) / 1000; last = now;
    if (dt > .1) dt = .1;
    if (dt < 0) dt = 0;
    fpsN++; if (now - fpsT > 1000){ fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
    hitN = 0; hitV = 0; clinkN = 0; clinkV = 0;
    if (!paused){
      const t0 = performance.now();
      advance(dt * +SET.speed);
      physAvg = physAvg * .95 + (performance.now() - t0) * .05;
      // 重いときは、1 こまの歩数を減らす（設定の細かさより細かくはしない）
      const base = HS_Q[SET.quality] || 1 / 180;
      if (physAvg > 30 && HS < 1 / 61) HS = 1 / 60;
      else if (physAvg > 22 && HS < 1 / 91) HS = 1 / 90;
      else if (physAvg > 12 && HS < 1 / 121) HS = 1 / 120;
      else if (physAvg < 5 && HS > base) HS = base;
      AU.frame(lastFill, rig.motion(), dt, FOE && FOE.spray ? FOE.spray : 0);
    } else if (AU.ready) AU.frame(lastFill, 0, dt, 0);
    render();
  } catch (err){ console.error(err); }
}

/* 試験用（画面を描かずに速く進める・様子を数で見る・音を録る） */
window.FT = {
  version: VERSION,
  state(){ return { N, M, phase: RD.phase, mech: RD.mk, nb: rig.NB || rig.NL || 0, shape: rig.shape || "", size: RD.sz, k: RD.k,
                    cap: RD.cap, target: RD.target, gold: RD.gold, foe: RD.foe, foeOn: RD.foeOn, foeDone: RD.foeDone, foeLv: RD.foeLv, result: RD.result,
                    t: +RD.t.toFixed(2), T: +T.toFixed(2), epoch: RD.epoch, peak: RD.peak, rounds: STAT.rounds, doomed: doomedN,
                    crush: STAT.crush, erased: STAT.erased, eaten: STAT.eaten, drained: STAT.drained, expired: STAT.expired, spilled: STAT.spilled, ghost: STAT.ghost,
                    born: RD.born, gone: RD.gone, fhat: +RD.fhat.toFixed(3), foeInfo: FOE && FOE.info ? FOE.info() : null,
                    rc: +RC.toFixed(3), rv: +RV.toFixed(3), rad, fps: Math.round(fps), physMs: +physAvg.toFixed(2), hs: Math.round(1 / HS), gl: GLR.ok,
                    paused, mute: SET.mute, vol: SET.vol, setMech: SET.mech, pin: !!SET.pin, label: labelEl.textContent, fight: fightText }; },
  run(sec){ const n = Math.round(sec * 60); for (let i = 0; i < n; i++){ hitN = 0; clinkN = 0; advance(1 / 60); } return this.state(); },
  next(){ newRound(); return this.state(); },
  pause(v){ paused = !!v; syncUI(); },
  /* 音を ms ミリ秒だけ録って、webm を base64 で返す（?rec=1 のときだけ） */
  rec(ms){
    return new Promise((res, rej) => {
      if (!AU.dest) return rej(new Error("?rec=1 で開いてください"));
      const mr = new MediaRecorder(AU.dest.stream), chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(new Blob(chunks, { type: mr.mimeType })); };
      mr.start(); setTimeout(() => mr.stop(), ms);
    });
  },
};

buildPanel();
layout();
if (Q.get("gl") !== "0") GLR.init(Q.get("gl") === "1");
newRound();
syncUI();
AU.init();
showHint();
poke();
addEventListener("resize", layout);
requestAnimationFrame(frame);
</script>
</body>
