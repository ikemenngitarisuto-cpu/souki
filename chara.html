<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>想起 — キャラ帳</title>
<link rel="icon" href="/icon/chara.png">
<style>
:root{
  --ink:#0D141C; --panel:#141E28; --raise:#1C2A37; --sunk:#0A1119;
  --rule:#29394A; --rule-soft:#1E2C3A;
  --text:#D3DCE5; --dim:#78899A; --faint:#4E5F70;
  --lamp:#E9A23B; --lamp-deep:#B87A20;
  --live:#46C9B4; --live-deep:#2B8F80; --fault:#DE6B6B; --warn:#E9A23B;
  --sans:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","BIZ UDGothic",ui-monospace,monospace;
  --tile:112px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;
  line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sunk)}
::-webkit-scrollbar-thumb{background:var(--rule);border:2px solid var(--sunk);border-radius:6px}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.plate{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center;gap:9px;user-select:none}
.plate::after{content:"";flex:1;height:1px;background:var(--rule-soft)}
.plate.bare::after{display:none}

/* ── 骨格 ─────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh}
#top{height:48px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--rule)}
#brand{display:flex;align-items:center;gap:9px;flex:none;text-decoration:none}
#brand img{width:22px;height:22px}
#brand b{font-size:16px;letter-spacing:.2em;font-weight:700}
#brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--faint)}
#nav{display:flex;gap:2px;flex:none}
#nav a{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:3px;
  color:var(--dim);text-decoration:none;font-size:12.5px;border:1px solid transparent}
#nav a:hover{color:var(--text);background:var(--raise)}
#nav a.on{color:var(--text);background:var(--raise);border-color:var(--rule)}
#nav .n{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:0}
#nav .n.hot{color:#1A1206;background:var(--lamp);border-radius:8px;padding:0 6px}
#spacer{flex:1}
#jobs{display:flex;align-items:center;gap:9px;min-width:0;font-family:var(--mono);
  font-size:10.5px;color:var(--dim)}
#jobs .jt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.pbar{width:120px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;flex:none;
  border:1px solid var(--rule-soft)}
.pbar i{display:block;height:100%;background:var(--lamp);width:0;transition:width .3s}
.lamp{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.lamp.ok{background:var(--live);box-shadow:0 0 7px rgba(70,201,180,.6)}
.lamp.busy{background:var(--lamp);box-shadow:0 0 7px rgba(233,162,59,.6);animation:blink 1.1s ease-in-out infinite}
.lamp.fault{background:var(--fault)}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.tool{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;padding:5px 10px;background:var(--sunk);
  flex:none;text-decoration:none;white-space:nowrap}
.tool:hover:not(:disabled){border-color:var(--faint);color:var(--text)}
.tool.on{border-color:var(--lamp-deep);color:var(--lamp);background:#231A0C}
#undo{max-width:260px;overflow:hidden;text-overflow:ellipsis}
#banner{display:none;flex:none;padding:9px 16px;background:#3A1E1E;border-bottom:1px solid #6A3030;
  color:#F2C2C2;font-size:12.5px}
#banner.on{display:block}
#banner.info{background:#1E2E2A;border-color:#2F5A52;color:#BFE9E0}
#view{flex:1;overflow-y:auto;min-height:0;position:relative}
.page{max-width:1480px;margin:0 auto;padding:18px 22px 60px}

/* ── 共通部品 ─────────────────────────── */
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--dim);font-size:12px}
.lead{color:var(--dim);font-size:12.5px;margin:0 0 14px;max-width:880px}
.btn{padding:7px 14px;border-radius:3px;font-size:12.5px;font-weight:700;letter-spacing:.04em;
  background:var(--raise);border:1px solid var(--rule);color:var(--text);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1A1206}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.good{background:var(--live);border-color:var(--live);color:#06201C}
.btn.good:hover:not(:disabled){filter:brightness(1.1)}
.btn.bad{background:transparent;border-color:#6A3030;color:#F0A0A0}
.btn.bad:hover:not(:disabled){background:#2A1616}
.btn.ghost{background:transparent;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--raise);
  border:1px solid var(--rule-soft);border-radius:3px;padding:1px 7px;color:var(--dim);white-space:nowrap}
.chip.lora{border-color:#3C3350;color:#C7B8EE}
.chip.warn{border-color:#5A4420;color:var(--lamp)}
.chip.good{border-color:#245A50;color:var(--live)}
.chip.strong{color:var(--text);border-color:var(--rule);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.card{background:var(--panel);border:1px solid var(--rule-soft);border-radius:5px}
.box{background:var(--panel);border:1px solid var(--rule-soft);border-radius:5px;padding:16px 18px;
  margin-bottom:14px}
#view.loading{cursor:progress}
#view.loading > .page{opacity:.4;pointer-events:none;transition:opacity .15s .2s}
.outfitbox .orow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.outfitbox .orow .ow{flex:1;color:var(--dim);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outfitbox .hint{margin-top:6px}
.leftnote{border-left:3px solid var(--live);margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.leftnote .d{flex:1 1 420px;color:var(--dim);font-size:12px}
.leftnote[hidden]{display:none}
.box h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:9px}
.box h3 .st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:1px 7px;border-radius:3px;
  background:var(--sunk);border:1px solid var(--rule);color:var(--faint)}
.box h3 .st.done{color:var(--live);border-color:#245A50}
.box h3 .st.now{color:var(--lamp);border-color:var(--lamp-deep)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv dt{color:var(--faint);font-family:var(--mono);font-size:10.5px;padding-top:2px}
.kv dd{margin:0}
.num{font-family:var(--mono)}
.muted{color:var(--faint)}
.empty{padding:60px 20px;text-align:center;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.txt,select.txt,textarea.txt{background:var(--sunk);border:1px solid var(--rule);border-radius:3px;
  padding:6px 9px;font-size:13px;min-width:0}
input.txt:focus,textarea.txt:focus{border-color:var(--lamp-deep);outline:none}
.hint{font-size:11.5px;color:var(--faint)}
.warnline{color:var(--lamp)}
.badline{color:#F0A0A0}

/* ── 顔の並び ─────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:6px;
  position:relative;user-select:none;padding:2px}
.face{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--sunk);
  border:1px solid var(--rule-soft);cursor:pointer}
.face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.face:hover{border-color:var(--faint)}
.face .tagl{position:absolute;left:3px;bottom:3px;font-family:var(--mono);font-size:9px;
  letter-spacing:.02em;background:rgba(10,17,25,.84);color:var(--dim);padding:0 4px;border-radius:2px;
  max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .tagr{position:absolute;right:3px;top:3px;font-family:var(--mono);font-size:9px;
  background:rgba(10,17,25,.84);color:var(--faint);padding:0 4px;border-radius:2px}
.face.x{border-color:var(--fault)}
.face.x::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--tile)*.55);line-height:1;color:#FFD0D0;background:rgba(120,20,20,.55);
  text-shadow:0 2px 8px rgba(0,0,0,.6);font-family:var(--sans)}
.face.s{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp) inset}
.face.s::before{content:"✓";position:absolute;right:4px;bottom:3px;z-index:2;width:18px;height:18px;
  border-radius:50%;background:var(--lamp);color:#1A1206;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.face.seed{box-shadow:0 0 0 2px var(--live) inset;border-color:var(--live)}
.face.gone{opacity:.25;pointer-events:none}
.marquee{position:absolute;border:1px dashed var(--lamp);background:rgba(233,162,59,.08);
  pointer-events:none;z-index:5}
.more{margin:14px 0 4px;text-align:center}

/* 操作の帯（下に固定） */
.actbar{position:sticky;bottom:0;z-index:20;margin-top:14px;background:var(--raise);
  border:1px solid var(--rule);border-radius:5px;padding:10px 12px;display:flex;gap:9px;align-items:center;
  flex-wrap:wrap;box-shadow:0 -10px 24px rgba(0,0,0,.35)}
.actbar .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);margin-right:4px}
.actbar .cnt b{color:var(--text)}
.actbar .sep{width:1px;height:22px;background:var(--rule)}

/* ── 候補・キャラの札 ─────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--rule-soft);border-radius:5px;overflow:hidden;
  cursor:pointer;text-decoration:none;display:block;transition:border-color .12s,transform .12s}
.pcard:hover{border-color:var(--faint);transform:translateY(-2px)}
.pcard .cov{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--sunk)}
.pcard .cov img,.pcard .cov i{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk)}
.pcard .body{padding:9px 11px 11px}
.pcard .t{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.pcard .t b{font-size:14px}
.pcard .t .num{font-size:11px;color:var(--dim)}
.counts{display:flex;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex-wrap:wrap}
.counts .hot{color:var(--lamp)}
.counts .warn{color:#F0A0A0}

/* ── タブ ─────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:14px 0 12px;flex-wrap:wrap}
.tabs a{padding:7px 13px;color:var(--dim);text-decoration:none;border:1px solid transparent;
  border-bottom:none;border-radius:4px 4px 0 0;font-size:12.5px;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--text);background:var(--panel);border-color:var(--rule)}
.tabs .num{font-size:10.5px;color:var(--faint);margin-left:4px}
.toolrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{padding:4px 10px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  background:var(--sunk);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--lamp);color:#1A1206;font-weight:700}

/* 確認待ちのまとまり */
.rgroup{margin-bottom:22px}
.rgroup .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.rgroup .rh b{font-size:14px}
.reasons{display:flex;gap:5px;flex-wrap:wrap}

/* ── 詳細の引き出し ───────────────────── */
#drawer{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--panel);
  border-left:1px solid var(--rule);z-index:40;transform:translateX(100%);transition:transform .16s ease-out;
  display:flex;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.4)}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--rule)}
#drawer .dh .fn{flex:1;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .db{flex:1;overflow-y:auto;padding:14px}
#dimg{position:relative;background:var(--sunk);border:1px solid var(--rule-soft);border-radius:4px;
  margin-bottom:12px;cursor:zoom-in}
#dimg img{width:100%;display:block}
#dimg .hb{position:absolute;border:2px solid var(--lamp);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.dsec{margin-bottom:14px}
.dsec .plate{margin-bottom:6px}

/* ── 小窓 ─────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(6,10,14,.72);z-index:70;display:none;
  align-items:flex-start;justify-content:center;padding-top:14vh}
#modal.open{display:flex}
#modal .mb{background:var(--panel);border:1px solid var(--rule);border-radius:6px;width:min(480px,92vw);
  padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
#modal h4{margin:0 0 6px;font-size:14px}
#modal .mt{color:var(--dim);font-size:12.5px;margin-bottom:12px;white-space:pre-wrap}
#modal .mf{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
#modal .mbtns{display:flex;justify-content:flex-end;gap:8px}
.namelist{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow-y:auto}
.namelist button{font-size:12px;padding:2px 9px;border:1px solid var(--rule);border-radius:3px;
  background:var(--sunk);color:var(--dim)}
.namelist button:hover{color:var(--text);border-color:var(--faint)}

#lightbox{position:fixed;inset:0;background:rgba(6,10,14,.95);z-index:80;display:none;
  align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{background:var(--raise);border:1px solid var(--rule);border-left:3px solid var(--lamp);
  border-radius:3px;padding:9px 13px;font-size:12px;max-width:560px;display:flex;gap:12px;align-items:center;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--fault)}
.toast.good{border-left-color:var(--live)}
.toast .d{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px;white-space:pre-wrap;
  word-break:break-word;max-height:140px;overflow-y:auto}
.toast button{font-family:var(--mono);font-size:10.5px;color:var(--lamp);border:1px solid var(--lamp-deep);
  border-radius:3px;padding:2px 8px;flex:none}

table.t{border-collapse:collapse;font-size:12px;width:100%}
table.t th,table.t td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--rule-soft)}
table.t th{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:400;letter-spacing:.06em}
table.t td.num{font-family:var(--mono)}
.devs label{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--rule-soft);
  border-radius:4px;margin-bottom:6px;cursor:pointer}
.devs label.off{opacity:.55}
.devs label:hover{border-color:var(--rule)}
.devs .dn{flex:1}
.sample{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-top:10px}
.sample img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:var(--sunk)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.step{padding:10px 12px;border:1px solid var(--rule-soft);border-radius:5px;background:var(--panel)}
.step .k{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.12em}
.step .v{font-size:12.5px;margin-top:2px}
.step.done{border-color:#245A50}
.step.done .k{color:var(--live)}
.step.now{border-color:var(--lamp-deep)}
.step.now .k{color:var(--lamp)}
/* ── 顔の一覧（ページ・かたまり） ───── */
.fb{margin-top:4px}
.fbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pager{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pager:empty{display:none}
.pager .pg{width:66px;text-align:center;padding:4px 6px}
.fbbody{position:relative;user-select:none;min-height:80px}
.gsep{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 2px 3px;font-family:var(--mono);
  font-size:10.5px;color:var(--faint);border-top:1px solid var(--rule)}
.gsep.on{color:#F0A0A0}
.glist{display:flex;flex-direction:column;gap:6px}
.grow{background:var(--panel);border:1px solid var(--rule-soft);border-radius:5px;padding:7px 9px}
.grow.x.on{border-color:var(--fault);background:#2A1618}
.grow.s.on{border-color:var(--lamp);background:#231A0C}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.gh .num{font-family:var(--mono);font-size:11px;color:var(--dim)}
.gmark{font-size:12px;font-weight:700;padding:3px 12px;border-radius:3px;border:1px solid var(--rule);background:var(--sunk);color:var(--dim)}
.gmark:hover{border-color:var(--faint);color:var(--text)}
.grow.x.on .gmark{background:var(--fault);border-color:var(--fault);color:#fff}
.grow.s.on .gmark{background:var(--lamp);border-color:var(--lamp);color:#1A1206}
.gstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tile) * .7),1fr));gap:4px}
.gstrip .face.x::after{font-size:calc(var(--tile) * .4)}
.repstrip{display:flex;gap:4px;align-items:center;overflow:hidden;margin:8px 0 10px}
.repstrip .plate{margin-right:6px;flex:none}
.repstrip img{width:58px;height:58px;object-fit:cover;border-radius:4px;flex:none;background:var(--sunk)}
.seg button:disabled{opacity:.35}
.seg.scope button{font-family:var(--sans);font-size:11.5px}
@media (max-width:1000px){
  #brand span,#jobs .jt{display:none}
  .steps{grid-template-columns:repeat(2,1fr)}
  #drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a id="brand" href="#/"><img src="/icon/chara.png" alt=""><b>想起</b><span>CHARACTERS</span></a>
    <nav id="nav">
      <a href="#/analysis" data-r="analysis">解析</a>
      <a href="#/proposals" data-r="proposals">候補 <span class="n" id="n-prop"></span></a>
      <a href="#/chars" data-r="chars">キャラ <span class="n" id="n-char"></span></a>
      <a href="#/review" data-r="review">確認待ち <span class="n" id="n-rev"></span></a>
      <a href="#/unassigned" data-r="unassigned">未分類 <span class="n" id="n-un"></span></a>
      <a href="#/settings" data-r="settings">設定</a>
    </nav>
    <div id="spacer"></div>
    <div id="jobs"></div>
    <button class="tool" id="undo" disabled title="直前の操作を取り消す（Ctrl+Z）">↶ 取り消す</button>
    <a class="tool" href="/" title="台帳（画像一覧）へ">台帳へ</a>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<aside id="drawer" aria-hidden="true">
  <div class="dh"><span class="fn" id="dfn"></span><button class="tool" id="dclose">閉じる</button></div>
  <div class="db" id="dbody"></div>
</aside>
<div id="modal"><div class="mb" id="mbox"></div></div>
<div id="lightbox"><img id="lbimg" alt=""></div>
<div id="toasts"></div>

<script>
"use strict";
/* 専用の窓: 開いていることをサーバに知らせる（窓を閉じたら想起も終わる） */
function alive(){
  const g = {x: window.screenX, y: window.screenY, w: window.outerWidth, h: window.outerHeight};
  fetch("/api/alive", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(g), keepalive: true}).catch(()=>{});
}
alive(); setInterval(alive, 5000);
window.addEventListener("pagehide", () => { try{ navigator.sendBeacon("/api/bye", ""); }catch(e){} });

const PAGE_VERSION = "2.5.0";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmt = n => (n == null ? "—" : Number(n).toLocaleString());

/* ── 通信 ─────────────────────────────── */
async function api(path, opts){
  const r = await fetch(path, opts);
  const t = await r.text();
  let d;
  try{ d = JSON.parse(t); }catch(e){ throw new Error(t.slice(0, 300) || ("HTTP " + r.status)); }
  if(!r.ok && d && d.error) throw new Error(d.error);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return d;
}
const post = (path, body) => api(path, {method:"POST", headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify(body || {})});

function toast(msg, kind, detail, ms, action){
  const t = el("div", "toast" + (kind ? " " + kind : ""));
  const box = el("div"); box.appendChild(el("div", null, msg));
  if(detail) box.appendChild(el("div", "d", detail));
  t.appendChild(box);
  if(action){
    const b = el("button", null, action.label);
    b.onclick = () => { t.remove(); action.fn(); };
    t.appendChild(b);
  }
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), ms || 4200);
}
function fail(e, what){ toast((what || "失敗しました"), "bad", String(e && e.message || e), 8000); }

function fmtDur(s){
  if(s == null) return "";
  s = Math.round(s);
  if(s < 60) return `${s} 秒`;
  if(s < 3600) return `${Math.round(s/60)} 分`;
  const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  return `${h} 時間 ${m} 分`;
}
function headSrc(f){ return `/head/${f.instance_id}` + (f.image_id != null ? `?i=${f.image_id}` : ""); }

/* ── 状態 ─────────────────────────────── */
const S = {
  st: null, chars: [], props: null, jobs: null,
  gen: -1, engineFinished: null, analysisRunning: false,
  view: null, dirty: false, lastAction: null,
};
let tileSize = 112;
try{ tileSize = +localStorage.getItem("souki.tile") || 112; }catch(e){}
document.documentElement.style.setProperty("--tile", tileSize + "px");

async function loadStatus(){
  try{ S.st = await api("/api/chara/status"); }
  catch(e){ S.st = {available:false, error:String(e.message||e)}; }
  paintNav();
  return S.st;
}
async function loadChars(){
  try{ S.chars = (await api("/api/chara/characters")).characters || []; }catch(e){ S.chars = []; }
  return S.chars;
}
async function refreshCounts(){
  try{ S.counts = await api("/api/chara/counts"); }catch(e){ return; }
  if(S.st) Object.assign(S.st, S.counts);
  paintNav();
}
function paintNav(){
  const st = Object.assign({}, S.st || {}, S.counts || {});
  const set = (id, n, hot) => { const e = $(id); e.textContent = n ? fmt(n) : ""; e.classList.toggle("hot", !!hot && n > 0); };
  set("#n-prop", st.proposals, false);
  set("#n-char", st.characters, false);
  set("#n-rev", st.review, true);
  set("#n-un", st.unassigned, false);
}

/* ── 版の確認 ─────────────────────────── */
async function checkVersion(){
  const b = $("#banner");
  try{
    const v = await api("/api/version");
    const msgs = [];
    if(v.version !== PAGE_VERSION)
      msgs.push(`画面（${PAGE_VERSION}）とサーバ（${v.version}）の版が違います。想起の窓を閉じてから 起動.bat を開き直し、Ctrl+F5 を押してください。`);
    if(v.chara_error)
      msgs.push(`キャラ判定の部品を読み込めませんでした: ${v.chara_error}　— 起動.bat から起動してください。`);
    else if(v.chara && v.chara !== v.version)
      msgs.push(`chara.py（${v.chara}）と souki.py（${v.version}）の版が違います。ファイルの差し替え漏れがないか確認してください。`);
    b.textContent = msgs.join("　");
    b.classList.toggle("on", msgs.length > 0);
  }catch(e){
    b.textContent = "サーバに接続できません。起動.bat の窓が開いているか確認してください。";
    b.classList.add("on");
  }
}

/* ── 裏の仕事の表示 ───────────────────── */
const JOBNAME = {setup:"準備", preview:"試運転", analyze:"解析", variant:"見方の切り替え", selftest:"GPU の試験",
                 classify:"判定"};
async function pollJobs(){
  let j;
  try{ j = await api("/api/chara/jobs"); }catch(e){ return schedulePoll(5000); }
  S.jobs = j;
  const box = $("#jobs"); box.innerHTML = "";
  if(j.available){
    const a = j.analysis, g = j.engine;
    if(a.running){
      const pct = a.total ? Math.floor(a.done / a.total * 100) : 0;
      box.appendChild(el("span", "lamp busy"));
      const name = JOBNAME[a.kind] || a.kind || "";
      const stage = a.stage && a.stage !== name ? a.stage : "";
      const big = a.kind === "setup" && a.total > 100000;      // 取得中はバイト数
      const cnt = !a.total ? "" : big ? `${(a.done / 1e6).toFixed(0)}/${(a.total / 1e6).toFixed(0)} MB`
                                      : `${fmt(a.done)}/${fmt(a.total)}`;
      const t = el("span", "jt", `${name}${stage ? "（" + stage + "）" : ""}　${cnt}`
                               + (a.eta_s != null ? `　残り ${fmtDur(a.eta_s)}` : ""));
      box.appendChild(t);
      const bar = el("span", "pbar"); const i = el("i"); i.style.width = pct + "%"; bar.appendChild(i);
      box.appendChild(bar);
      if(["preview","analyze","variant"].includes(a.kind)){
        const s = el("button", "tool", "止める");
        s.onclick = async () => { s.disabled = true; try{ await post("/api/chara/job", {kind:"stop"}); toast("区切りのよいところで止めます"); }catch(e){ fail(e); } };
        box.appendChild(s);
      }
    }else if(g.running){
      box.appendChild(el("span", "lamp busy"));
      box.appendChild(el("span", "jt", `判定中 ${g.stage || ""}`));
    }else if(j.index && j.index.running){
      box.appendChild(el("span", "lamp busy"));
      box.appendChild(el("span", "jt", `台帳を更新中 ${j.index.total ? `${fmt(j.index.done)}/${fmt(j.index.total)}` : ""}`));
    }
    // 終わった仕事の知らせ
    if(S.analysisRunning && !a.running){
      onAnalysisDone(a);
    }
    S.analysisRunning = a.running;
    if(S.engineFinished === null) S.engineFinished = g.finished || 0;
    else if(!g.running && g.finished && g.finished !== S.engineFinished){
      S.engineFinished = g.finished;
      onEngineDone(g);
    }
    // 取り消しボタン
    const la = j.last_action;
    const u = $("#undo");
    u.disabled = !la;
    u.textContent = la ? `↶ 取り消す` : "↶ 取り消す";
    u.title = la ? `直前の操作を取り消す（Ctrl+Z）\n${la.label}` : "取り消せる操作はありません";
    S.lastAction = la;
  }
  const busy = j.available && (j.analysis.running || j.engine.running || (j.index && j.index.running));
  schedulePoll(busy ? 1200 : 4000);
}
let pollTimer = null;
function schedulePoll(ms){ clearTimeout(pollTimer); pollTimer = setTimeout(pollJobs, ms); }

async function onAnalysisDone(a){
  const last = a.last || {};
  if(last.error){ toast(`${JOBNAME[last.kind]||last.kind}に失敗しました`, "bad", last.error, 12000); }
  else if(last.kind !== "setup" && last.result && last.result.error){
    toast(`${JOBNAME[last.kind]||last.kind}ができませんでした`, "bad", last.result.error, 12000);
  }
  else if(last.kind === "setup"){
    const r = last.result || {};
    if(r.ok) toast("準備ができました", "good", r.selftest ? `解析に使う装置: ${devLabel(r.selftest.device)}` : "");
    else toast("準備が終わりませんでした", "bad", r.error || "", 12000);
  }else if(last.kind === "preview"){ toast("試運転が終わりました", "good"); }
  else if(last.kind === "analyze"){
    const r = last.result || {};
    toast(r.stopped ? "解析を止めました（続きはもう一度押すと再開します）" : "解析が終わりました", "good",
          r.done != null ? `処理 ${fmt(r.done)} 枚` : "");
  }else if(last.kind === "selftest"){ toast("GPU の試験が終わりました", "good"); }
  await loadStatus();
  if(["analysis","settings"].includes(S.view)) render();
}
async function onEngineDone(g){
  await refreshCounts();
  const last = g.last || {};
  if(last.error){ toast("判定に失敗しました", "bad", last.error, 12000); return; }
  const res = last.result || {};
  if(res.classify && res.classify.written === 0 && !res.proposals && !res.groups_filled) return;   // 何も変わっていない
  // 顔の一覧（何千枚もある画面）は勝手に読み直さない。見ているページや印が消えないように。
  if(["proposals", "chars", "review"].includes(S.view) && !S.dirty) render(true);
  else showStale();
}
function showStale(){
  const h = document.querySelector(".stale");
  if(h) h.style.display = "inline-flex";
}

/* ── 取り消し ─────────────────────────── */
async function undo(){
  if(!S.lastAction) return;
  try{
    const r = await post("/api/chara/undo");
    if(r.ok){ toast(`取り消しました: ${r.undone}`, "good"); S.dirty = false; await refreshCounts(); render(true); pollJobs(); }
    else toast(r.error || "取り消せませんでした", "bad");
  }catch(e){ fail(e, "取り消せませんでした"); }
}
$("#undo").onclick = undo;

/* 操作を送る。成功したら取り消しの知らせを出す。 */
async function act(body){
  try{
    const r = await post("/api/chara/action", body);
    if(!r.ok){ toast(r.error || "できませんでした", "bad"); return null; }
    toast(r.label || "しました", "good", null, 6500, {label:"取り消す", fn:undo});
    S.dirty = false;
    pollJobs();
    refreshCounts();
    return r;
  }catch(e){ fail(e); return null; }
}

/* ── 小窓 ─────────────────────────────── */
function modal(build){
  return new Promise(res => {
    const m = $("#modal"), box = $("#mbox");
    box.innerHTML = "";
    const done = v => { m.classList.remove("open"); document.removeEventListener("keydown", key); res(v); };
    const key = e => { if(e.key === "Escape"){ e.preventDefault(); done(null); } };
    document.addEventListener("keydown", key);
    build(box, done);
    m.classList.add("open");
    m.onclick = e => { if(e.target === m) done(null); };
    const f = box.querySelector("input,select,button.primary,button.good,button.bad");
    if(f) setTimeout(() => f.focus(), 30);
  });
}
function confirmBox(title, text, okLabel, danger){
  return modal((box, done) => {
    box.appendChild(el("h4", null, title));
    if(text) box.appendChild(el("div", "mt", text));
    const bs = el("div", "mbtns");
    const c = el("button", "btn ghost", "やめる"); c.onclick = () => done(false);
    const ok = el("button", "btn " + (danger ? "bad" : "primary"), okLabel || "はい"); ok.onclick = () => done(true);
    bs.append(c, ok); box.appendChild(bs);
  });
}
/* 名前を選ぶ（新しい名前も入れられる） */
async function pickName(title, text, opts){
  opts = opts || {};
  if(!S.chars.length) await loadChars();
  return modal((box, done) => {
    box.appendChild(el("h4", null, title));
    if(text) box.appendChild(el("div", "mt", text));
    const f = el("div", "mf");
    const inp = el("input", "txt"); inp.placeholder = opts.placeholder || "キャラの名前（新しい名前でもよい）";
    inp.setAttribute("list", "namelist-dl");
    const dl = el("datalist"); dl.id = "namelist-dl";
    const others = S.chars.filter(c => c.id !== opts.exclude);
    for(const c of others){ const o = el("option"); o.value = c.name; dl.appendChild(o); }
    f.append(inp, dl);
    if(others.length){
      const nl = el("div", "namelist");
      for(const c of others.slice(0, 60)){
        const b = el("button", null, c.name);
        b.onclick = () => { inp.value = c.name; inp.focus(); };
        nl.appendChild(b);
      }
      f.appendChild(nl);
    }
    box.appendChild(f);
    const bs = el("div", "mbtns");
    const c = el("button", "btn ghost", "やめる"); c.onclick = () => done(null);
    const ok = el("button", "btn primary", opts.ok || "決める");
    const go = () => { const v = inp.value.trim(); if(v) done(v); else inp.focus(); };
    ok.onclick = go;
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); go(); } });
    bs.append(c, ok); box.appendChild(bs);
    if(opts.value) inp.value = opts.value;
  });
}
function charByName(name){ return S.chars.find(c => c.name === name); }

/* ── 顔の一覧（ページ・並べ替え・かたまり・どこからでもドラッグで囲む） ──
   何万枚もの候補を扱うための部品。印（× または 選択）はページをまたいで覚える。
   ・クリックで印、Shift+クリックで範囲
   ・ドラッグで囲む（顔の上からでも始められる。Alt を押しながらだと印を外す）
     囲みながら画面の上下の端へ寄せると、自動で送る
   ・かたまり表示: 似た顔のかたまりごとに見本を並べ、かたまりごと印を付けられる */
const PAGE_SIZES = [100, 300, 600, 1000];
function pref(k, d){ try{ const v = localStorage.getItem("souki." + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function setPref(k, v){ try{ localStorage.setItem("souki." + k, JSON.stringify(v)); }catch(e){} }
const enc = o => encodeURIComponent(JSON.stringify(o));
let DRAG_OWNER = null;
window.addEventListener("mousemove", e => { if(DRAG_OWNER) DRAG_OWNER._move(e); });
window.addEventListener("mouseup", e => { if(DRAG_OWNER){ const o = DRAG_OWNER; DRAG_OWNER = null; o._up(e); } });

class FaceBrowser {
  constructor(o){
    this.o = o;
    this.mode = o.mode || "x";
    this.kind = o.kind || "list";
    this.orders = o.orders || [];
    const okOrder = v => this.orders.some(x => x[0] === v);
    this.order = pref(this.kind + ".order", o.order);
    if(!okOrder(this.order)) this.order = o.order || (this.orders[0] || [])[0];
    this.size = pref("pagesize", 300);
    if(!PAGE_SIZES.includes(this.size)) this.size = 300;
    this.canGroups = !!o.groups;
    this.view = this.canGroups ? pref(this.kind + ".view", o.view || "faces") : "faces";
    this.page = 0; this.total = 0; this.faces = []; this.groups = [];
    this.marked = new Set(); this.gmarks = new Map();
    this.nodes = new Map(); this.last = null; this._drag = null; this._gcache = null;
    this.onchange = o.onchange || (() => {});
    this.root = el("div", "fb");
    this.bar = el("div", "fbbar");
    this.pTop = el("div", "pager"); this.body = el("div", "fbbody"); this.pBot = el("div", "pager");
    this.root.append(this.bar, this.pTop, this.body, this.pBot);
    this._buildBar();
    this.body.addEventListener("mousedown", e => this._down(e));
  }
  cls(){ return this.mode === "x" ? "x" : "s"; }
  src(order){ return Object.assign({}, this.o.src, {order: order || this.order}); }
  pages(){ return Math.max(1, Math.ceil(this.total / this.size)); }
  pageIds(){ return this.faces.map(f => f.instance_id); }
  lastId(){ return this.faces.length ? this.faces[this.faces.length - 1].instance_id : null; }
  markedIds(){ return [...this.marked]; }
  count(){ return this.marked.size; }
  seenUpTo(){ return Math.min(this.total, (this.page + 1) * this.size); }

  _buildBar(){
    const b = this.bar; b.innerHTML = "";
    if(this.orders.length){
      const s = el("select", "txt"); s.title = "並べかた";
      for(const [v, lab] of this.orders){ const o = el("option", null, lab); o.value = v; if(v === this.order) o.selected = true; s.appendChild(o); }
      s.onchange = () => { this.order = s.value; setPref(this.kind + ".order", this.order); this.page = 0; this.reload(); };
      b.appendChild(s);
      this.orderSel = s;
    }
    if(!this.o.static){
      const ps = el("select", "txt"); ps.title = "1 ページに出す枚数";
      for(const n of PAGE_SIZES){ const o = el("option", null, `${n} 枚ずつ`); o.value = n; if(n === this.size) o.selected = true; ps.appendChild(o); }
      ps.onchange = () => { const first = this.page * this.size; this.size = +ps.value; setPref("pagesize", this.size); this.page = Math.floor(first / this.size); this.reload(); };
      b.appendChild(ps);
    }
    if(this.canGroups){
      const seg = el("div", "seg"); this.viewSeg = seg;
      for(const [v, lab] of [["faces", "1 枚ずつ"], ["groups", "かたまりで"]]){
        const x = el("button", this.view === v ? "on" : "", lab);
        x.dataset.v = v;
        x.title = v === "groups" ? "似た顔のかたまりごとに見本を並べます。かたまりごと印を付けられます" : "顔を 1 枚ずつ並べます";
        x.onclick = () => this.setView(v, true);
        seg.appendChild(x);
      }
      b.appendChild(seg);
    }
    b.appendChild(sizeSeg());
    const pm = el("button", "tool", this.mode === "x" ? "このページ全部に ×" : "このページを全部選ぶ");
    pm.onclick = () => this.markPage(true);
    const clr = el("button", "tool", this.mode === "x" ? "× を全部外す" : "選択を全部外す");
    clr.onclick = () => this.clearMarks();
    b.append(pm, clr);
    this.info = el("span", "hint"); b.appendChild(this.info);
  }
  setView(v, remember){
    if(this.view === v) return;
    this.view = v;
    if(remember) setPref(this.kind + ".view", v);
    if(this.viewSeg) for(const y of this.viewSeg.children) y.classList.toggle("on", y.dataset.v === v);
    this.page = 0; this.reload();
  }

  async reload(){
    const seq = (this._seq = (this._seq || 0) + 1);
    this._gcache = null;
    this.body.innerHTML = ""; this.body.appendChild(el("div", "empty", "読み込み中…"));
    try{
      if(this.view === "groups") await this._loadGroups(seq);
      else await this._loadPage(seq);
    }catch(e){
      if(seq === this._seq){ this.body.innerHTML = ""; this.body.appendChild(el("div", "empty", "読み込めませんでした: " + (e.message || e))); }
    }
    if(seq === this._seq) this.onchange(this);
  }
  async _loadPage(seq){
    let d;
    if(this.o.static){
      const all = this.o.static;
      d = {total: all.length, faces: all.slice(this.page * this.size, (this.page + 1) * this.size)};
    }else{
      d = await api(`/api/chara/list?src=${enc(this.src())}&offset=${this.page * this.size}&limit=${this.size}`);
    }
    if(seq !== this._seq) return;
    this.total = d.total || 0;
    if(this.page > 0 && this.page >= this.pages()){ this.page = this.pages() - 1; return this._loadPage(seq); }
    this.faces = d.faces || [];
    this._renderFaces();
    this._renderPager();
  }
  async _ginfo(){
    if(!this._gcache) this._gcache = await api(`/api/chara/groups?src=${enc(this.src("group"))}&per=${this.o.per || 16}`);
    return this._gcache;
  }
  async _loadGroups(seq){
    const d = await this._ginfo();
    if(seq !== this._seq) return;
    this.total = d.total || 0; this.groups = d.groups || []; this.faces = [];
    this._renderGroups();
    this.pTop.innerHTML = ""; this.pBot.innerHTML = "";
    this.info.textContent = `${fmt(this.total)} 枚 ／ かたまり ${fmt(this.groups.length)} 個`;
  }

  _tile(f){
    const d = el("div", "face"); d.dataset.id = f.instance_id;
    const img = el("img"); img.loading = "lazy"; img.alt = ""; img.draggable = false; img.src = headSrc(f);
    img.onerror = () => { img.remove(); d.appendChild(el("span", "tagl", "画像なし")); };
    d.appendChild(img);
    const lb = this.o.label ? this.o.label(f) : null;
    if(lb) d.appendChild(el("span", "tagl", lb));
    if(f.solo === 0) d.appendChild(el("span", "tagr", "複数人"));
    if(f.seed) d.classList.add("seed");
    if(this.marked.has(f.instance_id)) d.classList.add(this.cls());
    d.title = (f.filename || "") + (f.reason ? `\n${f.reason}` : "") + "\n右クリック: 詳しく見る";
    d.addEventListener("contextmenu", e => { e.preventDefault(); openFace(f.instance_id); });
    d.addEventListener("dblclick", e => { e.preventDefault(); openFace(f.instance_id); });
    this.nodes.set(f.instance_id, d);
    return d;
  }
  _renderFaces(){
    this.body.innerHTML = ""; this.nodes.clear(); this.last = null;
    if(!this.faces.length){ this.body.appendChild(el("div", "empty", this.o.empty || "ここには顔がありません。")); return; }
    const g = el("div", "grid");
    const frag = document.createDocumentFragment();
    let prev = null;
    for(const f of this.faces){
      if(this.order === "group" && f.grp != null && f.grp !== prev){ frag.appendChild(this._sep(f.grp)); prev = f.grp; }
      frag.appendChild(this._tile(f));
    }
    g.appendChild(frag);
    this.body.appendChild(g);
  }
  _sep(grp){
    const s = el("div", "gsep"); s.dataset.grp = grp;
    s.appendChild(el("span", null, `かたまり ${grp + 1}`));
    const b = el("button", "tool", this.mode === "x" ? "このかたまりを全部 ×" : "このかたまりを全部選ぶ");
    b.onclick = e => { e.stopPropagation(); this.markGroup(grp, !this.gmarks.has(grp)); };
    s.appendChild(b);
    return s;
  }
  _renderGroups(){
    this.body.innerHTML = ""; this.nodes.clear(); this.last = null;
    if(!this.groups.length){ this.body.appendChild(el("div", "empty", this.o.empty || "ここには顔がありません。")); return; }
    const list = el("div", "glist");
    for(const g of this.groups){
      const row = el("div", "grow " + this.cls()); row.dataset.grp = g.grp;
      const h = el("div", "gh");
      const mb = el("button", "gmark", this.mode === "x" ? "× 違う" : "選ぶ");
      mb.title = this.mode === "x" ? "このかたまりの顔を全部 × にします（もう一度押すと外す）" : "このかたまりの顔を全部選びます（もう一度押すと外す）";
      mb.onclick = e => { e.stopPropagation(); this.markGroup(g.grp, !this.gmarks.has(g.grp)); };
      const op = el("button", "tool", `開く（${fmt(g.n)} 枚）`);
      op.onclick = e => { e.stopPropagation(); this.openGroup(g); };
      h.append(mb, el("b", null, `かたまり ${g.grp + 1}`), el("span", "num", `${fmt(g.n)} 枚`), op);
      row.appendChild(h);
      const strip = el("div", "gstrip");
      for(const f of g.faces) strip.appendChild(this._tile(f));
      row.appendChild(strip);
      list.appendChild(row);
    }
    this.body.appendChild(list);
    this._paint();
  }
  openGroup(g){
    this.order = "group";
    if(this.orderSel) this.orderSel.value = "group";
    this.view = "faces";
    if(this.viewSeg) for(const y of this.viewSeg.children) y.classList.toggle("on", y.dataset.v === "faces");
    this.page = Math.floor(g.offset / this.size);
    this.reload().then(() => {
      const sep = this.body.querySelector(`.gsep[data-grp="${g.grp}"]`);
      (sep || this.root).scrollIntoView({block: "start"});
    });
  }
  _renderPager(){
    const n = this.pages();
    for(const p of [this.pTop, this.pBot]){
      p.innerHTML = "";
      if(this.o.static && n <= 1) continue;
      const prev = el("button", "tool", "← 前へ"); prev.disabled = this.page <= 0; prev.onclick = () => this.go(this.page - 1);
      const next = el("button", "tool", "次へ →"); next.disabled = this.page >= n - 1; next.onclick = () => this.go(this.page + 1);
      const inp = el("input", "txt pg"); inp.value = this.page + 1; inp.title = "ページ番号を入れて Enter";
      inp.onchange = () => this.go((+inp.value || 1) - 1);
      const from = this.total ? this.page * this.size + 1 : 0, to = Math.min(this.total, (this.page + 1) * this.size);
      p.append(prev, inp, el("span", "hint", `/ ${fmt(n)} ページ（${fmt(from)}〜${fmt(to)} 枚目 ／ 全 ${fmt(this.total)} 枚）`), next);
    }
    if(n <= 1) this.pBot.innerHTML = "";
    this.info.textContent = "";
  }
  go(pg){
    pg = Math.max(0, Math.min(this.pages() - 1, pg));
    if(pg === this.page || this.view !== "faces") return;
    this.page = pg;
    this.reload().then(() => this.root.scrollIntoView({block: "start"}));
  }

  /* ── 印 ── */
  _set(id, on){
    if(on) this.marked.add(id); else this.marked.delete(id);
    const n = this.nodes.get(id); if(n) n.classList.toggle(this.cls(), on);
  }
  _paint(){
    const c = this.cls();
    for(const [id, n] of this.nodes) n.classList.toggle(c, this.marked.has(id));
    for(const r of this.body.querySelectorAll(".grow")) r.classList.toggle("on", this.gmarks.has(+r.dataset.grp));
    for(const s of this.body.querySelectorAll(".gsep")) s.classList.toggle("on", this.gmarks.has(+s.dataset.grp));
  }
  _after(){ S.dirty = this.marked.size > 0; this._paint(); this.onchange(this); }
  markPage(on){ for(const id of this.nodes.keys()) this._set(id, on); this._after(); }
  clearMarks(){ this.marked.clear(); this.gmarks.clear(); this._after(); }
  async markGroup(grp, on){
    let ids = this.gmarks.get(grp);
    if(!ids){
      try{
        const gi = (await this._ginfo()).groups.find(g => g.grp === grp);
        if(!gi) return;
        ids = [];
        for(let off = gi.offset; off < gi.offset + gi.n; off += 2000){
          const d = await api(`/api/chara/list?src=${enc(this.src("group"))}&offset=${off}&limit=${Math.min(2000, gi.offset + gi.n - off)}`);
          ids = ids.concat(d.faces.filter(f => f.grp === grp).map(f => f.instance_id));
        }
      }catch(e){ return fail(e); }
    }
    if(on){ this.gmarks.set(grp, ids); for(const i of ids) this.marked.add(i); }
    else{ this.gmarks.delete(grp); for(const i of ids) this.marked.delete(i); }
    this._after();
  }
  _click(tile, shift){
    const id = +tile.dataset.id;
    if(shift && this.last != null && this.nodes.has(this.last)){
      const ids = [...this.nodes.keys()];
      const a = ids.indexOf(this.last), b = ids.indexOf(id);
      const on = !this.marked.has(id);
      for(let k = Math.min(a, b); k <= Math.max(a, b); k++) this._set(ids[k], on);
    }else this._set(id, !this.marked.has(id));
    this.last = id;
    this._after();
  }

  /* ── ドラッグで囲む ── */
  _down(e){
    if(e.button !== 0 || e.target.closest("button,input,select,a,.gh")) return;
    const tile = e.target.closest(".face");
    if(!tile && !e.target.closest(".grid,.glist")) return;
    const br = this.body.getBoundingClientRect();
    this._drag = {x0: e.clientX, y0: e.clientY, sx: e.clientX - br.left, sy: e.clientY - br.top,
                  cx: e.clientX, cy: e.clientY, tile, started: false, alt: e.altKey, shift: e.shiftKey};
    DRAG_OWNER = this;
    e.preventDefault();
  }
  _move(e){
    const d = this._drag; if(!d) return;
    d.cx = e.clientX; d.cy = e.clientY;
    if(!d.started){
      if(Math.abs(d.cx - d.x0) + Math.abs(d.cy - d.y0) < 6) return;
      this._start();
    }
    this._update();
  }
  _up(){
    const d = this._drag; this._drag = null;
    if(!d) return;
    if(d.started){
      cancelAnimationFrame(d.raf);
      if(d.box) d.box.remove();
      this._after();
    }else if(d.tile) this._click(d.tile, d.shift);
  }
  _start(){
    const d = this._drag; d.started = true;
    const br = this.body.getBoundingClientRect();
    d.rects = [];
    for(const [id, n] of this.nodes){
      const r = n.getBoundingClientRect();
      d.rects.push([id, r.left - br.left, r.top - br.top, r.width, r.height]);
    }
    d.target = d.alt ? false : (d.tile ? !this.marked.has(+d.tile.dataset.id) : true);
    d.base = new Set(this.marked);
    d.box = el("div", "marquee"); this.body.appendChild(d.box);
    const tick = () => {
      if(this._drag !== d) return;
      const view = $("#view"), vr = view.getBoundingClientRect();
      let dy = 0;
      if(d.cy < vr.top + 60) dy = -Math.ceil((vr.top + 60 - d.cy) / 2.5);
      else if(d.cy > vr.bottom - 60) dy = Math.ceil((d.cy - (vr.bottom - 60)) / 2.5);
      if(dy){ view.scrollTop += dy; this._update(); }
      d.raf = requestAnimationFrame(tick);
    };
    d.raf = requestAnimationFrame(tick);
  }
  _update(){
    const d = this._drag; if(!d || !d.started) return;
    const br = this.body.getBoundingClientRect();
    const x = d.cx - br.left, y = d.cy - br.top;
    const L = Math.min(x, d.sx), T = Math.min(y, d.sy), R = Math.max(x, d.sx), B = Math.max(y, d.sy);
    const st = d.box.style;
    st.left = L + "px"; st.top = T + "px"; st.width = (R - L) + "px"; st.height = (B - T) + "px";
    const c = this.cls();
    for(const [id, rx, ry, rw, rh] of d.rects){
      const inside = rx < R && rx + rw > L && ry < B && ry + rh > T;
      const want = inside ? d.target : d.base.has(id);
      if(want !== this.marked.has(id)){
        if(want) this.marked.add(id); else this.marked.delete(id);
        const n = this.nodes.get(id); if(n) n.classList.toggle(c, want);
      }
    }
  }
}

/* 確定する範囲（このページ / 1〜このページ / 全部） */
function scopeSeg(fb, onchange){
  const seg = el("div", "seg scope");
  const opts = [["page", "このページ"], ["upto", "1〜このページ"], ["all", "全部"]];
  let cur = "page";
  const btns = {};
  for(const [v, lab] of opts){
    const b = el("button", v === cur ? "on" : "", lab);
    b.onclick = () => { if(b.disabled) return; cur = v; for(const k in btns) btns[k].classList.toggle("on", k === v); if(onchange) onchange(); };
    btns[v] = b; seg.appendChild(b);
  }
  seg.value = () => cur;
  seg.refresh = () => {
    const groups = fb.view === "groups";
    btns.page.disabled = groups; btns.upto.disabled = groups;
    btns.page.title = "いま表示しているページの顔だけ";
    btns.upto.textContent = `1〜${fmt(fb.page + 1)} ページ`;
    btns.upto.title = `並び順で 1 枚目から ${fmt(fb.seenUpTo())} 枚目まで`;
    btns.all.textContent = `全部（${fmt(fb.total)} 枚）`;
    btns.all.title = "まだ見ていない顔も含めて、この一覧の全部";
    if(groups && cur !== "all"){ cur = "all"; for(const k in btns) btns[k].classList.toggle("on", k === "all"); }
  };
  return seg;
}
/* 範囲の指定を、サーバへ送る形にする */
function scopeBody(fb, scope){
  const b = {src: fb.src(), scope, reject: fb.markedIds()};
  if(scope === "page") b.page_ids = fb.pageIds();
  if(scope === "upto") b.upto_id = fb.lastId();
  return b;
}
function scopeCount(fb, scope){
  const m = fb.count();
  if(scope === "page") return fb.pageIds().filter(i => !fb.marked.has(i)).length;
  if(scope === "upto") return Math.max(0, fb.seenUpTo() - m);
  return Math.max(0, fb.total - m);
}

/* ── 画面の切り替え ───────────────────── */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  return {name: parts[0] || "", id: parts[1] ? +parts[1] : null, q: new URLSearchParams(qs || "")};
}
let renderSeq = 0;
async function render(keepScroll){
  const r = parseHash();
  const seq = ++renderSeq;
  const view = $("#view");
  const top = keepScroll ? view.scrollTop : 0;
  if(!S.st) await loadStatus();
  let name = r.name;
  if(!name) name = defaultView();
  if(!VIEWS[name]) name = "analysis";
  S.view = name;
  S.fb = null;
  for(const a of document.querySelectorAll("#nav a"))
    a.classList.toggle("on", a.dataset.r === name || (name === "proposal" && a.dataset.r === "proposals")
                               || (name === "char" && a.dataset.r === "chars") || (name === "similar" && a.dataset.r === "unassigned"));
  const page = el("div", "page");
  view.classList.add("loading");
  try{
    await VIEWS[name](page, r);
  }catch(e){
    page.innerHTML = ""; page.appendChild(el("div", "empty", "読み込めませんでした: " + (e.message || e)));
  }
  if(seq !== renderSeq) return;
  view.classList.remove("loading");
  view.innerHTML = ""; view.appendChild(page);
  view.scrollTop = top;
}
function defaultView(){
  const st = S.st || {};
  if(!st.available || !(st.models && st.models.ready) || !st.full_done) return "analysis";
  if(!st.characters) return "proposals";
  if(st.review) return "review";
  return "chars";
}
window.addEventListener("hashchange", () => { S.dirty = false; closeDrawer(); render(); });

  put3("新しい絵", st.settings && st.settings.auto_analyze ? "台帳を更新したら自動で解析します（全件を一度済ませたあと）" : "自動では解析しません（設定で変えられます）");

  ab.onclick = async () => { ab.disabled = true; try{ const r = await post("/api/chara/job", {kind:"analyze"}); if(!r.ok) toast(r.error, "bad"); pollJobs(); }catch(e){ fail(e); } };
  r3.appendChild(ab);

  const r4 = el("div", "row");
  const go = el("a", "btn " + (st.full_done ? "primary" : ""), `候補を見る（${fmt(st.proposals)} 件）`); go.href = "#/proposals";

  page.appendChild(b4);
};

function previewReport(p){
  const w = el("div");
  const heads = p.heads || {};
  const kv = el("dl", "kv");
  const put = (k, v) => { kv.appendChild(el("dt", null, k)); kv.appendChild(el("dd", null, v)); };
  put("解析した絵", `${fmt(p.analyzed_ok)} 枚 — 顔なし ${fmt(heads["0"])}・1 人 ${fmt(heads["1"])}・2 人 ${fmt(heads["2"])}・3 人以上 ${fmt(heads["3"])}`);
  put("速さ", p.rate ? `${p.rate.toFixed(1)} 枚/秒（${devLabel(p.device)}）` : "—");
  if(p.remaining) put("全件の見込み", p.eta_s ? `残り ${fmt(p.remaining)} 枚 → 約 ${fmtDur(p.eta_s)}` : `残り ${fmt(p.remaining)} 枚`);
  const V = {good:"よく見分けられています", fair:"おおむね見分けられています（確認待ちがやや多めになります）",
             weak:"見分けが苦手な絵柄です（確認待ちが多くなります）"};
  put("見分け", p.verdict ? V[p.verdict] : "特徴語のそろった絵が少なく、測れませんでした（解析には差し支えありません）");
  put("見方のおすすめ", (p.recommend === "crop" ? "上半身で見る" : "絵全体で見る") + " — " + (p.recommend_why || ""));
  if(p.errors) put("読めなかった画像", `${fmt(p.errors)} 枚`);
  w.appendChild(kv);
  const sep = p.separation || {};
  const t = el("table", "t"); t.style.marginTop = "10px"; t.style.maxWidth = "640px";
  t.innerHTML = "<tr><th>見方</th><th>見分け（1.0 が満点）</th><th>同じ子どうしの近さ</th><th>別の子の近いほう 5%</th></tr>";
  for(const [k, lab] of [["full","絵全体"],["crop","上半身"]]){
    const s = sep[k]; const r = el("tr");
    r.appendChild(el("td", null, lab + (p.recommend === k ? "（おすすめ）" : "")));
    r.appendChild(el("td", "num", s && s.auc != null ? s.auc.toFixed(3) : "—"));
    r.appendChild(el("td", "num", s && s.same_median != null ? s.same_median.toFixed(4) : "—"));
    r.appendChild(el("td", "num", s && s.diff_p5 != null ? s.diff_p5.toFixed(4) : "—"));
    t.appendChild(r);
  }
  w.appendChild(t);
  w.appendChild(el("div", "hint", "見分けは、プロンプトの髪色・ツノ・目の色が同じ絵を「同じ子」、違う絵を「別の子」とみなして測った目安です。"));
  if(p.sample_faces && p.sample_faces.length){
    const g = el("div", "sample");
    for(const i of p.sample_faces){ const im = el("img"); im.loading = "lazy"; im.src = "/head/" + i; im.alt = ""; g.appendChild(im); }
    w.appendChild(g);
    w.appendChild(el("div", "hint", "見つけた顔の例。頭ではない物が多く混ざっているようなら知らせてください。"));
  }
  return w;
}

function coverRow(ids, n){
  const c = el("div", "cov");
  for(let k = 0; k < (n || 4); k++){
    if(ids[k] != null){ const im = el("img"); im.loading = "lazy"; im.src = "/head/" + ids[k]; im.alt = ""; c.appendChild(im); }
    else c.appendChild(el("i"));
  }
  return c;
}
function hintChips(h){

  return c;
}

const PROPOSAL_ORDERS = [
  ["group", "似た顔ごと（怪しいかたまりから）"], ["sus", "怪しい順（まとまりの芯から遠い顔から）"],
  ["rep", "代表的な顔から"], ["new", "新しい順"], ["old", "古い順"], ["name", "ファイル名順（日付フォルダ順）"],
];
VIEWS.proposal = async (page, r) => {
  const pid = r.id;
  const [info, rep] = await Promise.all([
    api(`/api/chara/proposal/${pid}?limit=1`),
    api(`/api/chara/list?src=${enc({type: "proposal", id: pid, order: "rep"})}&limit=18`).catch(() => ({faces: []})),
  ]);
  await loadChars();
  const head = el("div", "head");
  const back = el("a", "tool", "← 候補の一覧"); back.href = "#/proposals";
  const subN = el("span", "sub", `${fmt(info.total)} 枚`);
  head.append(back, el("h2", null, `候補 ${pid}`), subN);
  const sp = el("div"); sp.style.flex = "1"; head.appendChild(sp);
  head.appendChild(staleLink());
  page.appendChild(head);
  page.appendChild(hintChips(info.hints || {}));
  if(!info.total){
    page.appendChild(el("div", "empty", "この候補の顔はすべて片付きました。"));
    const nx = el("button", "btn primary", "次の候補へ"); nx.onclick = () => nextProposal(pid);
    const w = el("div", "more"); w.appendChild(nx); page.appendChild(w);
    return;
  }
  const rs = el("div", "repstrip");
  rs.appendChild(el("span", "plate bare", "代表的な顔"));
  for(const f of (rep.faces || [])){ const im = el("img"); im.src = headSrc(f); im.alt = ""; im.loading = "lazy"; im.title = f.filename || ""; rs.appendChild(im); }
  page.appendChild(rs);
  page.appendChild(el("p", "lead",
    "違う子の顔に × を付けてから、名前を付けます。何千枚もあるときは「かたまりで」がおすすめです。似た顔のかたまりごとに見本が並ぶので、" +
    "違う子のかたまりに「× 違う」を押し、最後に「全部」で残りをまとめて確定できます。"));
  const note = el("div", "box leftnote"); note.hidden = true;
  page.appendChild(note);

  const cnt = el("span", "cnt");
  const fb = new FaceBrowser({
    kind: "proposal", src: {type: "proposal", id: pid}, mode: "x", groups: true,
    view: info.total >= 500 ? "groups" : "faces", orders: PROPOSAL_ORDERS, order: "group",
    onchange: () => paint(),
  });
  S.fb = fb;
  page.appendChild(fb.root);

  const bar = el("div", "actbar");
  const inp = el("input", "txt"); inp.placeholder = "この子の名前（新しい名前、または既存のキャラ）"; inp.style.width = "280px";
  inp.setAttribute("list", "names-dl");
  const dl = el("datalist"); dl.id = "names-dl";
  for(const c of S.chars){ const o = el("option"); o.value = c.name; dl.appendChild(o); }
  const scope = scopeSeg(fb, () => paint());
  const ok = el("button", "btn primary", "× 以外を確定");
  const skip = el("button", "btn ghost", "見送る");
  skip.title = "この候補の顔を、まとめて候補から外します（一度きりの子など）。未分類の「見送った顔」から戻せます。";
  bar.append(cnt, inp, dl, el("span", "hint", "範囲"), scope, ok, el("span", "sep"), skip);
  page.appendChild(bar);
  function paint(){
    subN.textContent = `${fmt(fb.total)} 枚`;
    scope.refresh();
    const n = scopeCount(fb, scope.value());
    cnt.innerHTML = `× <b>${fmt(fb.count())}</b> 枚`;
    const allX = n <= 0 && fb.count() > 0;
    ok.textContent = allX ? `× を全部その子ではないにする（${fmt(fb.count())} 枚）` : `× 以外を確定（${fmt(n)} 枚）`;
    ok.disabled = n <= 0 && !allX;
  }
  async function doName(){
    const name = inp.value.trim();
    if(!name){ inp.focus(); toast("名前を入れてください", "bad"); return; }
    const sc = scope.value();
    const n = scopeCount(fb, sc);
    if(n <= 0){
      if(!fb.count()){ toast("確定する顔がありません", "bad"); return; }
      if(!charByName(name)){ toast(`全部に × が付いています。「${name}」はまだいないので、確定する顔が要ります`, "bad"); return; }
      if(!await confirmBox(`全部「${name}」ではないとしますか`, `× の ${fmt(fb.count())} 枚を「${name}ではない」として覚えます。確定する顔はありません。\n取り消しもできます。`, "決める")) return;
      const res0 = await act(Object.assign({kind: "scope", verb: "confirm", to: {name}}, scopeBody(fb, sc)));
      if(res0){ fb.clearMarks(); refreshCounts(); await fb.reload(); }
      return;
    }
    if(sc !== "page" || n > 600){
      const msg = `${fmt(n)} 枚を「${name}」として確定します。` + (fb.count() ? `\n× の ${fmt(fb.count())} 枚は「${name}ではない」として覚えます。` : "")
        + (sc === "all" ? "\nまだ見ていない顔も含みます（あとで「浮いている」やキャラの画面から直せます）。" : "")
        + "\n取り消しもできます。";
      if(!await confirmBox(`「${name}」として確定しますか`, msg, "確定する")) return;
    }
    ok.disabled = true;
    const res = await act(Object.assign({kind: "scope", verb: "confirm", to: {name}}, scopeBody(fb, sc)));
    ok.disabled = false;
    if(!res) return;
    fb.clearMarks();
    await loadChars();
    refreshCounts();
    if(sc !== "page") fb.page = 0;
    await fb.reload();
    if(fb.total < 3){ nextProposal(pid); return; }
    inp.value = "";
    if(sc === "all"){
      note.replaceChildren();
      note.appendChild(el("div", null, `「${name}」を確定しました。残っている ${fmt(fb.total)} 枚は、× を付けた「${name}ではない」顔です。`));
      note.appendChild(el("div", "d", "別の子なら名前を付けて確定、名前を付けたい子がいなければ「見送る」。あとで決めるなら次の候補へ進んでかまいません（未分類に残ります）。"));
      const nx = el("button", "btn", "次の候補へ"); nx.onclick = () => nextProposal(pid);
      note.appendChild(nx);
      note.hidden = false;
    }
  }
  ok.onclick = doName;
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); doName(); } });
  skip.onclick = async () => {
    if(!await confirmBox("この候補を見送りますか", `この候補の ${fmt(fb.total)} 枚を候補から外します。\n名前を付けたい子がいないときに使います（取り消せます）。`, "見送る")) return;
    const res = await act({kind: "scope", verb: "dismiss", src: fb.src(), scope: "all"});
    if(res){ refreshCounts(); nextProposal(pid); }
  };
  await fb.reload();
};
async function nextProposal(pid){
  try{
    const d = await api("/api/chara/proposals");
    const rest = (d.proposals || []).filter(p => p.id !== pid);
    location.hash = rest.length ? "#/proposal/" + rest[0].id : "#/chars";
  }catch(e){ location.hash = "#/proposals"; }
}

  });
  S.fb = fb;
  page.appendChild(fb.root);
  const bar = el("div", "actbar");
  page.appendChild(bar);
  const btns = [];
  const B = (label, cls, need, fn, title) => { const b = el("button", "btn " + (cls || ""), label); b.dataset.need = need; if(title) b.title = title; b.onclick = fn; btns.push(b); return b; };
  const afterAct = async res => { if(!res) return; fb.clearMarks(); await loadChars(); refreshCounts(); await fb.reload(); };
  const moveTo = async ids => {
    const v = await pickName(`${fmt(ids.length)} 枚を別のキャラへ`, `選んだ顔を別のキャラ（新しい名前でもよい）へ移し、「${c.name}ではない」と覚えます。`, {ok: "移す", exclude: cid});
    if(v) afterAct(await act({kind: "move", ids, to: {name: v}}));
  };
  let scope = null, main = null;
  if(isX){
    scope = scopeSeg(fb, () => paint());
    main = B("", "primary", "scope", async () => {
      const sc = scope.value(), n = scopeCount(fb, sc);
      if(n <= 0 && fb.count()){
        // 全部に × ＝ この中にこの子は 1 枚もいない
        {
          if(!await confirmBox(`全部「${c.name}」ではないとしますか`, `× の ${fmt(fb.count())} 枚を「${c.name}ではない」として覚えます。確定する顔はありません。\n取り消しもできます。`, "決める")) return;
        }
        afterAct(await act(Object.assign({kind: "scope", verb: tab === "outlier" ? "keep" : "confirm", to: {id: cid}}, scopeBody(fb, sc))));
        return;
      }
      if(sc !== "page" || n > 600){
        const what = tab === "outlier" ? `${fmt(n)} 枚を見直し済み（本人）にします。` : `${fmt(n)} 枚を「${c.name}」として確定します。`;
        const msg = what + (fb.count() ? `\n× の ${fmt(fb.count())} 枚は「${c.name}ではない」として覚えます。` : "") +
          (sc === "all" ? "\nまだ見ていない顔も含みます。" : "") + "\n取り消しもできます。";
        if(!await confirmBox("まとめて決めますか", msg, "決める")) return;
      }
      afterAct(await act(Object.assign({kind: "scope", verb: tab === "outlier" ? "keep" : "confirm", to: {id: cid}}, scopeBody(fb, sc))));
    }, "× 以外をこのキャラとして確定し、× はこの子ではないと覚えます");
    bar.append(cnt, el("span", "hint", "範囲"), scope, main, el("span", "sep"),
      B("× を別のキャラへ…", "", "marked", () => moveTo(fb.markedIds())),
      B("× を未分類に戻す", "ghost", "marked", async () => afterAct(await act({kind: "unassign", ids: fb.markedIds()})), "どのキャラにも入れず、判定もやり直しません"));
  }else if(tab === "confirmed"){
    bar.append(cnt,
      B("この子ではない", "bad", "marked", async () => afterAct(await act({kind: "reject", ids: fb.markedIds(), to: {id: cid}}))),
      B("別のキャラへ…", "", "marked", () => moveTo(fb.markedIds())),
      B("未分類に戻す", "ghost", "marked", async () => afterAct(await act({kind: "unassign", ids: fb.markedIds()}))));
  }else if(tab === "rejected"){
    bar.append(cnt,
      B("やっぱりこの子（確定）", "good", "marked", async () => afterAct(await act({kind: "confirm", ids: fb.markedIds(), to: {id: cid}}))),
      B("「この子ではない」を取り消す", "", "marked", async () => afterAct(await act({kind: "unreject", ids: fb.markedIds(), to: {id: cid}})), "確定はせず、判定に任せます"));
  }
  function paint(){
    cnt.innerHTML = `${isX ? "×" : "選択"} <b>${fmt(fb.count())}</b> 枚`;
    if(scope){
      scope.refresh();
      const n = scopeCount(fb, scope.value());
      main.textContent = (n <= 0 && fb.count()) ? `× を全部「${c.name}」ではないにする（${fmt(fb.count())} 枚）`
        : (tab === "outlier" ? "× 以外は問題なし" : "× 以外を確定") + `（${fmt(n)} 枚）`;
    }
    for(const b of btns){
      const nd = b.dataset.need;
      b.disabled = (nd === "marked" && !fb.count()) || (nd === "scope" && (!fb.total || scopeCount(fb, scope.value()) <= 0 && !fb.count()));
    }
  }
  await fb.reload();
};

/* LoRA（台帳の差し替えで入れ替える）。台帳から推し量り、手で直せる */
function loraBox(c){
  const box = el("div", "box lorabox");
  box.appendChild(el("h3", null, "LoRA（差し替えで入れ替える）"));
  const body = el("div"); box.appendChild(body);
  const load = async () => {
    body.replaceChildren(el("div", "hint", "読み込み中…"));
    let d;
    try{ d = await api(`/api/chara/lora/${c.id}`); }catch(e){ body.replaceChildren(el("div", "hint", "読めませんでした")); return; }
    body.replaceChildren();
    const eff = d.effective || {}, auto = d.auto;
    const how = eff.source === "manual" ? (eff.lora ? "手で決めたもの" : "手で「LoRA なし」にしています")
      : eff.source === "auto" ? `台帳から推し量ったもの（この子の絵の ${Math.round((eff.share || 0) * 100)}% で使われています）`
      : "LoRA なし（台帳から推し量れませんでした）";
    body.appendChild(el("div", "hint", how + "。この子に差し替えるとき、元の子の LoRA とトリガー語をこれに入れ替えます。"
      + "LoRA なしの子に差し替えるときは、元の子の LoRA を止めます。元の絵に LoRA のノードが無ければ、モデルのすぐ後ろに足します。"));
    const row = el("div", "row"); row.style.marginTop = "8px"; row.style.flexWrap = "wrap"; row.style.gap = "8px";
    const li = el("input", "txt"); li.style.flex = "2 1 260px"; li.placeholder = "LoRA のファイル名（例: chara/rulu_v1.safetensors）";
    li.value = eff.lora || ""; li.setAttribute("list", "lora-known-" + c.id);
    const dl = el("datalist"); dl.id = "lora-known-" + c.id;
    for(const k of (d.known || [])){ const o = el("option"); o.value = k.name; o.label = `${k.name}（${k.n}枚）`; dl.appendChild(o); }
    const si = el("input", "txt"); si.type = "number"; si.step = "0.05"; si.min = "-5"; si.max = "5"; si.style.width = "80px";
    si.value = eff.strength != null ? eff.strength : 1; si.title = "強さ";
    const ti = el("input", "txt"); ti.style.flex = "2 1 220px"; ti.placeholder = "トリガー語（カンマ区切り）";
    ti.value = (eff.trigger || []).join(", ");
    row.append(li, dl, el("span", "hint", "強さ"), si, el("span", "hint", "トリガー語"), ti);
    body.appendChild(row);
    const btns = el("div", "row"); btns.style.marginTop = "8px"; btns.style.gap = "6px";
    const save = el("button", "btn primary", "保存");
    save.onclick = async () => {
      const r = await post("/api/chara/lora", {id: c.id, lora: li.value.trim(), strength: si.value, trigger: ti.value});
      if(r && r.ok){ toast("LoRA を保存しました", "good"); load(); } else toast((r && r.error) || "保存できませんでした", "bad");
    };
    const none = el("button", "btn", "LoRA なしにする"); none.title = "この子に差し替えるとき、元の子の LoRA を止めます";
    none.onclick = async () => { const r = await post("/api/chara/lora", {id: c.id, lora: "", strength: 1, trigger: ti.value}); if(r && r.ok) load(); };
    btns.append(save, none);
    if(eff.source === "manual"){
      const reset = el("button", "btn ghost", "自動に戻す"); reset.title = "手で決めた LoRA を消して、台帳から推し量り直します";
      reset.onclick = async () => { const r = await post("/api/chara/lora", {id: c.id, reset: true}); if(r && r.ok) load(); };
      btns.appendChild(reset);
    }
    body.appendChild(btns);
    if(eff.source === "manual" && auto && auto.lora)
      body.appendChild(el("div", "hint", `台帳から推し量ると: ${auto.lora}（${auto.strength}）` + (auto.trigger && auto.trigger.length ? ` ／ トリガー語 ${auto.trigger.join(", ")}` : "")));
  };
  load();
  return box;
}

/* 登録した服（台帳の差し替えで使う）。この子用と、どの子にも出す服 */
function outfitBox(name){
  const box = el("div", "box outfitbox");
  const h = el("h3", null, "登録した服"); box.appendChild(h);
  const body = el("div"); box.appendChild(body);
  const load = async () => {
    body.replaceChildren(el("div", "hint", "読み込み中…"));
    let d;
    try{ d = await api(`/api/outfits?chara=${encodeURIComponent(name)}`); }catch(e){ body.replaceChildren(el("div", "hint", "読めませんでした")); return; }
    body.replaceChildren();
    const saved = d.saved || [];
    if(!saved.length) body.appendChild(el("div", "hint", "まだありません。台帳で絵を開き、差し替えの欄の「この絵の服を登録…」で作れます。"));
    for(const o of saved){
      const row = el("div", "orow");
      row.appendChild(el("b", null, o.name));
      row.appendChild(el("span", "chip", o.character ? `${o.character} だけ` : "どの子にも"));
      row.appendChild(el("span", "ow", o.words.join(", ")));
      const del = el("button", "tool", "消す");
      del.onclick = async () => { if(!await confirmBox(`服「${o.name}」を消しますか`, o.words.join(", "), "消す", true)) return; await post("/api/outfits/delete", {id: o.id}); load(); };
      row.appendChild(del);
      body.appendChild(row);
    }
    const us = d.usual || [];
    if(us.length){
      body.appendChild(el("div", "hint", `いつもの服（台帳から自動）: ` + us.slice(0, 3).map(u => `${u.words.slice(0, 4).join(", ")}（${u.n}枚）`).join(" ／ ")));
    }
  };
  load();
  return box;
}

    }
    b1.appendChild(devs);
    const rr = el("div", "row");
    const tb = el("button", "btn", "試験をやり直す"); tb.disabled = !!aj.running || !(st.models && st.models.ready);
    tb.onclick = async () => { tb.disabled = true; try{ const r = await post("/api/chara/job", {kind:"selftest"}); if(!r.ok) toast(r.error, "bad"); pollJobs(); }catch(e){ fail(e); } };
    rr.appendChild(tb);
    if(st.tested_at) rr.appendChild(el("span", "hint", "前回の試験: " + new Date(st.tested_at * 1000).toLocaleString()));
    b1.appendChild(rr);
    page.appendChild(b1);

    // 見方
    const b2 = el("div", "box"); b2.appendChild(el("h3", null, "顔の見方"));
    b2.appendChild(el("p", "lead", "キャラの判定は、頭のまわり（上半身）を切り出して見ます。1 人の絵は、絵全体で見るとさらに確かになることがあります。" +
      "試運転の結果からおすすめを出しています。変えると、足りない分を解析し直してから判定します。"));
    const seg = el("div", "seg");
    for(const [v, lab] of [["full","絵全体（1 人の絵）"],["crop","上半身だけ"]]){
      const bb = el("button", st.variant === v ? "on" : "", lab);
      bb.onclick = async () => { try{ const r = await post("/api/chara/settings", {feature_variant:v}); if(r.ok){ toast("見方を変えました", "good", r.job && r.job.ok ? "足りない分を解析しています" : ""); pollJobs(); render(true); } else toast(r.error, "bad"); }catch(e){ fail(e); } };
      seg.appendChild(bb);
    }
    b2.appendChild(seg);
    if(st.preview) b2.appendChild(el("div", "hint", "試運転のおすすめ: " + (st.preview.recommend === "crop" ? "上半身だけ" : "絵全体") + " — " + (st.preview.recommend_why || "")));
    page.appendChild(b2);

    // 自動解析
    const b3 = el("div", "box"); b3.appendChild(el("h3", null, "新しい絵"));
    const lab = el("label", "row"); lab.style.cursor = "pointer";
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !!s.auto_analyze;
    cb.onchange = async () => { try{ await post("/api/chara/settings", {auto_analyze: cb.checked}); toast("変えました", "good"); }catch(e){ fail(e); } };
    lab.append(cb, el("span", null, "台帳を更新したとき、新しい絵を自動で解析して判定する（全件の解析を一度済ませたあと）"));
    b3.appendChild(lab);
    page.appendChild(b3);
  }

  // 出力フォルダ
  const b4 = el("div", "box"); b4.appendChild(el("h3", null, "出力フォルダ"));
  b4.appendChild(el("p", "lead", "ComfyUI の output フォルダ（1 行に 1 つ）。変えたら台帳の「更新」で読み直します。"));
  const ta = el("textarea", "txt"); ta.rows = 3; ta.style.width = "100%"; ta.style.fontFamily = "var(--mono)"; ta.style.fontSize = "12px";
  ta.value = (base.output_dirs || []).join("\n");
  b4.appendChild(ta);
  const reach = el("div", "hint");
  for(const [k, v] of Object.entries(base.reachable || {})) reach.appendChild(el("div", v ? "" : "badline", (v ? "OK　" : "見つかりません　") + k));
  b4.appendChild(reach);
  const sv = el("button", "btn", "保存"); sv.style.marginTop = "8px";
  sv.onclick = async () => { try{ const r = await post("/api/settings", {output_dirs: ta.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean)}); if(r.ok){ toast("保存しました", "good"); render(true); } }catch(e){ fail(e); } };
  b4.appendChild(sv);
  page.appendChild(b4);

  // 保存名のひな形（台帳から投入するとき）
  const bT = el("div", "box"); bT.appendChild(el("h3", null, "保存名のひな形"));
  bT.appendChild(el("p", "lead", "台帳から投入するときの保存名（SaveImage の filename_prefix）。{キャラ} のところにキャラの名前が入ります。" +
    "%date:yyyy% などは ComfyUI と同じ書き方で、投入するときに今日の日付になります。"));
  const tIn = el("input", "txt"); tIn.style.width = "100%"; tIn.style.fontFamily = "var(--mono)"; tIn.style.fontSize = "12px";
  const tDef = "%date:yyyy%-%date:M%-%date:d%/%date:yyyy%-%date:M%-%date:d%illu{キャラ}";
  tIn.value = base.save_template || tDef;
  const tEx = el("div", "hint");
  const tShow = () => {
    const d = new Date(), v = {yyyy: d.getFullYear(), yy: String(d.getFullYear() % 100).padStart(2, "0"), MM: String(d.getMonth() + 1).padStart(2, "0"), M: d.getMonth() + 1, dd: String(d.getDate()).padStart(2, "0"), d: d.getDate()};
    tEx.textContent = "例: " + tIn.value.replace(/%date:([^%]+)%/g, (m, f) => f.replace(/yyyy|yy|MM|M|dd|d/g, k => v[k])).replace("{キャラ}", "ルル");
  };
  tIn.addEventListener("input", tShow); tShow();
  bT.append(tIn, tEx);
  const tRow = el("div", "row"); tRow.style.marginTop = "8px";
  const tSave = el("button", "btn", "保存");
  tSave.onclick = async () => { try{ const r = await post("/api/settings", {save_template: tIn.value.trim()}); if(r.ok) toast("保存しました", "good"); }catch(e){ fail(e); } };
  const tReset = el("button", "tool", "最初の形に戻す");
  tReset.onclick = () => { tIn.value = tDef; tShow(); };
  tRow.append(tSave, tReset); bT.appendChild(tRow);
  page.appendChild(bT);

  if(st.available){
    // 判定の線
    const cal = st.calib || {};
    const b5 = el("div", "box"); b5.appendChild(el("h3", null, "判定の線（参考）"));
    b5.appendChild(el("p", "lead", "機械が「自動」で入れる近さの上限です。モデルの公開値から始め、確定と否が増えるにつれて、" +
      "別の子が混ざらない側へだけ厳しくします（緩めることはしません）。数字は小さいほど厳しい。"));
    const bs = cal.base || {};
    const kv = el("dl", "kv");
    const put = (k, v) => { kv.appendChild(el("dt", null, k)); kv.appendChild(el("dd", "num", v)); };
    put("公開値", bs.auto != null ? `自動 ${bs.auto.toFixed(4)} ／ 確認待ち ${bs.review.toFixed(4)}` : "—");
    put("別の子の近いほう 1%", cal.imp_p1 != null ? cal.imp_p1.toFixed(4) : "（まだ材料がありません）");
    b5.appendChild(kv);
    const per = cal.per || {};
    const ids = Object.keys(per);
    if(ids.length){
      await loadChars();
      const t = el("table", "t"); t.style.marginTop = "10px";
      t.innerHTML = "<tr><th>キャラ</th><th>自動</th><th>確認待ち</th><th>決め手</th><th>色の幅</th></tr>";
      for(const k of ids){
        const p = per[k], c = S.chars.find(x => String(x.id) === k);
        const tr = el("tr");
        tr.append(el("td", null, c ? c.name : "#" + k), el("td", "num", p.auto.toFixed(4)), el("td", "num", p.review.toFixed(4)),
                  el("td", null, p.why || ""), el("td", "num", p.color != null ? p.color.toFixed(3) : "—"));
        t.appendChild(tr);
      }
      b5.appendChild(t);
    }
    page.appendChild(b5);

    // 書き出し
    const b6 = el("div", "box"); b6.appendChild(el("h3", null, "書き出し"));
    b6.appendChild(el("p", "lead", "キャラ設定シート（HTML）と、LoRA 学習用のデータ（画像＋キャプション）を export フォルダへ書き出します。"));
    const eb = el("button", "btn", "書き出す…"); eb.onclick = () => exportDialog();
    b6.appendChild(eb);
    page.appendChild(b6);

    // 前の版
    const od = st.old_data || {};
    if((od.tables && od.tables.length) || od.faces_dir_mb || od.counting){
      const b7 = el("div", "box"); b7.appendChild(el("h3", null, "前の版のデータ"));
      b7.appendChild(el("p", "lead", `前の版（顔クラスタ方式）の記録が残っています: 表 ${(od.tables || []).join(", ") || "なし"}、顔の画像など ${od.counting ? "（数えています…）" : fmt(od.faces_dir_mb || 0) + " MB"}。` +
        "新しい版では使いません。台帳（画像の記録）とは別なので、消しても台帳には影響しません。"));
      const db = el("button", "btn bad", "前の版のデータを消す");
      db.onclick = async () => {
        if(!await confirmBox("前の版のデータを消しますか", "前の版の顔クラスタと名前の記録を消します。これは取り消せません。", "消す", true)) return;
        toast("消しています…（台帳が大きいと数十秒かかります）", null, null, 60000);
        db.disabled = true;
        try{ const r = await post("/api/chara/olddata/delete"); if(r.ok){ toast("消しました", "good"); render(true); } }catch(e){ fail(e); }
        db.disabled = false;
      };
      b7.appendChild(db);
      page.appendChild(b7);
    }
  }

  // 速さの記録（遅いと感じたとき、どこが遅いかを数字で見るため）
  const b9 = el("div", "box"); b9.appendChild(el("h3", null, "速さの記録"));
  b9.appendChild(el("p", "lead", "起動してからの、画面の問い合わせごとの時間です。遅いと感じたら、この表を写して知らせてください。"));
  try{
    const pf = await api("/api/perf");
    const lc = (st.last_classify || {});
    const kv9 = el("dl", "kv");
    kv9.append(el("dt", null, "直近の判定"), el("dd", "num", lc.elapsed != null ? `${lc.elapsed} 秒（書き直した行 ${fmt(lc.written)}）` : "—"));
    b9.appendChild(kv9);
    const t = el("table", "t"); t.style.marginTop = "8px";
    t.innerHTML = "<tr><th>問い合わせ</th><th>回数</th><th>平均 ms</th><th>最大 ms</th></tr>";
    for(const r of (pf.requests || []).slice(0, 15)){
      const tr = el("tr");
      tr.append(el("td", "num", r.path), el("td", "num", fmt(r.n)), el("td", "num", fmt(r.avg)), el("td", "num", fmt(r.max)));
      t.appendChild(tr);
    }
    b9.appendChild(t);
    const rb = el("button", "tool", "記録を消す"); rb.style.marginTop = "8px";
    rb.onclick = async () => { await api("/api/perf?reset=1"); render(true); };
    b9.appendChild(rb);
  }catch(e){ b9.appendChild(el("div", "hint", "読めませんでした")); }
  page.appendChild(b9);

  // 版
  const b8 = el("div", "box"); b8.appendChild(el("h3", null, "版"));
  const kv8 = el("dl", "kv");
  const put8 = (k, v) => { kv8.appendChild(el("dt", null, k)); kv8.appendChild(el("dd", "num", v || "—")); };
  put8("画面", PAGE_VERSION);
  put8("chara.py", st.version); put8("vision.py", st.vision_version);
  const env = st.env || {};
  put8("Python", env.python); put8("ONNX Runtime", env.ort ? `${env.ort}（${(env.providers || []).join(", ")}）` : null);
  const mf = st.manifest || {};
  for(const [k, files] of Object.entries(mf)){
    if(!files || typeof files !== "object") continue;
    for(const [fn, v] of Object.entries(files)){
      if(!v || typeof v !== "object") continue;
      put8(`モデル ${k}/${fn}`, [v.rev ? "版 " + String(v.rev).slice(0, 10) : "", v.size ? (v.size / 1e6).toFixed(1) + " MB" : "",
                               v.sha256 ? "sha256 " + String(v.sha256).slice(0, 12) + "…" : ""].filter(Boolean).join("　"));
    }
  }
  b8.appendChild(kv8);
  page.appendChild(b8);
};

/* ── 書き出しの小窓 ───────────────────── */
async function exportDialog(cid, name){
  const res = await modal((box, done) => {
    box.appendChild(el("h4", null, cid ? `「${name}」を書き出す` : "書き出す"));
    box.appendChild(el("div", "mt", "想起のフォルダの export に書き出します。"));
    const f = el("div", "mf");
    const mode = el("select", "txt");
    for(const [v, lab] of (cid ? [["lora","LoRA 学習データ"]] : [["sheet","キャラ設定シート（HTML）"],["lora","LoRA 学習データ（全員）"],["both","両方"]])){
      const o = el("option", null, lab); o.value = v; mode.appendChild(o);
    }
    const auto = el("label", "row"); const ac = el("input"); ac.type = "checkbox";
    auto.append(ac, el("span", null, "自動で入った絵も含める（ふだんは確定だけ）"));
    const mx = el("input", "txt"); mx.type = "number"; mx.value = 200; mx.min = 10; mx.max = 2000; mx.style.width = "90px";
    const mxr = el("label", "row"); mxr.append(el("span", "hint", "1 人あたりの上限"), mx);
    f.append(mode, auto, mxr);
    box.appendChild(f);
    const bs = el("div", "mbtns");
    const c = el("button", "btn ghost", "やめる"); c.onclick = () => done(null);
    const ok = el("button", "btn primary", "書き出す");
    ok.onclick = () => done({mode: mode.value, include_auto: ac.checked, max: +mx.value || 200});
    bs.append(c, ok); box.appendChild(bs);
  });
  if(!res) return;
  toast("書き出しています…");
  try{
    const r = await post("/api/chara/export", Object.assign(res, cid ? {ids:[cid]} : {}, {open:true}));
    if(r.error) return toast(r.error, "bad");
    const det = [];
    if(r.sheet) det.push(`設定シート ${r.sheet.characters} 人 → ${r.sheet.path}`);
    if(r.lora) for(const l of r.lora) det.push(`${l.character || ""} ${l.images} 枚 → ${l.path}`);
    toast("書き出しました", "good", det.join("\n"), 12000);
  }catch(e){ fail(e, "書き出せませんでした"); }
}

/* ── キー操作 ─────────────────────────── */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key === "Escape"){
    if($("#lightbox").classList.contains("open")) $("#lightbox").classList.remove("open");
    else if($("#drawer").classList.contains("open")) closeDrawer();
    return;
  }
  if(typing || $("#modal").classList.contains("open")) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); return; }
  if(S.fb && S.fb.view === "faces"){
    if(e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); S.fb.go(S.fb.page + 1); }
    else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); S.fb.go(S.fb.page - 1); }
    else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a"){ e.preventDefault(); S.fb.markPage(true); }
  }
});

/* ── 起動 ─────────────────────────────── */
(async function boot(){
  await checkVersion();
  await loadStatus();
  pollJobs();
  render();
  setInterval(async () => { if(!document.hidden){ await refreshCounts(); } }, 20000);
})();
</script>
